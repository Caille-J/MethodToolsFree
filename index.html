    assert(res.crees === 1, "1 ligne devrait être créée, reçu " + res.crees);
    assert(d.lignes.find(l => l.abrev === "A").nom === "Ligne A modifiée", "Le nom doit être mis à jour");
    assert(d.lignes.find(l => l.abrev === "A").contratId === "c1", "Le contrat doit être relié par nom");
    assert(!!d.lignes.find(l => l.abrev === "B"), "La nouvelle ligne B doit exister");
  });

  test("Export TSV : en-têtes et lignes alignés", () => {
    const d = Noyau.instanceNeuve();
    d.lignes.push({ id: "l1", abrev: "A", nom: "Ligne A", reseauId: null, activite: "Urbaine", mode: "Autobus", vehicules: [], energies: [], fonctions: [] });
    const tsv = Noyau.exporterTSV(d, ["abrev", "nom"]);
    const lignes = tsv.split("\n");
    assert(lignes[0] === "abrev\tnom", "En-tête TSV incorrect : " + lignes[0]);
    assert(lignes[1] === "A\tLigne A", "Ligne TSV incorrecte : " + lignes[1]);
  });

  test("Isolation : modifier une copie ne touche jamais l'original", () => {
    const d1 = Noyau.instanceNeuve();
    d1.lignes.push({ id: "l1", abrev: "A", nom: "Ligne A", reseauId: null, activite: "Urbaine", mode: "Autobus", vehicules: [], energies: [], fonctions: [] });
    const d2 = JSON.parse(JSON.stringify(d1)); // copie profonde, comme la duplication réelle
    d2.lignes[0].nom = "Modifié dans la copie";
    assert(d1.lignes[0].nom === "Ligne A", "L'original ne doit jamais être modifié par la copie");
  });
    /* ---- V1.12 : la fiche modules (contrat de branchement) ---- */
  test("Fiche modules : enregistrement, doublon d'id refusé, vue branchée", () => {
    const avant = Hastus.modulesDeclares().length;
    const r = Hastus.enregistrerModule({ id: "test-topo", version: "9", onglet: "🧪 Topo test",
      vue: (d, core) => {
        assert(d && d.catalogue, "Le module doit recevoir les données de l'instance");
        assert(core.h && core.sauver, "Le module doit recevoir la fiche (h, sauver…)");
        return core.h("<p>ok</p>");
      } });
    assert(r.ok, "L'enregistrement devrait réussir : " + (r.erreur || ""));
    assert(Hastus.modulesDeclares().length === avant + 1, "Le module doit être listé");
    const r2 = Hastus.enregistrerModule({ id: "test-topo", version: "9", onglet: "Doublon", vue: () => null });
    assert(!r2.ok, "Un doublon d'id doit être refusé");
    const r3 = Hastus.enregistrerModule({ onglet: "Sans id", vue: () => null });
    assert(!r3.ok, "Un module sans id doit être refusé");
    Hastus._retirer("test-topo");   // nettoyage : le test ne pollue pas l'appli
    assert(Hastus.modulesDeclares().length === avant, "Le retrait interne doit nettoyer la liste");
  });
  test("Fiche modules : un module qui plante ne bloque pas les autres", () => {
    const avant = Hastus.modulesDeclares().length;
    const r = Hastus.enregistrerModule({ id: "test-casse", version: "9", onglet: "💥", vue: () => { throw new Error("boom"); } });
    assert(r.ok, "Un module défaillant doit quand même s'enregistrer (isolation)");
    let remonte = false;
    try { Hastus.modulesDeclares().find(m => m.id === "test-casse").vue({ catalogue: {} }, Hastus.core); }
    catch (e) { remonte = true; }
    assert(remonte, "L'erreur du module doit remonter à l'appelant (l'espace de travail la capte), pas être avalée");
    const rOk = Hastus.enregistrerModule({ id: "test-sain", version: "9", onglet: "✅", vue: () => h("<p>ok</p>") });
    assert(rOk.ok, "Un module sain doit pouvoir s'enregistrer après un défaillant");
    Hastus._retirer("test-casse"); Hastus._retirer("test-sain");
    assert(Hastus.modulesDeclares().length === avant, "Nettoyage complet");
  });

  /* ---- V2.1 : tests du module topo (exécutés SEULEMENT si le module est
     chargé : la V1 sans module reste à 22/22, avec le module : 24/24). ---- */
  if (typeof Topo !== "undefined") {
    test("Topo : schéma versionné + lieu créé, doublon d'abréviation refusé", () => {
      const d = Noyau.instanceNeuve();
      const t = Topo.init(d);
      assert(t.version === "topo-4" && Array.isArray(t.lieux), "d.topo doit exister au schéma topo-4");
      const r = Topo.creerLieu(d, { nom: "Place de la République", abrev: "REP", lat: 1, lng: 2 });
      assert(r.ok, "La création d'un lieu valide doit réussir : " + (r.erreurs || []).join(" "));
      assert(t.lieux.length === 1 && t.lieux[0].id[0] === "t", "Le lieu doit être stocké avec un id topo");
      const r2 = Topo.creerLieu(d, { nom: "Gare", abrev: "rep", lat: 3, lng: 4 });
      assert(!r2.ok, "Un doublon d'abréviation (même casse) doit être refusé");
      const r3 = Topo.creerLieu(d, { nom: "", abrev: "GAR" });
      assert(!r3.ok, "Un lieu sans nom doit être refusé");
    });
    test("Topo : module branché + données vivant dans l'instance (persistantes)", () => {
      assert(Hastus.modulesDeclares().some(m => m.id === "topo"), "Le module topo doit être enregistré");
      const d = Noyau.instanceNeuve();
      Topo.init(d);
      assert(d.topo !== undefined, "L'espace topo doit vivre DANS les données de l'instance");
    });
        test("Topo : un nouvel arrêt génère un lieu du même nom aux mêmes coordonnées", () => {
      const d = Noyau.instanceNeuve(); Topo.init(d);
      const r = Topo.creerArret(d, { nom: "Gare Centre", abrev: "GCE", lat: 48.1, lng: -1.6 });
      assert(r.ok, "La création d'arrêt doit réussir");
      assert(d.topo.lieux.length === 1, "Un lieu doit être créé automatiquement");
      assert(d.topo.lieux[0].nom === "Gare Centre" && d.topo.lieux[0].lat === 48.1 && d.topo.lieux[0].lng === -1.6, "Le lieu porte le même nom et les mêmes coordonnées");
      assert(d.topo.arrets[0].lieuId === d.topo.lieux[0].id, "L'arrêt doit être rattaché au lieu créé");
    });
    test("Topo : rattacher un arrêt à un lieu existant n'en crée pas un nouveau", () => {
      const d = Noyau.instanceNeuve(); Topo.init(d);
      const r1 = Topo.creerArret(d, { nom: "Place", abrev: "PL", lat: 1, lng: 2 });
      const lieuId = r1.lieu.id;
      const r2 = Topo.creerArret(d, { nom: "Arrêt 2", abrev: "A2", lieuId: lieuId, lat: 1, lng: 2 });
      assert(r2.ok && d.topo.lieux.length === 1, "Aucun lieu supplémentaire ne doit être créé");
      assert(r2.arret.lieuId === lieuId, "L'arrêt est rattaché au lieu existant");
    });
    test("V2.6 : champs GTFS des arrêts et lieux (validation)", () => {
      const d = Noyau.instanceNeuve(); Topo.init(d);
      const r = Topo.creerArret(d, { nom: "Gare", abrev: "GAR", lat: 48.1, lng: -1.6 });
      assert(r.ok, "La création d'arrêt doit réussir");
      /* Le GPS est désormais OBLIGATOIRE (GTFS stop_lat / stop_lon). */
      const rSansGps = Topo.creerArret(d, { nom: "Sans GPS", abrev: "SGPS", lieuId: r.lieu.id });
      assert(!rSansGps.ok, "Un arrêt sans coordonnées doit être refusé (V2.6)");
      /* Le nom est limité à 32 caractères (GTFS stop_name). */
      const rNomLong = Topo.creerLieu(d, { nom: "X".repeat(33), abrev: "LONG", lat: 1, lng: 2 });
      assert(!rNomLong.ok, "Un nom de plus de 32 caractères doit être refusé (V2.6)");
      /* parent_station : interdit sur une gare (location_type 1), et doit
         désigner l'abréviation d'un lieu ou arrêt existant. */
      const rp = Topo.modifierArret(d, r.arret.id, { nom: "Gare", abrev: "GAR", gtfs: { locationType: 2, parentStation: "GAR" } });
      assert(!rp.ok, "Un objet ne peut pas être son propre parent (V2.6)");
      const rp2 = Topo.modifierArret(d, r.arret.id, { nom: "Gare", abrev: "GAR", gtfs: { locationType: 2, parentStation: "INCONNU" } });
      assert(!rp2.ok, "Un parent inexistant doit être refusé (V2.6)");
      const rp3 = Topo.modifierArret(d, r.arret.id, { nom: "Gare", abrev: "GAR", gtfs: { locationType: 1, parentStation: "GAR" } });
      assert(!rp3.ok, "Une gare / station (type 1) ne peut pas avoir de parent (V2.6)");
      const rp4 = Topo.modifierArret(d, r.arret.id, { nom: "Gare", abrev: "GAR", gtfs: { locationType: 0, parentStation: "GAR", stopUrl: "x".repeat(129) } });
      assert(!rp4.ok, "Une URL de plus de 128 caractères doit être refusée (V2.6)");
      const rl2 = Topo.creerLieu(d, { nom: "Pôle Nord", abrev: "PNORD", lat: 48.2, lng: -1.7 });
      assert(rl2.ok, "La création du second lieu doit réussir");
      const rok = Topo.modifierArret(d, r.arret.id, { nom: "Gare", abrev: "GAR", gtfs: { locationType: 2, parentStation: "PNORD" } });
      assert(rok.ok, "Un arrêt peut avoir un lieu existant comme parent (V2.6) : " + ((rok.erreurs || []).join(" ")));
      const g = d.topo.arrets[0].gtfs;
      assert(g.locationType === 2 && g.parentStation === "PNORD" && g.timezone === "Europe/Paris",
        "Les champs GTFS doivent être enregistrés, avec le fuseau Europe/Paris par défaut (V2.6)");
      /* La fusion : modifier un seul champ GTFS ne doit pas effacer les autres. */
      Topo.modifierArret(d, r.arret.id, { nom: "Gare", abrev: "GAR", gtfs: { wheelchair: 1 } });
      assert(d.topo.arrets[0].gtfs.parentStation === "PNORD" && d.topo.arrets[0].gtfs.wheelchair === 1,
        "Un champ GTFS modifié ne doit pas effacer les autres (fusion, V2.6)");
      /* Zones du catalogue proposées pour zone_id. */
      assert(d.catalogue["Zones"] && Array.isArray(d.catalogue["Zones"].labels), "L'onglet Zones doit exister dans le catalogue (V2.6)");
    });
    test("V2.3/V2.4 : modifierArret/supprimerArret — GPS PROPRE à l'arrêt", () => {
      const d = Noyau.instanceNeuve(); Topo.init(d);
      const r1 = Topo.creerArret(d, { nom: "Gare", abrev: "GAR", lat: 48.1, lng: -1.6 });
      const r2 = Topo.creerArret(d, { nom: "Halles", abrev: "HAL", lat: 1, lng: 2 });
      assert(r1.ok && r2.ok, "Les 2 créations doivent réussir");
      const idA = r1.arret.id, idLieu = r1.arret.lieuId;
      const rm = Topo.modifierArret(d, idA, { nom: "Gare Centre", abrev: "GCE", lieuId: idLieu, lat: 5, lng: 6 });
      assert(rm.ok, "La modification doit réussir : " + (rm.erreurs || []).join(" "));
      assert(d.topo.arrets.find(a => a.id === idA).abrev === "GCE", "L'arrêt doit être renommé");
      assert(d.topo.arrets.find(a => a.id === idA).lat === 5 && d.topo.arrets.find(a => a.id === idA).lng === 6, "La coordonnée modifiée doit s'appliquer à l'ARRÊT");
      assert(d.topo.lieux.find(l => l.id === idLieu).lat === 48.1, "Le LIEU ne doit PAS bouger quand on déplace l'arrêt (V2.4)");
      const rd = Topo.modifierArret(d, idA, { nom: "X", abrev: "hal" });
      assert(!rd.ok, "Un doublon d'abréviation d'arrêt doit être refusé (même casse)");
      const rs = Topo.supprimerArret(d, idA);
      assert(rs.ok && d.topo.arrets.length === 1 && d.topo.lieux.length === 2, "L'arrêt supprimé, son lieu conservé");
      assert(Topo.supprimerLieu(d, idLieu).ok, "Le lieu devenu libre est supprimable");
    });
    test("V2.4 : lieu avec caractéristique + GPS indépendant + migration topo-3", () => {
      const d = Noyau.instanceNeuve(); Topo.init(d);
      const rl = Topo.creerLieu(d, { nom: "Gare Sud", abrev: "GSUD", lat: 47.5, lng: -2.0 });
      assert(rl.ok, "créerLieu doit réussir");
      /* Simulation d'une instance ANCIENNE (topo-2) : l'arrêt ne porte pas
         de GPS, c'est son lieu qui les porte. On rétrograde PUIS on
         ré-appelle init : la migration doit copier le GPS du lieu. */
      d.topo.arrets.push({ id: "tZZ", nom: "Quai 1", abrev: "Q1", lieuId: rl.lieu.id, codes: {} });
      d.topo.version = "topo-2";
      Topo.init(d);                                  // déclenche la migration topo-3
      assert(d.topo.arrets[0].lat === 47.5 && d.topo.arrets[0].lng === -2.0, "La migration doit copier le GPS du lieu sur l'arrêt existant");
      /* Caractéristique du lieu (gare, passerelle… cf. GTFS). */
      const rc = Topo.modifierLieu(d, rl.lieu.id, { nom: "Gare Sud", abrev: "GSUD", caract: "Passerelle" });
      assert(rc.ok && d.topo.lieux.find(l => l.id === rl.lieu.id).caract === "Passerelle", "La caractéristique du lieu doit être enregistrée");
      /* Déplacer le lieu ne touche pas les arrêts, et réciproquement. */
      Topo.modifierLieu(d, rl.lieu.id, { nom: "Gare Sud", abrev: "GSUD", lat: 10, lng: 20 });
      assert(d.topo.arrets[0].lat === 47.5, "Déplacer le lieu ne doit pas déplacer l'arrêt");
      Topo.modifierArret(d, d.topo.arrets[0].id, { lat: 30, lng: 40 });
      assert(d.topo.lieux.find(l => l.id === rl.lieu.id).lat === 10, "Déplacer l'arrêt ne doit pas déplacer le lieu");
    });
    test("V2.3 : supprimerLieu refusé si un arrêt y est rattaché ; modifierLieu ok", () => {
      const d = Noyau.instanceNeuve(); Topo.init(d);
      const r = Topo.creerArret(d, { nom: "Gare", abrev: "GAR", lat: 1, lng: 2 });
      const idLieu = r.arret.lieuId;
      assert(!Topo.supprimerLieu(d, idLieu).ok, "La suppression d'un lieu utilisé doit être refusée");
      const rm = Topo.modifierLieu(d, idLieu, { nom: "Gare TGV", abrev: "GTGV", lat: 3, lng: 4 });
      assert(rm.ok, "modifierLieu doit réussir : " + (rm.erreurs || []).join(" "));
      assert(d.topo.lieux.find(l => l.id === idLieu).nom === "Gare TGV" && d.topo.lieux.find(l => l.id === idLieu).lat === 3, "Le lieu doit être modifié");
    });
  }

  // Affichage du rapport de tests.
  const ok = results.filter(r => r.ok).length;
  const rapport = h(`<div>
    <h2>🧪 Tests automatiques — ${ok}/${results.length} réussis</h2>
    ${results.map(r => `<div class="carte" style="margin:6px 0;padding:8px 14px;">
      <span class="${r.ok ? "tests-ok" : "tests-ko"}">${r.ok ? "✅" : "❌"} ${esc(r.nom)}</span>
      ${r.msg ? `<div class="erreur">${esc(r.msg)}</div>` : ""}</div>`).join("")}
    <p class="info-txt">Ces tests vérifient les règles métier du noyau. Relancez-les après chaque modification :
    si un test échoue, la fonctionnalité correspondante a régressé.</p>
    <div class="ligne-boutons"><button id="m-fermer" class="b-bleu">Fermer</button></div>
  </div>`);
  rapport.querySelector("#m-fermer").onclick = () => rapport.closest(".modal-fond").remove();
  modal(rapport);
}
  
/* ============ 5. FICHE MODULES (V1.12) : le point de branchement ============ */
/* Contrat : la V1 reste maîtresse de ses données. Un module ne modifie JAMAIS
   les données en direct — il passe par Hastus.core (données de l'instance
   ouverte, sauvegarde, fabrique d'éléments, rafraîchissement…).
   Un module (fichier <script> séparé, chargé APRÈS celui-ci) s'enregistre :
     Hastus.enregistrerModule({
       id: "topo",              // identifiant unique du module
       version: "2.0",          // version du module
       onglet: "🗺️ Topologie",  // libellé de l'onglet ajouté à l'espace de travail
       init(core) {...},        // optionnel : appelé une fois à l'enregistrement
       vue(donnees, core) {...} // appelé à chaque affichage de l'onglet
     });
   Si le fichier du module est absent (ou en échec) : la V1 fonctionne
   normalement, l'onglet n'apparaît pas. C'est l'indépendance voulue. */
const Hastus = (() => {
  const modules = [];
  const core = () => ({
    version: "1.12",
    donnees: () => BD.donneesInstance(App.instanceOuverte.id), // données de l'instance ouverte (lecture seule)
    sauver: () => BD.sauver(),                                  // seule porte d'entrée des écritures
    instance: () => App.instanceOuverte,
    h, esc, modal, rafraichir, afficherErreur, LIMITES
  });
  function enregistrerModule(m) {
    try {
      if (!m || !m.id || !m.onglet || typeof m.vue !== "function")
        return { ok: false, erreur: "Module invalide : id, onglet et vue() requis." };
      if (modules.some(x => x.id === m.id))
        return { ok: false, erreur: "Un module portant cet id est déjà enregistré." };
      modules.push({ id: m.id, version: m.version || "?", onglet: m.onglet, vue: m.vue });
      if (typeof m.init === "function") m.init(core());
      return { ok: true };
    } catch (e) {
      afficherErreur("Module '" + (m && m.id) + "' : " + e.message);
      return { ok: false, erreur: e.message };
    }
  }
  /* Retrait interne (réservé aux tests : un module enregistré par la suite
     de tests ne doit pas polluer l'interface réelle). */
  function _retirer(id) {
    const i = modules.findIndex(x => x.id === id);
    if (i >= 0) modules.splice(i, 1);
  }
  return { enregistrerModule, modulesDeclares: () => modules.slice(),
           _retirer, get core() { return core(); } };
})();
window.Hastus = Hastus;

/* ============ Démarrage ============ */
BD.charger();
rafraichir();
</script>
