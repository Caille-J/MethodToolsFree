<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HASTUS libre – V1 : Définition de réseau</title>
<style>
  /* ============ Style général — design system « V2 » (reprise des formes
     et couleurs du prototype, appliquée à TOUTES les fonctionnalités
     existantes de la V1.7 : rien n'est retiré). ============ */
  :root {
    --bg: #edf3fb; --bg-strong: #e7eef9;
    --panel: rgba(255,255,255,0.9); --panel-strong: #ffffff;
    --panel-soft: #f3f8ff; --panel-alt: #f5f7fb;
    --line: #dfe8f4; --line-strong: #c7d7ee;
    --text: #112236; --muted: #586d86;
    --primary: #1266e5; --primary-strong: #0a4ab5;
    --secondary: #1db4a6; --secondary-strong: #108a7c;
    --warning: #f59e0b; --warning-soft: #fff4de;
    --danger: #ef4444; --danger-soft: #fff1f2;
    --success: #1ead67; --success-soft: #ebfff5;
    --shadow: 0 20px 46px rgba(15, 28, 56, 0.12);
    --shadow-soft: 0 8px 22px rgba(17, 38, 74, 0.08);
    --radius: 20px; --radius-md: 16px; --radius-sm: 12px; --radius-xs: 10px;
    --header-h: 76px;
    font-family: Inter, "Segoe UI", system-ui, sans-serif; color: var(--text);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(circle at top left, rgba(18,102,229,0.15), transparent 25%),
      radial-gradient(circle at bottom right, rgba(29,180,166,0.12), transparent 30%),
      var(--bg);
  }
  /* ---- Barre supérieure (toutes les vues) ---- */
  .topbar {
    min-height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; gap: 12px; flex-wrap: wrap;
    background: rgba(255,255,255,0.8); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(145,164,190,0.25);
    position: sticky; top: 0; z-index: 30;
  }
  .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: 0.025em; color: var(--text); }
  .brand-mark {
    width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 12px; background: linear-gradient(135deg, rgba(18,102,229,0.12), rgba(29,180,166,0.18));
    color: var(--primary); font-size: 1.2rem;
  }
  .logo { font-weight: 800; color: var(--text); font-size: 17px; cursor: pointer; background: none; border: none; }
  .conteneur { width: min(1210px, calc(100% - 32px)); margin: 22px auto 14px; padding: 0; }
  h1, h2, h3 { margin: 0 0 12px; }
  h1 { font-size: clamp(1.6rem, 2.4vw, 2.1rem); }
  h2 { font-size: 1.35rem; }
  h3 { font-size: 1.1rem; }
  /* ---- Cartes, badges, étiquettes ---- */
  .carte { background: rgba(255,255,255,0.88); border: 1px solid rgba(148,163,184,0.2); border-radius: var(--radius); box-shadow: var(--shadow-soft); padding: 14px 16px; margin-bottom: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
  .etiquette { display: inline-flex; align-items: center; min-height: 26px; padding: 3px 10px; border-radius: 999px; background: var(--panel-soft); border: 1px solid rgba(148,163,184,0.25); color: var(--muted); font-size: 12px; font-weight: 700; }
  .etiquette.pub { background: var(--success-soft); border-color: rgba(30,173,103,0.25); color: #0d7d48; }
  .etiquette.prive { background: var(--danger-soft); border-color: rgba(239,68,68,0.25); color: #b42318; }
  .etiquette.alerte { background: var(--warning-soft); border-color: rgba(245,158,11,0.3); color: #92400e; }
  /* ---- Boutons ---- */
  button { cursor: pointer; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--panel-strong); color: var(--text); padding: 9px 13px; font-size: 13px; font-weight: 600; transition: all 0.18s ease; box-shadow: 0 1px 0 rgba(15,28,56,0.03); }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .b-bleu { background: linear-gradient(135deg, var(--primary), var(--primary-strong)); border-color: var(--primary); color: #fff; box-shadow: 0 12px 24px rgba(18,102,229,0.2); }
  .b-bleu:hover { background: linear-gradient(135deg, var(--primary), var(--primary-strong)); }
  .b-vert { background: linear-gradient(135deg, var(--secondary), var(--secondary-strong)); border-color: var(--secondary); color: #fff; }
  .b-vert:hover { background: linear-gradient(135deg, var(--secondary), var(--secondary-strong)); }
  button.danger { background: linear-gradient(135deg, var(--danger), #dc2626); border-color: var(--danger); color: #fff; }
  button.petit { padding: 6px 9px; font-size: 12px; }
  /* ---- Onglets de l'espace de travail ---- */
  .onglets { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px; border-radius: 14px; background: rgba(148,163,184,0.08); border: 1px solid rgba(148,163,184,0.18); }
  .onglet { background: transparent; border: 1px solid transparent; border-radius: 10px; color: var(--muted); font-weight: 700; padding: 9px 14px; }
  .onglet.actif { background: linear-gradient(180deg, rgba(18,102,229,0.09), rgba(18,102,229,0.04)); border-color: rgba(18,102,229,0.16); color: var(--primary-strong); }
  /* ---- V2.1-ergo : logo cliquable + bande des modules (topbar) ---- */
  button.brand { border: none; background: none; box-shadow: none; padding: 4px 8px; border-radius: 12px; cursor: pointer; }
  button.brand:hover { transform: none; background: rgba(18,102,229,0.08); }
  .bande-modules { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sous-onglets { margin: 0 0 14px; }
     /* ---- V2.2.1 : écran Topologie (cartouches-filtres, explorateur, carte) ---- */
  .topo-plein { display: flex; flex-direction: column; height: calc(100vh - 118px); }
  .cartouches { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; position: relative; align-items: center; }
  .filtres-libelle { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 2px; }
  .cartouche { border-radius: 999px; padding: 11px 20px; font-size: 15px; cursor: pointer; font-weight: 700; border: 2px solid rgba(18,102,229,0.3); background: #fff; box-shadow: var(--shadow-soft); display: inline-flex; align-items: center; gap: 10px; }
  .cartouche .loupe { opacity: 0.6; font-weight: 400; font-size: 15px; }
  .cartouche.actif { background: var(--primary); color: #fff; border-color: var(--primary); }
  .cartouche-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 3000; background: #fff; border: 1px solid rgba(148,163,184,0.3); border-radius: 14px; box-shadow: rgba(15,23,42,0.18) 0 12px 28px; padding: 10px; min-width: 300px; max-width: 360px; }
  .cp-liste { overflow: auto; max-height: 200px; display: flex; flex-direction: column; margin: 8px 0; }
  .item-coche { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
  .item-coche:hover { background: rgba(18,102,229,0.08); }
  .topo-onglets { margin: 0 0 16px; }
  .onglet.arme { background: var(--secondary); border-color: var(--secondary); color: #fff; }
  .topo-disposition { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }
  .explorateur { height: 100%; overflow: auto; padding: 14px; }
  .explorateur h4 { margin: 12px 0 6px; }
  .item-objet { padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .item-objet:hover { background: rgba(18,102,229,0.08); }
  .item-objet.sel { background: rgba(18,102,229,0.16); outline: 1px solid var(--primary); }
  .item-objet.grise { opacity: 0.4; }
  .topo-carte { position: relative; height: 100%; min-height: 0; border-radius: 20px; overflow: hidden; background: #e5eaf0; }
  .topo-carte > div:first-child { position: absolute; inset: 0; height: 100%; }
    .topo-carte #topo-carte-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; pointer-events: none; }
    /* ---- V2.3 : croix ✕ de l'explorateur, surbrillance de survol,
         tableau des arrêts plein écran (défilement interne) ---- */
    .item-objet .obj-suppr { float: right; border: none; background: none; color: #94a3b8; font-weight: 800; padding: 0 4px; cursor: pointer; font-size: 13px; }
    .item-objet .obj-suppr:hover { color: var(--danger); }
    .item-objet .obj-suppr.armed { color: #fff; background: var(--danger); border-radius: 6px; }
    .item-objet.survol { background: rgba(29,180,166,0.22); outline: 1px solid var(--secondary); }
    .tableau-page .enveloppe-table { max-height: calc(100vh - 310px); min-height: 180px; }
    #contenu .enveloppe-table { max-height: calc(100vh - 330px); overflow-y: auto; min-height: 140px; }
    /* V2.4 : la liste Réseaux & contrats défile EN INTERNE (comme les
       tableaux) — sinon son contenu pousse la page au-delà de l'écran. */
    #contenu #liste { overflow-y: auto; min-height: 120px; }
    /* V2.4 : titres de catégories PLIABLES de l'explorateur topologie. */
    .explo-titre { cursor: pointer; user-select: none; }
    .explo-titre:hover { color: var(--primary); }
  /* IMPORTANT (bug V2.2.1) : pour que les fenêtres modales (pop-up ⚙,
     création d'arrêt…) passent AU-DESSUS de la carte Leaflet (dont les
     calques vont jusqu'à z-index 1000), le z-index: 3000 est réglé
     DIRECTEMENT dans la règle .modal-fond de la section « Fenêtres
     modales ». Une règle placée ICI (plus haut dans le fichier) serait
     écrasée par la règle d'origine : à priorité égale, la DERNIÈRE
     règle du fichier gagne. */
  @media (max-width: 900px) { .topo-disposition { grid-template-columns: 1fr; } }
  /* ---- Grille d'instances (accueil) : auto-fit, cartes à badges ---- */
  .grille-instances { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-top: 18px; }
  .carte.instance-carte { display: block; background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(244,249,255,0.9)); }
  .carte.instance-carte h3 { margin: 0 0 8px; font-size: 1.15rem; }
  .carte.instance-carte .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
  .carte.instance-carte .actions-haut { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
  .carte.instance-carte .actions-haut:not(:empty) { margin: 0 0 10px; }
  .carte.instance-carte .desc { color: var(--muted); line-height: 1.6; min-height: 44px; margin-bottom: 12px; font-size: 13px; }
  .carte.instance-carte .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  /* ---- Capsules statistiques (page d'accueil de l'instance) ---- */
  .resume { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 18px; }
  .stat { display: block; background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(244,249,255,0.92)); border: 1px solid rgba(148,163,184,0.2); border-radius: var(--radius); box-shadow: var(--shadow-soft); padding: 16px 18px 14px; margin: 0; }
  .stat .libelle { display: block; margin-bottom: 8px; color: var(--muted); font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat .valeur { font-size: clamp(1.5rem, 2vw, 2rem); font-weight: 800; line-height: 1; }
  .stat .valeur small { font-size: 0.62em; font-weight: 700; color: var(--muted); margin-left: 6px; }
  /* ---- Panneau « tableau de gestion des lignes » + barre de filtres ---- */
  .panneau-travail { display: block; padding: 18px; background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(244,248,255,0.82)); border: 1px solid rgba(148,163,184,0.2); border-radius: var(--radius); box-shadow: var(--shadow-soft); }
  .barre-outils { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .barre-outils .titre { font-weight: 800; letter-spacing: 0.02em; color: var(--text); }
  .barre-outils .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .barre-filtres { display: grid; grid-template-columns: 1.6fr repeat(4, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; padding: 14px; border: 1px solid rgba(148,163,184,0.18); border-radius: 14px; background: rgba(245,249,255,0.9); }
  .barre-filtres .champ { margin: 0; }
  .barre-filtres label { margin-bottom: 6px; font-size: 0.72rem; }
  .barre-filtres input, .barre-filtres select { min-height: 38px; padding: 8px 10px; font-size: 0.9rem; }
  @media (max-width: 900px) { .barre-filtres { grid-template-columns: 1fr 1fr; } }
  /* ---- Tableaux ---- */
  table { width: 100%; border-collapse: collapse; background: transparent; font-size: 13px; }
  th { background: linear-gradient(180deg, rgba(230,238,250,0.98), rgba(225,234,246,0.96)); text-align: left; padding: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border-bottom: 1px solid rgba(148,163,184,0.2); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid rgba(148,163,184,0.12); vertical-align: middle; background: rgba(255,255,255,0.5); }
  tr:hover td { background: rgba(18,102,229,0.03); }
  .enveloppe-table { border: 1px solid rgba(148,163,184,0.18); border-radius: 14px; overflow-x: auto; width: 100%; background: rgba(255,255,255,0.82); }
  .enveloppe-table table { min-width: 100%; }
  /* Tableau du catalogue : défilement (vertical ET horizontal) quand il y a
     beaucoup de colonnes, et largeur de colonne jamais inférieure au contenu. */
  .tableau-refs { max-height: 62vh; overflow: auto; }
  .tableau-refs td input { width: 100%; min-width: 140px; }
  .tableau-refs td.cell-std, .tableau-refs td.cell-loc { white-space: nowrap; }
  /* Listes à sélection multiple (fenêtre ligne) : chaque terme cliquable
     affiche une coche ✓ quand il est retenu ; champ de filtre + bouton de tri. */
  .liste-multi .multi-entete { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
  .multi-liste { border: 1px solid var(--line-strong); border-radius: 12px; max-height: 170px; overflow-y: auto; background: rgba(255,255,255,0.75); }
  .multi-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(148,163,184,0.12); }
  .multi-item:hover { background: rgba(18,102,229,0.07); }
  .multi-item.sel { background: rgba(29,180,166,0.15); font-weight: 600; }
  .multi-item .coche { width: 18px; color: var(--secondary); font-weight: 700; flex: none; }
  td.cell-std { background: rgba(18,102,229,0.07); }
  td.cell-loc { background: var(--warning-soft); }
  th.th-oblig { background: linear-gradient(180deg, #ecfeff, #e0f7fa); color: #155e75; }
  .ico { border: none; background: none; padding: 2px 4px; font-size: 14px; cursor: pointer; color: var(--muted); }
  .ico:hover { color: var(--primary); }
  /* ---- Champs de saisie ---- */
  input, select, textarea { border: 1px solid var(--line-strong); background: rgba(248,250,252,0.95); color: var(--text); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-family: inherit; width: 100%; outline: none; transition: border-color 0.18s ease, box-shadow 0.18s ease; }
  input:focus, select:focus, textarea:focus { border-color: rgba(18,102,229,0.72); box-shadow: 0 0 0 4px rgba(18,102,229,0.12); background: #fff; }
  textarea { resize: vertical; }
  .champ { margin-bottom: 12px; }
  .champ label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--muted); }
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .grille { grid-template-columns: 1fr; } }
  .libelle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-strong); border-radius: 10px; padding: 4px 10px; font-size: 13px; margin: 3px; }
  .libelle button { border: none; background: none; padding: 0 2px; color: #94a3b8; }
  .libelle button:hover { color: var(--primary); }
  /* ---- Fenêtres modales ---- */
  .modal-fond { position: fixed; inset: 0; background: rgba(15,23,42,0.54); display: flex; align-items: center; justify-content: center; z-index: 3000; padding: 18px; }
  .modal { background: rgba(255,255,255,0.97); border: 1px solid rgba(148,163,184,0.2); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; }
  .ligne-boutons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  /* ---- Suppression sensible (double clic en 3 s) ---- */
  .suppr { position: relative; overflow: hidden; border: 1px solid var(--danger); background: linear-gradient(135deg, var(--danger), #dc2626); color: #fff; font-weight: 700; font-size: 12px; }
  .suppr.armed { background: #b91c1c; color: #fff; border-color: #b91c1c; }
  .suppr .barre { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,0.28); width: 100%; }
  .suppr.armed .barre { animation: vide 3s linear forwards; }
  @keyframes vide { from { width: 100%; } to { width: 0%; } }
  /* ---- Menu ⚙ Colonnes (panneau ancré) ---- */
  .menu-col { position: relative; display: inline-block; }
  .panneau { position: absolute; right: 0; top: 100%; background: var(--panel-strong); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-soft); padding: 10px; width: 340px; z-index: 30; margin-top: 6px; }
  .panneau label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 13px; }
  .p-ligne { display: grid; grid-template-columns: 1fr 5fr 1fr 1fr; align-items: center; gap: 8px; padding: 6px 10px; font-size: 13px; border-bottom: 1px solid rgba(148,163,184,0.12); }
  .p-ligne input { justify-self: center; }
  .p-ligne > span { justify-self: start; }
  .p-ligne button { justify-self: center; width: 26px; height: 24px; padding: 0; }
  /* ---- Divers ---- */
  .vue-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .vue-switch button { border: none; background: var(--panel-strong); padding: 6px 12px; font-size: 13px; border-radius: 0; box-shadow: none; }
  .vue-switch button.actif { background: rgba(18,102,229,0.09); color: var(--primary-strong); font-weight: 700; }
  .erreur { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 4px; }
  .inline-flex { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .info-txt { font-size: 13px; color: var(--muted); }
  .tests-ok { color: var(--success); font-weight: 600; }
  .tests-ko { color: var(--danger); font-weight: 600; }
  .pastille { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .pastille.std { background: var(--primary); }
  .pastille.loc { background: var(--warning); }
  /* ---- Catalogue : onglets verticaux à gauche, contenu à droite ---- */
  .catalogue-disposition { display: grid; grid-template-columns: minmax(220px, 280px) 1fr; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .catalogue-disposition { grid-template-columns: 1fr; } }
  .menu-gauche { padding: 12px; background: rgba(255,255,255,0.88); border: 1px solid rgba(148,163,184,0.2); border-radius: var(--radius); box-shadow: var(--shadow-soft); }
  .menu-gauche .onglet { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; }
  .menu-gauche .onglet.onglet-gris { opacity: 0.45; cursor: not-allowed; pointer-events: none; filter: grayscale(1); }
  .panneau-catalogue { padding: 18px; background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(244,248,255,0.82)); border: 1px solid rgba(148,163,184,0.2); border-radius: var(--radius); box-shadow: var(--shadow-soft); }
  /* ---- Icône ℹ️ : au survol, une bulle sombre affiche l'explication. ---- */
  .aide-info { position: relative; cursor: help; }
  .aide-info:hover::after {
    content: attr(data-info); position: absolute; top: 120%; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: #fff; padding: 8px 10px; border-radius: 8px;
    font-size: 12px; font-weight: 400; width: 300px; white-space: normal; z-index: 60;
  }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<body>
<div id="app"></div>
<script>
/* ================================================================
   HASTUS libre – Version 1 : bloc « Définition du réseau »
   ----------------------------------------------------------------
   ARCHITECTURE MODULAIRE (chaque section est indépendante) :
   1. NOYAU   : logique métier pure, sans aucune référence à l'affichage.
                C'est cette partie que les tests automatiques vérifient.
   2. BD      : sauvegarde locale (localStorage = dans ce navigateur).
   3. VUES    : affichage des écrans (identification, accueil, espace de travail).
   4. TESTS   : suite de tests automatiques exécutée sur le noyau.
   ================================================================ */

/* ============ 1. NOYAU : logique métier pure ============ */
const Noyau = (() => {

  /* Structure de données d'une instance neuve.
     Le catalogue par défaut est aligné sur les vocabulaires NeTEx/GTFS. */
  const instanceNeuve = () => ({
    reseaux: [],   // [{id, nom, validiteDebut, validiteFin}]
    contrats: [],  // [{id, nom, reseaux:[ids], prive:true}]
    lignes: [],    // [{id, abrev, nom, reseauId, contratId, activite, mode, groupe, vehicules:[], energies:[], fonctions:[]}]
    /* Le catalogue : un « classeur » dont chaque catégorie est un onglet.
       - labels : [{nom, origine: "standard"|"local", codes: {export: "3"}}]
         "standard" = issu des référentiels GTFS/NeTEx (bleu) ;
         "local" = ajouté ou modifié par l'utilisateur (orange).
       - colonnes : colonnes de codes d'export, remplies par l'utilisateur. */
    catalogue: {
      "Activités": catNeuve(["Urbaine", "Régulière (interurbaine)", "Scolaire", "À la demande", "Navette"]),
      "Modes de transport": catNeuve([["Tramway", "0"], ["Métro", "1"], ["Autobus", "3"], ["Autocar", "3"], ["Trolleybus", "11"]],
        v => ({ nom: v[0], origine: "standard", codes: { export: v[1] } })),
      "Types de véhicule": catNeuve(["Bus standard 12 m", "Bus articulé 18 m", "Car 13 m", "Minibus"]),
      "Types d'énergie": catNeuve(["Gasoil", "HVO", "Électrique", "GNV", "Hybride"]),
      "Fonctions embarquées": catNeuve(["Wi-Fi", "PMR", "Emport vélo", "Prise USB", "Écran info voyageurs"]),
      "Groupes de lignes": catNeuve([]),  // sert au network_id des exports GTFS/NeTEx
      "Zones": catNeuve([])               // V2.6 : zones tarifaires (GTFS zone_id) proposées dans les fiches arrêts/lieux
    },
    colonnesCalculees: [], // colonnes compteur définies par l'utilisateur (onglet dédié)
    compteur: 1 // générateur d'identifiants locaux à l'instance
  });

  /* Fabrique une catégorie du catalogue : liste de labels + colonne d'export. */
  const catNeuve = (valeurs, vers) => ({
    colonnes: ["export"],
    labels: valeurs.map(vers || (v => ({ nom: v, origine: "standard", codes: {} })))
  });

  const nouvelId = (data) => "o" + (data.compteur++);

  /* Règle métier : une ligne = abréviation unique + 1 activité + 1 mode,
     plusieurs véhicules / énergies / fonctions. Retourne une liste d'erreurs. */
  function validerLigne(data, ligne, ignoreId) {
    const errs = [];
    if (!ligne.abrev || !ligne.abrev.trim()) errs.push("Abréviation obligatoire.");
    else if (ligne.abrev.trim().length > 8) errs.push("Abréviation : 8 caractères maximum.");
    else if (data.lignes.some(l => l.abrev.toLowerCase() === ligne.abrev.trim().toLowerCase()
              && l.id !== ignoreId)) errs.push("Abréviation déjà utilisée dans cette instance.");
    if (!ligne.nom || !ligne.nom.trim()) errs.push("Nom commercial obligatoire.");
    else if (ligne.nom.trim().length > 64) errs.push("Nom commercial : 64 caractères maximum.");
    if (!ligne.reseauId) errs.push("Réseau obligatoire.");
    if (!ligne.activite) errs.push("Activité obligatoire (une seule).");
    if (!ligne.mode) errs.push("Mode de transport obligatoire (un seul).");
    return errs;
  }

  /* Catalogue : ajout (doublons refusés), modification, suppression.
     origine "standard" (référentiel GTFS/NeTEx, couleur bleue) ou
     "local" (ajouté/modifié par l'utilisateur, couleur orange). */
  function ajouterLabel(data, categorie, valeur, origine) {
    const v = (valeur || "").trim().slice(0, 32);   // 32 caractères max
    const cat = data.catalogue[categorie];
    if (!v) return { ok: false, erreur: "Label vide." };
    if ((valeur || "").trim().length > 32) return { ok: false, erreur: "32 caractères maximum pour un label." };
    if (cat.labels.some(x => x.nom.toLowerCase() === v.toLowerCase()))
      return { ok: false, erreur: "Ce label existe déjà." };
    cat.labels.push({ nom: v, origine: origine || "local", codes: {} });
    return { ok: true };
  }
  function modifierLabel(data, categorie, index, valeur) {
    const v = (valeur || "").trim();
    if (!v) return { ok: false, erreur: "Label vide." };
    if (v.length > 32) return { ok: false, erreur: "32 caractères maximum pour un label." };
    const l = data.catalogue[categorie].labels[index];
    const ancien = l.nom;
    l.nom = v;
    l.origine = "local"; // un label modifié par l'utilisateur passe en orange
    // Répercussion : les lignes qui utilisaient l'ancien nom suivent le
    // renommage (sinon elles pointeraient vers un label qui n'existe plus).
    renommerDansLignes(data, categorie, ancien, v);
    return { ok: true };
  }
  function supprimerLabel(data, categorie, index) {
    const l = data.catalogue[categorie].labels[index];
    if (!l) return { ok: false, erreur: "Label introuvable." };
    // Règle métier (Jules) : un label UTILISÉ par des lignes ne se supprime pas.
    const usages = usagesLabel(data, categorie, l.nom);
    if (usages.length)
      return { ok: false, erreur: `Impossible : utilisé par ${usages.length} ligne(s) — ${usages.slice(0, 3).map(x => x.abrev).join(", ")}${usages.length > 3 ? "…" : ""}. Détachez-le d'abord (bouton 🔎).` };
    data.catalogue[categorie].labels.splice(index, 1);
    return { ok: true };
  }

  /* ---- Cartographie des usages (demande de Jules : « où est-ce utilisé ? »)
     Chaque catégorie du catalogue alimente un champ des lignes. */
  const USAGES_CATALOGUE = {
    "Activités":            { prop: "activite" },
    "Modes de transport":   { prop: "mode" },
    "Groupes de lignes":    { prop: "groupe" },
    "Types de véhicule":    { prop: "vehicules", multiple: true },
    "Types d'énergie":      { prop: "energies", multiple: true },
    "Fonctions embarquées": { prop: "fonctions", multiple: true }
  };
  /* Les lignes qui utilisent ce label du catalogue. */
  function usagesLabel(data, categorie, nom) {
    const u = USAGES_CATALOGUE[categorie];
    if (!u) return [];
    const memeNom = v => (v || "").toLowerCase() === nom.toLowerCase();
    return data.lignes.filter(l => u.multiple ? (l[u.prop] || []).some(memeNom) : memeNom(l[u.prop]));
  }
  /* Renomme un label dans toutes les lignes qui l'utilisent. */
  function renommerDansLignes(data, categorie, ancien, nouveau) {
    const u = USAGES_CATALOGUE[categorie];
    if (!u) return;
    data.lignes.forEach(l => {
      if (u.multiple) l[u.prop] = (l[u.prop] || []).map(x => x.toLowerCase() === ancien.toLowerCase() ? nouveau : x);
      else if ((l[u.prop] || "").toLowerCase() === ancien.toLowerCase()) l[u.prop] = nouveau;
    });
  }

  /* ---- Règles d'unicité et usages des réseaux / contrats ---- */
  /* Un nom identifie un objet : deux réseaux (ou deux contrats) de même
     nom sont interdits — c'est le « code unique » au niveau réseau/contrat. */
  function nomUtilise(liste, nom, ignoreId) {
    return liste.some(x => x.id !== ignoreId && x.nom.trim().toLowerCase() === nom.trim().toLowerCase());
  }
  function usagesReseau(data, id) {
    return {
      lignes: data.lignes.filter(l => l.reseauId === id),
      contrats: data.contrats.filter(c => (c.reseaux || []).includes(id))
    };
  }
  function usagesContrat(data, id) {
    return { lignes: data.lignes.filter(l => l.contratId === id) };
  }
  /* Doublons de codes d'export dans une catégorie : chaque code doit être
     unique (il identifiera le label dans les exports GTFS/NeTEx). */
  function doublonsCodes(data, categorie, colonne) {
    const vus = new Set(), doublons = new Set();
    data.catalogue[categorie].labels.forEach(l => {
      const c = (l.codes[colonne] || "").trim();
      if (c && vus.has(c)) doublons.add(c);
      vus.add(c);
    });
    return [...doublons];
  }
  /* Valeur d'une colonne calculée utilisateur (testée par la suite). */
  function valeurColCalculee(ligne, def) { return (ligne[def.cible] || []).length; }

  /* Référentiel des standards (aligné GTFS / NeTEx). Le bouton « Mettre à
     jour » de la vue Catalogue ajoute automatiquement les valeurs manquantes,
     marquées "standard" (bleu), avec leur code GTFS pré-rempli quand il
     existe (ex. route_type des modes de transport). Structure prête à être
     alimentée plus tard par une API : il suffit d'enrichir ce référentiel. */
  const REFERENTIEL = {
    "Activités": [["Navette nocturne", ""], ["Transport de substitution", ""]],
    "Modes de transport": [["Train / RER", "2"], ["Ferry / bateau", "4"], ["Téléphérique", "6"], ["Funiculaire", "7"]],
    "Types de véhicule": [["Midibus", ""], ["Bus bi-articulé 24 m", ""], ["Autocar double étage", ""]],
    "Types d'énergie": [["Hydrogène", ""], ["BioGNV", ""], ["Électrique batterie", ""]],
    "Fonctions embarquées": [["Climatisation", ""], ["Validation sans contact", ""], ["Bandeau lumineux extérieur", ""], ["Annonces sonores", ""]],
    "Groupes de lignes": []
  };
  function majReferentiel(data) {
    let ajoutes = 0;
    Object.entries(REFERENTIEL).forEach(([categorie, valeurs]) => {
      valeurs.forEach(([v, code]) => {
        const r = ajouterLabel(data, categorie, v, "standard");
        if (r.ok) {
          if (code) data.catalogue[categorie].labels[data.catalogue[categorie].labels.length - 1].codes["export"] = code;
          ajoutes++;
        }
      });
    });
    return { ajoutes };
  }

  /* Import en masse depuis Excel. Colonnes : Abrév, Nom, Réseau, Contrat,
     Activité, Mode, Groupe (l'abréviation est la clé : existante → mise à
     jour, nouvelle → création).
     Règles métier (Jules) :
     - une valeur obligatoire inconnue (réseau, activité, mode, groupe) est
       CRÉÉE automatiquement ; le badge ⚠ du catalogue rappellera qu'elle
       doit être paramétrée (code d'export) ;
     - les lignes « suspectes » (même nom commercial qu'une ligne existante)
       sont signalées pour validation avant l'import ;
     - le contrat, non obligatoire, n'est jamais créé automatiquement :
     il n'est relié que s'il existe déjà. */
  function appliquerColle(data, texte) {
    const res = { maj: 0, crees: 0, ignorees: 0, nouvellesValeurs: {}, suspects: [] };
    // OPTIMISATION : index (Maps) construits UNE fois — chaque ligne du
    // fichier est rattachée en accès direct O(1) au lieu de relire tout
    // le tableau à chaque find() (sur un gros import : très gros gain).
    const parAbrev = new Map(data.lignes.map(l => [l.abrev.toLowerCase(), l]));
    const parNomLigne = new Map(data.lignes.map(l => [l.nom.toLowerCase(), true]));
    const reseauxParNom = new Map(data.reseaux.map(r => [r.nom.toLowerCase(), r]));
    const contratsParNom = new Map(data.contrats.map(c => [c.nom.toLowerCase(), c]));
    const catLabels = {};   // catégorie → Map des labels existants (minuscules)
    const labelsCat = (cat) => catLabels[cat] ||
      (catLabels[cat] = new Map(data.catalogue[cat].labels.map(x => [x.nom.toLowerCase(), true])));
    // Crée la valeur dans le catalogue si inconnue (marquée "local", orange).
    const marquer = (cat, v) => {
      if (!labelsCat(cat).has(v.toLowerCase())) {
        labelsCat(cat).set(v.toLowerCase(), true);
        ajouterLabel(data, cat, v, "local");
        (res.nouvellesValeurs[cat] = res.nouvellesValeurs[cat] || []).push(v);
      }
    };
    // Réseau obligatoire : un nom inconnu est créé immédiatement.
    const reseauDe = (nomR) => {
      let r = reseauxParNom.get(nomR.toLowerCase());
      if (!r) {
        r = { id: nouvelId(data), nom: nomR, validiteDebut: "", validiteFin: "" };
        data.reseaux.push(r);
        reseauxParNom.set(nomR.toLowerCase(), r);
        (res.nouvellesValeurs["Réseaux"] = res.nouvellesValeurs["Réseaux"] || []).push(nomR);
      }
      return r;
    };
    const lignesCollees = texte.trim().split(/\r?\n/).filter(r => r.trim());
    lignesCollees.forEach((row, idx) => {
      const c = row.split(/\t|;/);
      // Ignore la ligne d'en-tête si elle commence par "Abrév" (cas du copier-coller depuis l'export).
      if (idx === 0 && /^abr/i.test((c[0] || "").trim())) return;
      const abrev = (c[0] || "").trim();
      if (!abrev) { res.ignorees++; return; }
      // Limites (identiques à la saisie manuelle) : abréviation 8 car.,
      // nom 64 car. — la ligne est ignorée si elle ne les respecte pas.
      if (abrev.length > 8) { res.ignorees++; return; }
      const nom = (c[1] || "").trim();
      if (nom.length > 64) { res.ignorees++; return; }
      // Champs libres (réseau, contrat, activité, mode, groupe) : 32 car.
      const reseauNom = (c[2] || "").trim().slice(0, 32);
      const contratNom = (c[3] || "").trim().slice(0, 32);
      const activite = (c[4] || "").trim().slice(0, 32);
      const mode = (c[5] || "").trim().slice(0, 32);
      const groupe = (c[6] || "").trim().slice(0, 32);
      const existante = parAbrev.get(abrev.toLowerCase());
      if (existante) {
        if (nom) { existante.nom = nom; parNomLigne.set(nom.toLowerCase(), true); }
        if (reseauNom) existante.reseauId = reseauDe(reseauNom).id;
        if (contratNom) { const ct = contratsParNom.get(contratNom.toLowerCase()); if (ct) existante.contratId = ct.id; }
        if (activite) { marquer("Activités", activite); existante.activite = activite; }
        if (mode) { marquer("Modes de transport", mode); existante.mode = mode; }
        if (groupe) { marquer("Groupes de lignes", groupe); existante.groupe = groupe; }
        res.maj++;
      } else {
        // Suspect (demande de Jules) : même nom commercial qu'une ligne
        // existante, abréviation différente → validation demandée.
        if (nom && parNomLigne.has(nom.toLowerCase()))
          res.suspects.push({ abrev, nom });
        const r = reseauNom ? reseauDe(reseauNom) : null;
        const ct = contratNom ? contratsParNom.get(contratNom.toLowerCase()) : null;
        if (activite) marquer("Activités", activite);
        if (mode) marquer("Modes de transport", mode);
        if (groupe) marquer("Groupes de lignes", groupe);
        const nouvelle = {
          id: nouvelId(data), abrev, nom,
          reseauId: r ? r.id : null, contratId: ct ? ct.id : null,
          activite, mode, groupe,
          vehicules: [], energies: [], fonctions: []
        };
        data.lignes.push(nouvelle);
        parAbrev.set(abrev.toLowerCase(), nouvelle);
        if (nom) parNomLigne.set(nom.toLowerCase(), true);
        res.crees++;
      }
    });
    return res;
  }

  /* Export du tableau au format TSV (collable directement dans Excel). */
  function exporterTSV(data, cles) {
    const entetes = cles.join("\t");
    const corps = data.lignes.map(l => cles.map(c => l[c] || "").join("\t"));
    return [entetes, ...corps].join("\n");
  }

  return { instanceNeuve, nouvelId, validerLigne, ajouterLabel, modifierLabel, supprimerLabel, appliquerColle, exporterTSV, majReferentiel,
           usagesLabel, renommerDansLignes, nomUtilise, usagesReseau, usagesContrat, doublonsCodes, valeurColCalculee };
})();

/* ============ 2. BD : persistance locale ============ */
const BD = (() => {
  const CLE = "hastus_libre_v1";
  let etat = null;
  /* Identifiant unique : horodatage + suffixe aléatoire. L'horodatage seul
     peut donner le MÊME id à deux créations dans la même milliseconde (bug
     découvert par la suite de tests : deux utilisateurs créés à la suite
     partageaient leur id, donc leurs instances !). Le suffixe aléatoire
     rend la collision impossible. */
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function charger() {
    try { etat = JSON.parse(localStorage.getItem(CLE)) || null; } catch (e) { etat = null; }
    if (!etat) etat = { utilisateurs: [], session: null, instances: [], donnees: {} };
    migrer(etat);
    return etat;
  }
  /* Migration : met à jour les données existantes vers le format actuel.
     Le catalogue a évolué (listes de textes → classeurs avec codes d'export
     et origine des labels). Sans cette étape, des données sauvegardées avec
     une version précédente deviendraient illisibles : la compatibilité
     ascendante est la règle d'or des mises à jour. */
  function migrer(e) {
    Object.values(e.donnees || {}).forEach(d => {
      if (d.catalogue) Object.entries(d.catalogue).forEach(([categorie, val]) => {
        if (Array.isArray(val)) // ancien format : simple liste de textes
          d.catalogue[categorie] = { colonnes: ["export"], labels: val.map(v => ({ nom: v, origine: "standard", codes: {} })) };
      });
      if (d.catalogue && !d.catalogue["Groupes de lignes"])
        d.catalogue["Groupes de lignes"] = { colonnes: ["export"], labels: [] };
      if (d.catalogue && !d.catalogue["Zones"])   // V2.6 : zones tarifaires (GTFS zone_id)
        d.catalogue["Zones"] = { colonnes: ["export"], labels: [] };
      if (!d.colonnesCalculees) d.colonnesCalculees = [];
      (d.lignes || []).forEach(l => { if (l.groupe === undefined) l.groupe = ""; });
    });
  }
  function sauver() { localStorage.setItem(CLE, JSON.stringify(etat)); }
  function lire() { if (!etat) charger(); return etat; }

  /* Identification locale (V1 : tout reste dans CE navigateur —
     la gestion en ligne avec vrais comptes viendra dans un bloc ultérieur). */
  function inscrire(nom, motDePasse) {
    const e = lire();
    if (e.utilisateurs.some(u => u.nom.toLowerCase() === nom.trim().toLowerCase()))
      return { ok: false, erreur: "Ce nom d'utilisateur existe déjà." };
    if (!nom.trim() || motDePasse.length < 4)
      return { ok: false, erreur: "Nom requis, mot de passe de 4 caractères minimum." };
    // Le PREMIER utilisateur créé devient administrateur.
    const u = { id: uid("u"), nom: nom.trim(), mdp: btoa(motDePasse), admin: e.utilisateurs.length === 0 };
    e.utilisateurs.push(u); e.session = u.id; sauver();
    return { ok: true };
  }
  function connecter(nom, motDePasse) {
    const e = lire();
    const u = e.utilisateurs.find(u => u.nom.toLowerCase() === nom.trim().toLowerCase() && u.mdp === btoa(motDePasse));
    if (!u) return { ok: false, erreur: "Identifiants incorrects." };
    e.session = u.id; sauver(); return { ok: true };
  }
  function deconnecter() { lire().session = null; sauver(); }
  function utilisateurCourant() { const e = lire(); return e.utilisateurs.find(u => u.id === e.session) || null; }

  /* Instances : chaque instance est isolée (droits + données). */
  function mesInstances() {
    const e = lire(); const u = utilisateurCourant();
    if (!u) return [];
    return e.instances.filter(i => u.admin || i.proprio === u.id || (i.membres || []).includes(u.id));
  }
  function creerInstance(nom, desc) {
    const e = lire(); const u = utilisateurCourant(); if (!u) return { ok: false, erreur: "Non connecté." };
    // Sécurité : bornage côté données (le maxlength HTML protège la saisie,
    // cette vérification protège l'application elle-même).
    nom = (nom || "").trim().slice(0, LIMITES.nomInstance);
    desc = (desc || "").trim().slice(0, LIMITES.descInstance);
    if (!nom) return { ok: false, erreur: "Nom d'instance obligatoire." };
    try {
      const inst = { id: uid("i"), nom, desc, proprio: u.id, membres: [] };
      e.instances.push(inst);
      e.donnees[inst.id] = Noyau.instanceNeuve();
      sauver(); return { ok: true };
    } catch (err) {
      return { ok: false, erreur: "Échec de la création : " + err.message };
    }
  }
  function dupliquerInstance(id, nouveauNom, nouvelleDesc) {
    const e = lire(); const u = utilisateurCourant(); if (!u) return { ok: false, erreur: "Non connecté." };
    const src = e.instances.find(i => i.id === id); if (!src) return { ok: false, erreur: "Instance introuvable." };
    // Bornage identique à la création.
    nouveauNom = (nouveauNom || "").trim().slice(0, LIMITES.nomInstance);
    nouvelleDesc = (nouvelleDesc || "").trim().slice(0, LIMITES.descInstance);
    if (!nouveauNom) return { ok: false, erreur: "Nom obligatoire." };
    try {
      const inst = { ...src, id: uid("i"), nom: nouveauNom, desc: nouvelleDesc, proprio: u.id, membres: [] };
      // Copie PROFONDE des données : la copie vit ensuite sa vie indépendamment.
      e.instances.push(inst);
      e.donnees[inst.id] = JSON.parse(JSON.stringify(e.donnees[id]));
      sauver(); return { ok: true };
    } catch (err) {
      return { ok: false, erreur: "Échec de la duplication : " + err.message };
    }
  }
  function modifierInstance(id, nom, desc) {
    const e = lire(); const i = e.instances.find(x => x.id === id); if (!i) return { ok: false, erreur: "Introuvable." };
    // Bornage identique à la création (le maxlength HTML protège la saisie,
    // cette vérification protège l'application elle-même).
    i.nom = nom.trim().slice(0, LIMITES.nomInstance);
    i.desc = (desc || "").trim().slice(0, LIMITES.descInstance);
    sauver(); return { ok: true };
  }
  function supprimerInstance(id) {
    const e = lire();
    e.instances = e.instances.filter(i => i.id !== id);
    delete e.donnees[id]; sauver();
  }
  function donneesInstance(id) { return lire().donnees[id]; }
  /* Remise à zéro interne (uniquement pour la suite de tests : simule un
     rechargement de page en vidant le cache mémoire de la base). */
  function _raz() { etat = null; }

  /* Droits (V1 : affectation d'utilisateurs à une instance ; les rôles
     détaillés seront définis dans une version ultérieure). */
  function affecterMembre(idInstance, idUtilisateur) {
    const e = lire(); const inst = e.instances.find(i => i.id === idInstance);
    if (!inst) return { ok: false, erreur: "Instance introuvable." };
    if (!inst.membres.includes(idUtilisateur)) inst.membres.push(idUtilisateur);
    sauver(); return { ok: true };
  }
  function retirerMembre(idInstance, idUtilisateur) {
    const e = lire(); const inst = e.instances.find(i => i.id === idInstance);
    if (!inst) return { ok: false, erreur: "Instance introuvable." };
    inst.membres = inst.membres.filter(m => m !== idUtilisateur);
    sauver(); return { ok: true };
  }

  return { charger, lire, sauver, inscrire, connecter, deconnecter, utilisateurCourant, _raz,
           mesInstances, creerInstance, dupliquerInstance, modifierInstance, supprimerInstance,
           donneesInstance, affecterMembre, retirerMembre };
})();

/* ============ 3. VUES : affichage ============ */

// Fabrique un élément HTML depuis une chaîne, et échappe le texte dynamique.
function h(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
/* OPTIMISATION : la table des entités est créée UNE seule fois (et non à
   chaque remplacement) — esc() est appelée des milliers de fois lors du
   rendu des grandes tables. */
const ENTITIES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
function esc(s) { return String(s ?? '').replace(/[<>"&]/g, c => ENTITIES[c]); }

/* État d'interface courant (quelle instance, quel onglet, quelles colonnes). */

/* ---------- Sécurité & diagnostic ----------
   Toute erreur JavaScript non capturée s'affiche dans un bandeau rouge en
   haut de l'écran. Indispensable pour diagnostiquer à distance (ex. sur
   GitHub Pages ou un téléphone, sans console de développeur). */
function afficherErreur(msg) {
  let b = document.getElementById("bloc-erreur");
  if (!b) {
    b = document.createElement("div");
    b.id = "bloc-erreur";
    b.style.cssText = "background:#dc2626;color:#fff;padding:8px 16px;font-size:13px;position:sticky;top:0;z-index:999;";
    document.body.prepend(b);
  }
  b.textContent = "⚠️ Erreur : " + msg;
}
window.addEventListener("error", (ev) => afficherErreur(ev.message));

/* Multi-onglets (demande de Jules) : si la même application est ouverte dans
   plusieurs onglets (ou fenêtres) du navigateur, chaque sauvegarde dans l'un
   déclenche l'événement "storage" dans les AUTRES. On vide alors le cache
   mémoire de la BD : le prochain affichage relit les données à jour — sans
   cela, l'onglet B écraserait les changements de l'onglet A avec un état
   périmé. (Limite connue : une fenêtre de saisie DÉJÀ OUVERTE dans l'onglet
   B travaille sur l'ancien état — la refuser n'est pas nécessaire, le
   dernier enregistrement gagne, objet par objet.) */
window.addEventListener("storage", (ev) => {
  if (ev.key === "hastus_libre_v1") BD._raz();
});

/* Limites de sécurité (demandées + appliquées aussi côté données,
   car un `maxlength` HTML seul peut être contourné). */
const LIMITES = { nomInstance: 32, descInstance: 256 };

function rafraichir() {
  const app = document.getElementById("app");
  const u = BD.utilisateurCourant();
  if (!u) { app.replaceChildren(vueIdentification()); return; }
  if (!App.instanceOuverte) { app.replaceChildren(vueAccueil(u)); return; }
  app.replaceChildren(vueEspaceTravail(u));
}

/* ---------- Bouton supprimer sensible (double clic en 3 s) ---------- */
function boutonSupprimer(texte, onConfirme) {
  const b = h(`<button class="suppr"><div class="barre"></div><span style="position:relative;">${texte}</span></button>`);
  let arme = false;
  b.onclick = () => {
    if (!arme) {
      // Premier clic : on arme, la barre se vide en 3 s puis on désarme seul.
      arme = true; b.classList.add("armed"); b.querySelector("span").textContent = "Confirmer ?";
      setTimeout(() => { arme = false; b.classList.remove("armed"); b.querySelector("span").textContent = texte; }, 3000);
    } else { onConfirme(); }
  };
  return b;
}

/* Fenêtre modale générique. « large » = occupe presque tout l'écran
   (utilisée par l'import : le tableau doit tenir en largeur). */
function modal(contenu, large) {
  const fond = h(`<div class="modal-fond"><div class="modal"></div></div>`);
  /* V2.5 (demande de Jules) : TOUTES les fenêtres pop-up ont les
     dimensions de la fenêtre « Modifier une ligne » — les 3/4 de la
     largeur du tableau de travail affiché, au moins 560 px. */
  const panneau = document.querySelector(".panneau-travail");
  const largTableau = panneau && panneau.getBoundingClientRect ? panneau.getBoundingClientRect().width : 900;
  fond.firstChild.style.maxWidth = "none";
  fond.firstChild.style.width = Math.max(560, Math.round(largTableau * 0.75)) + "px";
  if (large) { fond.firstChild.style.maxWidth = "95vw"; fond.firstChild.style.width = "95%"; }
  fond.firstChild.appendChild(contenu);
  fond.onclick = (e) => { if (e.target === fond) fond.remove(); };
  document.body.appendChild(fond);
  return fond;
}

/* Fenêtre « où est-il utilisé ? » (demande de Jules) : liste les éléments
   qui utilisent un objet, UN PAR UN, chacun modifiable ou supprimable
   directement depuis la liste. */
function modalUsages(titre, obtenirUsages) {
  const form = h(`<div>
    <h2>🔎 Utilisations — ${esc(titre)}</h2>
    <div id="u-liste"></div>
    <div class="ligne-boutons"><button id="m-fermer" class="b-bleu">Fermer</button></div>
  </div>`);
  const box = form.querySelector("#u-liste");
  const dessiner = () => {
    box.innerHTML = "";
    const usages = obtenirUsages();
    if (!usages.length) { box.appendChild(h(`<p class="info-txt">Aucune utilisation.</p>`)); return; }
    usages.forEach(u => {
      const carte = h(`<div class="carte" style="margin:6px 0;padding:8px 14px;">
        <span>${u.label()}</span><span class="inline-flex"></span></div>`);
      const act = carte.lastElementChild;
      const bM = h(`<button>Modifier</button>`);
      bM.onclick = () => { form.closest(".modal-fond").remove(); u.modifier(); };
      act.appendChild(bM);
      act.appendChild(boutonSupprimer("Supprimer", () => { u.supprimer(); BD.sauver(); dessiner(); }));
      box.appendChild(carte);
    });
  };
  form.querySelector("#m-fermer").onclick = () => form.closest(".modal-fond").remove();
  dessiner();
  modal(form);
}

/* ---------- Écran accueil : liste des instances ---------- */
function vueAccueil(u) {
  const insts = BD.mesInstances();
  const racine = h(`<div>
    <div class="topbar">
      <span class="brand"><span class="brand-mark">🚌</span><span>HASTUS libre</span></span>
      <span class="inline-flex"><span class="info-txt">${esc(u.nom)}${u.admin ? " (admin)" : ""}</span>
      <button id="deco">Se déconnecter</button></span>
    </div>
    <div class="conteneur">
      <div class="inline-flex" style="justify-content:space-between;width:100%;">
        <h1>Mes instances de travail</h1>
        <span class="inline-flex">
          <button id="tests">🧪 Tests</button>
          <button id="nouvelle" class="b-bleu">+ Nouvelle instance</button>
        </span>
      </div>
      <div id="liste" class="grille-instances"></div>
    </div>
  </div>`);
  racine.querySelector("#deco").onclick = () => { BD.deconnecter(); App.instanceOuverte = null; rafraichir(); };
  racine.querySelector("#tests").onclick = lancerTests;
  racine.querySelector("#nouvelle").onclick = () => {
    // Modale de création : maxlength HTML + compteur de caractères en direct,
    // + validation double côté données. try/catch pour afficher l'erreur précise
    // si quelque chose échoue (au lieu d'un silence incompréhensible).
    const form = h(`<div>
      <h2>Créer une nouvelle instance</h2>
      <div class="champ"><label>Nom de l'instance (32 caractères max.)</label>
        <input id="m-nom" maxlength="32"/><div class="info-txt" id="cpt-nom">0 / 32</div></div>
      <div class="champ"><label>Description courte (256 caractères max.)</label>
        <textarea id="m-desc" rows="2" maxlength="256"></textarea><div class="info-txt" id="cpt-desc">0 / 256</div></div>
      <div class="erreur" id="m-err"></div>
      <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-bleu">Créer</button></div>
    </div>`);
    modal(form);
    // Compteurs de caractères en direct.
    const majCompteur = () => {
      form.querySelector("#cpt-nom").textContent = `${form.querySelector("#m-nom").value.length} / 32`;
      form.querySelector("#cpt-desc").textContent = `${form.querySelector("#m-desc").value.length} / 256`;
    };
    form.querySelector("#m-nom").addEventListener("input", majCompteur);
    form.querySelector("#m-desc").addEventListener("input", majCompteur);
    form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
    form.querySelector("#m-ok").onclick = () => {
      try {
        const r = BD.creerInstance(form.querySelector("#m-nom").value, form.querySelector("#m-desc").value);
        if (!r.ok) { form.querySelector("#m-err").textContent = r.erreur; return; }
        form.closest(".modal-fond").remove(); rafraichir();
      } catch (err) {
        form.querySelector("#m-err").textContent = "Erreur inattendue : " + err.message;
        afficherErreur(err.message + " (création d'instance)");
      }
    };
  };

  const liste = racine.querySelector("#liste");
  if (!insts.length) {
    liste.appendChild(h(`<p class="info-txt" style="text-align:center;padding:40px;">Aucune instance. Créez-en une pour commencer !</p>`));
  }
  insts.forEach(inst => {
    const d = BD.donneesInstance(inst.id);
    // Carte instance (reprise du prototype V2) : titre, description,
    // badges réseaux/contrats/lignes, actions alignées à droite.
    const carte = h(`<div class="carte instance-carte">
      <div class="actions-haut"></div>
      <h3>${esc(inst.nom)}</h3>
      <div class="desc">${esc(inst.desc)}</div>
      <div class="meta">
        <span class="etiquette">${d.reseaux.length} réseaux</span>
        <span class="etiquette">${d.contrats.length} contrats</span>
        <span class="etiquette">${d.lignes.length} lignes</span>
      </div>
      <div class="actions"></div>
    </div>`);
    // Les boutons courants restent EN BAS (actions = dernier élément) ;
    // seul « 👥 Droits » est remonté en HAUT À DROITE de la carte
    // (demande de Jules V1.11). firstElementChild/lastElementChild = éléments
    // uniquement (un nœud texte invisible ne peut pas recevoir de bouton —
    // c'était le bug du bandeau rouge).
    const act = carte.lastElementChild;
    const actHaut = carte.firstElementChild;
    const bOuvrir = h(`<button class="b-bleu">Ouvrir</button>`);
    bOuvrir.onclick = () => { App.instanceOuverte = inst; App.vue = "lignes"; App.colonnes = null; rafraichir(); };
    const bDupl = h(`<button>Dupliquer</button>`);
    // Dupliquer : mêmes limites de sécurité que la création.
    bDupl.onclick = () => {
      const form = h(`<div>
        <h2>Dupliquer « ${esc(inst.nom)} »</h2>
        <p class="info-txt">La copie reprendra toutes les données. Ajustez le nom et la description.</p>
        <div class="champ"><label>Nom</label><input id="m-nom" maxlength="32" value="${esc(inst.nom.slice(0, LIMITES.nomInstance - 8))} (copie)" /></div>
        <div class="champ"><label>Description</label><textarea id="m-desc" rows="2" maxlength="256">${esc(inst.desc)}</textarea></div>
        <div class="erreur" id="m-err"></div>
        <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-bleu">Dupliquer</button></div>
      </div>`);
      modal(form);
      form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
      form.querySelector("#m-ok").onclick = () => {
        const r = BD.dupliquerInstance(inst.id, form.querySelector("#m-nom").value, form.querySelector("#m-desc").value);
        if (!r.ok) { alert(r.erreur); return; }
        form.closest(".modal-fond").remove(); rafraichir();
      };
    };
    const bMod = h(`<button>Modifier</button>`);
    bMod.onclick = () => {
      // Modifier : mêmes garde-fous que la création (limites + compteurs).
      const form = h(`<div>
        <h2>Modifier l'instance</h2>
        <div class="champ"><label>Nom (32 caractères max.)</label>
          <input id="m-nom" maxlength="32" value="${esc(inst.nom)}"/><div class="info-txt" id="cpt-nom"></div></div>
        <div class="champ"><label>Description (256 caractères max.)</label>
          <textarea id="m-desc" rows="2" maxlength="256">${esc(inst.desc)}</textarea><div class="info-txt" id="cpt-desc"></div></div>
        <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-bleu">Enregistrer</button></div>
      </div>`);
      modal(form);
      const majCompteur = () => {
        form.querySelector("#cpt-nom").textContent = `${form.querySelector("#m-nom").value.length} / 32`;
        form.querySelector("#cpt-desc").textContent = `${form.querySelector("#m-desc").value.length} / 256`;
      };
      form.querySelector("#m-nom").addEventListener("input", majCompteur);
      form.querySelector("#m-desc").addEventListener("input", majCompteur);
      majCompteur();
      form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
      form.querySelector("#m-ok").onclick = () => {
        const r = BD.modifierInstance(inst.id, form.querySelector("#m-nom").value, form.querySelector("#m-desc").value);
        if (!r.ok) { alert(r.erreur); return; }
        form.closest(".modal-fond").remove(); rafraichir();
      };
    };
    act.appendChild(bOuvrir); act.appendChild(bDupl); act.appendChild(bMod);
    act.appendChild(boutonSupprimer("Supprimer", () => { BD.supprimerInstance(inst.id); rafraichir(); }));
    // Gestion des droits : réservée à l'admin ou au propriétaire de l'instance.
    // Placée en haut à droite de la carte (demande de Jules).
    if (u.admin || inst.proprio === u.id) {
      const bDroits = h(`<button>👥 Droits</button>`);
      bDroits.onclick = () => modalDroits(inst);
      actHaut.appendChild(bDroits);
    }
    liste.appendChild(carte);
  });
  return racine;
}

/* Fenêtre de gestion des droits (V1 : affectation simple de membres). */
function modalDroits(inst) {
  const e = BD.lire();
  const form = h(`<div>
    <h2>Droits — ${esc(inst.nom)}</h2>
    <p class="info-txt">Affectez des utilisateurs à cette instance. Les rôles détaillés viendront dans une version ultérieure.</p>
    <div id="membres"></div>
    <div class="champ" style="margin-top:12px;"><label>Ajouter un utilisateur</label>
      <select id="m-choix"><option value="">— Choisir —</option></select></div>
    <div class="ligne-boutons"><button id="m-fermer">Fermer</button></div>
  </div>`);
  const membresBox = form.querySelector("#membres");
  const dessinerMembres = () => {
    membresBox.innerHTML = "";
    e.utilisateurs.filter(x => inst.membres.includes(x.id) || x.id === inst.proprio).forEach(m => {
      const role = m.id === inst.proprio ? "propriétaire" : "membre";
      const l = h(`<div class="carte" style="margin:6px 0;"><span>${esc(m.nom)} <span class="etiquette">${role}</span></span></div>`);
      if (m.id !== inst.proprio) {
        const b = h(`<button>Retirer</button>`);
        b.onclick = () => { BD.retirerMembre(inst.id, m.id); dessinerMembres(); };
        l.appendChild(b);
      }
      membresBox.appendChild(l);
    });
    const choix = form.querySelector("#m-choix");
    choix.innerHTML = '<option value="">— Choisir —</option>' +
      e.utilisateurs.filter(x => !inst.membres.includes(x.id) && x.id !== inst.proprio)
        .map(x => `<option value="${x.id}">${esc(x.nom)}</option>`).join("");
  };
  form.querySelector("#m-choix").onchange = (ev) => {
    if (ev.target.value) { BD.affecterMembre(inst.id, ev.target.value); dessinerMembres(); }
  };
  form.querySelector("#m-fermer").onclick = () => form.closest(".modal-fond").remove();
  dessinerMembres();
  modal(form);
}

/* ---------- Espace de travail (instance ouverte) ---------- */
function vueEspaceTravail(u) {
  const dOng = BD.donneesInstance(App.instanceOuverte.id);
  // Badge ⚠ sur l'onglet catalogue : valeurs à paramétrer (créées par un
  // import en masse ou saisies sans code d'export).
  const nbAP = Object.values(dOng.catalogue).reduce((n, cat) =>
    n + cat.labels.filter(l => l.origine === "local" && !Object.values(l.codes || {}).some(c => (c || "").trim())).length, 0);
  const nbRefs = Object.values(dOng.catalogue).reduce((n, cat) => n + cat.labels.length, 0);
  // Capsules statistiques (reprise du prototype V2) : page d'accueil de
  // l'instance — comptes clés toujours visibles au-dessus des onglets.
  const resume = h(`<div class="resume">
    <div class="stat"><span class="libelle">Lignes</span><div class="valeur">${dOng.lignes.length}<small>total</small></div></div>
    <div class="stat"><span class="libelle">Réseaux</span><div class="valeur">${dOng.reseaux.length}<small>actifs</small></div></div>
    <div class="stat"><span class="libelle">Contrats</span><div class="valeur">${dOng.contrats.length}<small>en cours</small></div></div>
    <div class="stat"><span class="libelle">Références</span><div class="valeur">${nbRefs}<small>labels</small></div></div>
  </div>`);
  /* V2.1-ergo : la BANDE DES MODULES vit dans la barre supérieure (demande
     de Jules) — toujours accessible, quel que soit l'écran de l'instance.
     Le bouton « ← Retour » est remplacé par le logo « 🚌 HASTUS libre »,
     cliquable : il ramène au choix de l'instance. À droite, en symétrie :
     nom de l'instance + nom de l'utilisateur. */
  const racine = h(`<div>
    <div class="topbar">
      <span class="inline-flex">
        <button id="retour-accueil" class="brand" title="Retour au choix de l'instance">
          <span class="brand-mark">🚌</span><span>HASTUS libre</span>
        </button>
        <span class="bande-modules" id="bande-modules"></span>
      </span>
      <span class="inline-flex">
        <span class="etiquette">${esc(App.instanceOuverte.nom)}</span>
        <span class="info-txt">${esc(u.nom)}</span>
      </span>
    </div>
    <div class="conteneur" id="haut-travail"></div>
    <div class="conteneur" id="contenu" ${App.vue === "lignes" || App.vue === "reseaux" || App.vue === "contrats" || App.vue === "arrets" || App.vue === "lieux" || (App.vue || "").indexOf("mod:") === 0 ? 'style="width:calc(100% - 32px);max-width:none;"' : ""}></div>
  </div>`);
  racine.querySelector("#retour-accueil").onclick = () => { App.instanceOuverte = null; App.colonnes = null; rafraichir(); };
  const haut = racine.querySelector("#haut-travail");
  /* V2.3 : le résumé des statistiques se PLIE (demande de Jules) pour
     laisser toute la place au tableau quand on travaille. */
  if (App.vue !== "mod:topo") {
    const bResume = h(`<button class="petit">${App.resumePlié ? "▸ Déplier le résumé" : "▾ Plier le résumé"}</button>`);
    bResume.onclick = () => { App.resumePlié = !App.resumePlié; rafraichir(); };
    haut.appendChild(bResume);
    if (!App.resumePlié) haut.appendChild(resume);
  }
  const bande = racine.querySelector("#bande-modules");
  const dansDef = (App.vue === "lignes" || App.vue === "reseaux" || App.vue === "contrats" || App.vue === "arrets" || App.vue === "lieux");
  /* 1er module de la bande : Définition réseau (lignes + réseaux & contrats). */
  const bDef = h(`<button class="onglet ${dansDef ? "actif" : ""}" title="Lignes, réseaux et contrats">🚏 Définition réseau</button>`);
  bDef.onclick = () => { if (App.vue !== "lignes" && App.vue !== "reseaux" && App.vue !== "contrats" && App.vue !== "arrets" && App.vue !== "lieux") App.vue = "lignes"; rafraichir(); };
  bande.appendChild(bDef);
  /* Puis chaque module enregistré via la fiche (ex. 🗺️ Topologie) : la bande
     s'agrandit au fil et à mesure des modules. Un module absent ou cassé ne
     bloque jamais la V1 : son bouton n'apparaît simplement pas. */
  Hastus.modulesDeclares().forEach(m => {
    const cle = "mod:" + m.id;
    const b = h(`<button class="onglet ${App.vue === cle ? "actif" : ""}">${m.onglet}</button>`);
    b.onclick = () => { App.vue = cle; rafraichir(); };
    bande.appendChild(b);
  });
  /* Enfin le Catalogue de l'instance (badge ⚠ conservé, sur la bande). */
  const bCat = h(`<button class="onglet ${App.vue === "catalogue" ? "actif" : ""}">🏷️ Catalogue${nbAP ? ` <span class="etiquette alerte">⚠ ${nbAP}</span>` : ""}</button>`);
  bCat.onclick = () => { if (App.vue !== "catalogue") App.vue = "catalogue"; rafraichir(); };
  bande.appendChild(bCat);
  const contenu = racine.querySelector("#contenu");
  /* Module « Définition réseau » : sous-navigation interne entre le tableau
     des lignes et la vue réseaux & contrats (rien n'est perdu). */
  if (dansDef) {
    const sous = h(`<div class="onglets sous-onglets"></div>`);
    [["reseaux", "🚌 Réseaux"], ["contrats", "📄 Contrats"], ["lignes", "🚏 Lignes"], ["arrets", "📍 Arrêts"], ["lieux", "🚉 Lieux"]].forEach(([cle, label]) => {
      const b = h(`<button class="onglet ${App.vue === cle ? "actif" : ""}">${label}</button>`);
      b.onclick = () => { App.vue = cle; rafraichir(); };
      sous.appendChild(b);
    });
    contenu.appendChild(sous);
    if (App.vue === "reseaux" || App.vue === "contrats" || App.vue === "vue") {
      /* V2.5 (demande de Jules) : Réseaux et Contrats ont CHACUN leur
         onglet, avec la même disposition que le tableau des lignes
         (⚙ Colonnes, 📋 Copier, 📥 Importer, recherche multi-critères,
         bouton « + Créer » au-dessus à gauche du tableau). L'ancienne
         vue fusionnée « vue » est redirigée vers Réseaux. */
      if (App.vue === "vue") App.vue = "reseaux";
      try { contenu.appendChild(App.vue === "reseaux" ? vueReseaux() : vueContrats()); }
      catch (e) {
        afficherErreur("Vue " + (App.vue === "reseaux" ? "Réseaux" : "Contrats") + " : " + e.message);
        contenu.appendChild(h(`<p class="erreur">La vue a échoué : ${esc(e.message)}</p>`));
      }
    } else if (App.vue === "arrets") {
      try { contenu.appendChild(Topo.vueArrets(dOng, Hastus.core)); }
      catch (e) {
        afficherErreur("Vue Arrêts : " + e.message);
        contenu.appendChild(h(`<p class="erreur">La vue « Arrêts » a échoué : ${esc(e.message)}</p>`));
      }
    } else if (App.vue === "lieux") {
      /* V2.4 : tableau de gestion des lieux (même ergonomie que les
         arrêts : recherche, création, ✎/🗑, copie Excel, import). */
      try { contenu.appendChild(Topo.vueLieux(dOng, Hastus.core)); }
      catch (e) {
        afficherErreur("Vue Lieux : " + e.message);
        contenu.appendChild(h(`<p class="erreur">La vue « Lieux » a échoué : ${esc(e.message)}</p>`));
      }
    } else contenu.appendChild(App.vue === "lignes" ? vueLignes() : vueReseauxContrats());
  }
  if (App.vue === "catalogue") contenu.appendChild(vueCatalogue());
  /* Chaque module fournit SA vue (données de l'instance + fiche). Ses
     erreurs sont captées : bandeau rouge + message, JAMAIS un écran figé. */
  Hastus.modulesDeclares().forEach(m => {
    if (App.vue !== "mod:" + m.id) return;
    try {
      contenu.appendChild(m.vue(dOng, Hastus.core));
    } catch (e) {
      afficherErreur("Module '" + m.id + "' : " + e.message);
      contenu.appendChild(h(`<p class="erreur">Le module « ${esc(m.onglet)} » a échoué : ${esc(e.message)}</p>`));
    }
  });
  /* V2.3.1/V2.4 « une page = un écran » : après chaque affichage, on
     MESURE la place restante sous chaque grande liste (tableaux de
     lignes/arrêts/lieux, liste réseaux & contrats) et on lui pose un
     plafond de hauteur exact : elle défile en INTERNE, la page ne dépasse
     plus l'écran. Le setTimeout laisse le navigateur poser les éléments
     avant la mesure. V2.4 : FILET DE SÉCURITÉ — si la page déborde quand
     même (ligne de compte sous un tableau, marges de carte…), on réduit
     chaque plafond du débordement constaté jusqu'à ce que ça rentre :
     on ne DEVINE plus, on MESURE le résultat final. */
  setTimeout(() => {
    try {
      const cibles = racine.querySelectorAll("#contenu .enveloppe-table, #contenu #liste");
      cibles.forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top > 0) el.style.maxHeight = Math.max(160, window.innerHeight - r.top - 14) + "px";
      });
      let garde = 10;
      while (document.documentElement.scrollHeight > window.innerHeight && garde-- > 0) {
        const trop = document.documentElement.scrollHeight - window.innerHeight;
        cibles.forEach(el => {
          el.style.maxHeight = Math.max(120, (parseFloat(el.style.maxHeight) || 300) - trop) + "px";
        });
      }
    } catch (e) { /* mesure impossible : on garde le plafond CSS de secours */ }
  }, 0);
  return racine;
}

/* ---------- Vue : toutes les lignes (tableau paramétrable) ---------- */
/* Les colonnes calculées ("auto") ne stockent rien : leur valeur est
   dérivée à la volée. Les préférences de colonnes sont mémorisées par instance. */
/* Colonnes de base du tableau des lignes.
   - "id" est FIXE : toujours affichée, non décochable (identifiant unique
     calculé par l'instance, servira de clé aux exports GTFS/NeTEx).
   - Les colonnes calculées définies par l'utilisateur (onglet dédié du
     catalogue) s'ajoutent dynamiquement : voir colonnesDisponibles(). */
const COLONNES = [
  { cle: "id", label: "ID unique", fixe: true },
  { cle: "abrev", label: "Abrév." },
  { cle: "nom", label: "Nom commercial" },
  { cle: "reseau", label: "Réseau", join: "reseauId", src: "reseaux" },
  { cle: "contrat", label: "Contrat", join: "contratId", src: "contrats" },
  { cle: "activite", label: "Activité" },
  { cle: "mode", label: "Mode" },
  { cle: "groupe", label: "Groupe" },
  { cle: "nbVehicules", label: "Nb véhicules", calc: l => l.vehicules.length },
  { cle: "nbEnergies", label: "Nb énergies", calc: l => l.energies.length },
  { cle: "nbFonctions", label: "Nb fonctions", calc: l => l.fonctions.length },
];
/* Toutes les colonnes disponibles = base + colonnes calculées utilisateur
   (un compteur : nombre d'éléments d'une liste rattachée à la ligne). */
function colonnesDisponibles() {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const calcU = (d.colonnesCalculees || []).map(c => ({
    cle: "u:" + c.nom, label: c.nom, calc: l => Noyau.valeurColCalculee(l, c), utilisateur: true
  }));
  return [...COLONNES, ...calcU];
}
function colonnesAffichees() {
  const pref = localStorage.getItem("hastus_colonnes_" + App.instanceOuverte.id);
  return pref ? JSON.parse(pref) : ["abrev", "nom", "reseau", "contrat", "activite", "mode", "groupe", "nbVehicules"];
}
/* Valeur affichée d'une cellule. OPTIMISATION : « cache » (optionnel) =
   Maps id→nom précalculées pour les jointures — évite un find() complet
   par cellule affichée. */
function valColonne(d, col, l, cache) {
  if (col.calc) return col.calc(l);
  if (col.join) {
    if (cache && cache[col.src]) {
      const nom = cache[col.src].get(l[col.join]);
      return nom !== undefined && nom !== null ? nom : "—";
    }
    const o = d[col.src].find(x => x.id === l[col.join]); return o ? o.nom : "—";
  }
  return l[col.cle] || "";
}

function vueLignes() {
  const d = BD.donneesInstance(App.instanceOuverte.id);

  const cles = App.actionsDebut
    ? ["__actions", "id", ...App.colonnes]
    : ["id", ...App.colonnes, "__actions"];
  const cols = cles.map(cle => cle === "__actions" ? act : dispo.find(c => c.cle === cle)).filter(Boolean);
  const lignesAffichees = trierEtFiltrer(d, dispo);

  const racine = h(`<div>
    <div class="carte panneau-travail">

      <div class="champ"><label>Activité</label>
        <select id="fl-activite"><option value="all">Toutes</option>

    </div>

    <div class="inline-flex" style="justify-content:space-between;width:100%;margin-bottom:10px;">

  racine.querySelector("#fl-q").oninput = (e) => {

     - bouton 🔎 : pop-up de filtre CENTRÉE dans la vue (champ toujours

  const entetes = racine.querySelector("#entetes");

      else if (t.asc) t.asc = false;                            // 2e : décroissant

  /* Lignes du tableau : double-clic = modification (sélection multiple

     DÉLÉGUÉS sur le tbody (2 écouteurs au total, au lieu de 3 boutons +

  const corps = racine.querySelector("#corps");

  // Délégation : un seul écouteur « click » pour tous les boutons ✎/🗑.
  corps.addEventListener("click", (e) => {

      ? ` — ${Object.keys(App.filtres).length} filtre(s), ${App.tris.length} tri(s) actifs` : "");

  // Menu ⚙ Colonnes : mise en page UNIFORME (grille : case | nom | flèches),

  const bCol = racine.querySelector("#b-col");

      <div id="p-liste" style="max-height:300px;overflow-y:auto;"></div>
      <div style="margin-top:6px;border-top:1px solid #e2e8f0;padding-top:6px;">

    const majTxtActions = () => {

    };

    pan.querySelector("#p-ann").onclick = () => pan.remove();
    pan.querySelector("#p-ok").onclick = () => {
      App.colonnes = travail.filter(cle => cochees.has(cle));

  // Copier vers Excel (demande de Jules) : TOUTES les colonnes brutes sont

  // dans leur nom ; après la copie, une fenêtre rappelle lesquelles.
  racine.querySelector("#b-copy").onclick = () => {

    const oblig = COLONNES_MASSE.filter(c => c.oblig).map(c => c.label).join(", ");
    const info = h(`<div>

    info.querySelector("#b-ok").onclick = () => info.closest(".modal-fond").remove();
    modal(info);
