<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HASTUS libre</title>
  <style>
    :root {
      --bg: #edf3fb;
      --bg-strong: #e7eef9;
      --panel: rgba(255,255,255,0.9);
      --panel-strong: #ffffff;
      --panel-soft: #f3f8ff;
      --panel-alt: #f5f7fb;
      --line: #dfe8f4;
      --line-strong: #c7d7ee;
      --text: #112236;
      --muted: #586d86;
      --primary: #1266e5;
      --primary-strong: #0a4ab5;
      --secondary: #1db4a6;
      --secondary-strong: #108a7c;
      --warning: #f59e0b;
      --warning-soft: #fff4de;
      --danger: #ef4444;
      --danger-soft: #fff1f2;
      --success: #1ead67;
      --success-soft: #ebfff5;
      --shadow: 0 20px 46px rgba(15, 28, 56, 0.12);
      --shadow-soft: 0 8px 22px rgba(17, 38, 74, 0.08);
      --radius: 20px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --radius-xs: 10px;
      --header-h: 76px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(18,102,229,0.15), transparent 25%),
        radial-gradient(circle at bottom right, rgba(29,180,166,0.12), transparent 30%),
        var(--bg);
      color: var(--text);
    }
    button, input, select, textarea {
      font: inherit;
    }
    button {
      border: 1px solid var(--line-strong);
      background: var(--panel-strong);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: 0 1px 0 rgba(15, 28, 56, 0.03);
      font-weight: 600;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 12px 24px rgba(18,102,229,0.22);
    }
    button.success {
      background: linear-gradient(135deg, var(--secondary), var(--secondary-strong));
      border-color: var(--secondary);
      color: #fff;
    }
    button.warning {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border-color: #f59e0b;
      color: #fff;
    }
    button.danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-color: #ef4444;
      color: #fff;
    }
    button.ghost { background: transparent; }
    button.small {
      padding: 7px 10px;
      font-size: 12px;
    }
    button:disabled {
      opacity: 0.62;
      cursor: not-allowed;
      transform: none;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(145, 164, 190, 0.25);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.025em;
      color: var(--text);
    }
    .brand-mark {
      width: 38px; height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(18,102,229,0.12), rgba(29,180,166,0.18));
      color: var(--primary);
      font-size: 1.2rem;
    }
    .topbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .container {
      width: min(1210px, calc(100% - 32px));
      margin: 22px auto 40px;
    }
    .card {
      background: rgba(255,255,255,0.86);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
    }

    .auth-wrap {
      display: grid;
      place-items: center;
      min-height: calc(100vh - var(--header-h));
      padding: 32px 16px;
    }
    .auth-card {
      width: min(460px, 100%);
      padding: 28px 24px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(208,220,236,0.82);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    h1, h2, h3 { margin: 0 0 12px; }
    h1 { font-size: clamp(1.9rem, 2.8vw, 2.5rem); }
    h2 { font-size: 1.5rem; }
    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.01em;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      background: rgba(248,250,252,0.95);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(18,102,229,0.72);
      box-shadow: 0 0 0 4px rgba(18,102,229,0.12);
      background: #fff;
    }
    textarea { resize: vertical; min-height: 92px; }
    .inline-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .error {
      min-height: 21px;
      margin: 8px 0 0;
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .screen-header {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-title {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-soft);
      border: 1px solid rgba(148,163,184,0.25);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .badge.alert {
      background: rgba(245,158,11,0.12);
      border-color: rgba(245,158,11,0.25);
      color: #92400e;
    }
    .badge.success {
      background: var(--success-soft);
      border-color: rgba(30,173,103,0.2);
      color: #0d7d48;
    }

    .instance-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }
    .instance-card {
      padding: 18px 18px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(244,249,255,0.9));
    }
    .instance-card h3 {
      margin: 0 0 8px;
      font-size: 1.18rem;
    }
    .instance-card p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.6;
      min-height: 48px;
    }
    .instance-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .instance-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .workspace-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 18px;
      padding: 8px;
      border-radius: 14px;
      background: rgba(148,163,184,0.08);
      border: 1px solid rgba(148,163,184,0.18);
    }
    .tab {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 700;
      padding: 10px 14px;
    }
    .tab.active {
      background: linear-gradient(180deg, rgba(18,102,229,0.09), rgba(18,102,229,0.04));
      border-color: rgba(18,102,229,0.16);
      color: var(--primary-strong);
    }

    .transport-panel {
      padding: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(244,248,255,0.82));
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .toolbar-title {
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }
    .stat {
      padding: 18px 18px 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(244,249,255,0.92));
    }
    .stat .label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .stat .value {
      font-size: clamp(1.7rem, 2vw, 2.25rem);
      font-weight: 800;
      line-height: 1;
    }
    .stat .value small {
      font-size: 0.68em;
      font-weight: 700;
      color: var(--muted);
      margin-left: 6px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1.8fr repeat(3, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 14px;
      background: rgba(245,249,255,0.9);
    }
    .filter-grid .field {
      margin: 0;
    }
    .filter-grid label {
      margin-bottom: 6px;
      font-size: 0.72rem;
    }
    .filter-grid input, .filter-grid select {
      min-height: 40px;
      padding: 9px 10px;
      font-size: 0.9rem;
    }

    .table-wrap {
      overflow: auto;
      width: 100%;
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 16px;
      background: rgba(255,255,255,0.82);
    }
    .table-wrap table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }
    thead th {
      background: linear-gradient(180deg, rgba(230,238,250,0.98), rgba(225,234,246,0.96));
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.72rem;
      padding: 12px 12px;
      text-align: left;
      border-bottom: 1px solid rgba(148,163,184,0.2);
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid rgba(148,163,184,0.12);
      vertical-align: middle;
      color: var(--text);
      background: rgba(255,255,255,0.5);
    }
    tbody tr:hover td {
      background: rgba(18,102,229,0.025);
    }
    .row-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      border: 1px solid rgba(148,163,184,0.18);
      background: var(--panel-soft);
      color: var(--muted);
    }
    .status-chip.primary {
      background: rgba(18,102,229,0.1);
      color: var(--primary-strong);
      border-color: rgba(18,102,229,0.18);
    }
    .status-chip.success {
      background: var(--success-soft);
      color: #0a7c4e;
      border-color: rgba(30,173,103,0.2);
    }
    .status-chip.warning {
      background: var(--warning-soft);
      color: #9a5e00;
      border-color: rgba(245,158,11,0.2);
    }
    .status-chip.danger {
      background: var(--danger-soft);
      color: #b42318;
      border-color: rgba(239,68,68,0.2);
    }

    .catalogue-layout {
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr;
      gap: 18px;
    }
    .side-menu {
      padding: 16px;
      align-self: start;
    }
    .side-menu .menu {
      display: grid;
      gap: 8px;
    }
    .side-item {
      width: 100%;
      text-align: left;
      padding: 11px 12px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-weight: 700;
    }
    .side-item.active {
      background: rgba(18,102,229,0.08);
      border-color: rgba(18,102,229,0.14);
      color: var(--primary-strong);
    }
    .catalogue-panel {
      padding: 18px;
    }
    .catalogue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .catalogue-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .tag-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.18);
      background: rgba(248,250,252,0.82);
    }
    .tag-card .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
      flex-shrink: 0;
    }
    .dot.local { background: var(--warning); }
    .tag-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      min-width: 0;
    }
    .tag-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.54);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 18px;
    }
    .modal {
      width: min(560px, 100%);
      background: rgba(255,255,255,0.97);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
      max-height: 88vh;
      overflow: auto;
    }
    .modal.large {
      width: min(980px, 100%);
    }
    .modal .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 180px; }
    .stack { display: grid; gap: 12px; }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-weight: 600;
    }

    @media (max-width: 760px) {
      .catalogue-layout,
      .filter-grid {
        grid-template-columns: 1fr;
      }
      .screen-header,
      .toolbar,
      .topbar {
        align-items: flex-start;
      }
      .topbar {
        height: auto;
        padding: 14px 18px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const STORAGE_KEY = 'hastus_libre_v2';

    const DEFAULT_DATA = () => ({
      users: [],
      session: null,
      instances: [],
      data: {},
      lastView: 'lines'
    });

    const state = {
      currentUser: null,
      instance: null,
      view: 'lines',
      catalogSection: 'Activités',
      columns: ['abrev', 'nom', 'reseau', 'contrat', 'activite', 'mode', 'groupe'],
      tableFilters: {
        query: '',
        network: 'all',
        activity: 'all',
        mode: 'all',
        sortBy: 'abrev',
        sortDir: 'asc'
      }
    };

    const storage = {
      load() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!parsed) return DEFAULT_DATA();
          return {
            ...DEFAULT_DATA(),
            ...parsed,
            users: parsed.users || [],
            instances: parsed.instances || [],
            data: parsed.data || {}
          };
        } catch (error) {
          return DEFAULT_DATA();
        }
      },
      save(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }
    };

    function uid(prefix) {
      return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function createEmptyData() {
      return {
        networks: [],
        contracts: [],
        lines: [],
        catalogue: {
          'Activités': {
            labels: [
              { nom: 'Urbaine', origin: 'standard', codes: {} },
              { nom: 'Régulière (interurbaine)', origin: 'standard', codes: {} },
              { nom: 'Scolaire', origin: 'standard', codes: {} },
              { nom: 'À la demande', origin: 'standard', codes: {} },
              { nom: 'Navette', origin: 'standard', codes: {} }
            ],
            columns: ['export']
          },
          'Modes de transport': {
            labels: [
              { nom: 'Tramway', origin: 'standard', codes: { export: '0' } },
              { nom: 'Métro', origin: 'standard', codes: { export: '1' } },
              { nom: 'Autobus', origin: 'standard', codes: { export: '3' } },
              { nom: 'Autocar', origin: 'standard', codes: { export: '3' } },
              { nom: 'Trolleybus', origin: 'standard', codes: { export: '11' } }
            ],
            columns: ['export']
          },
          'Types de véhicule': { labels: [{ nom: 'Bus standard 12 m', origin: 'standard', codes: {} }, { nom: 'Bus articulé 18 m', origin: 'standard', codes: {} }, { nom: 'Car 13 m', origin: 'standard', codes: {} }, { nom: 'Minibus', origin: 'standard', codes: {} }], columns: ['export'] },
          'Types d\'énergie': { labels: [{ nom: 'Gasoil', origin: 'standard', codes: {} }, { nom: 'HVO', origin: 'standard', codes: {} }, { nom: 'Électrique', origin: 'standard', codes: {} }, { nom: 'GNV', origin: 'standard', codes: {} }, { nom: 'Hybride', origin: 'standard', codes: {} }], columns: ['export'] },
          'Fonctions embarquées': { labels: [{ nom: 'Wi-Fi', origin: 'standard', codes: {} }, { nom: 'PMR', origin: 'standard', codes: {} }, { nom: 'Emport vélo', origin: 'standard', codes: {} }, { nom: 'Prise USB', origin: 'standard', codes: {} }, { nom: 'Écran info voyageurs', origin: 'standard', codes: {} }], columns: ['export'] },
          'Groupes de lignes': { labels: [], columns: ['export'] }
        },
        customColumns: [],
        counter: 1
      };
    }

    function getStore() {
      return storage.load();
    }

    function currentUser() {
      const data = getStore();
      return data.users.find(u => u.id === data.session) || null;
    }

    function saveStore(data) {
      storage.save(data);
    }

    function getInstanceData(instanceId) {
      const data = getStore();
      return data.data[instanceId] || createEmptyData();
    }

    function getVisibleInstances() {
      const data = getStore();
      const user = currentUser();
      if (!user) return [];
      return data.instances.filter(inst => user.admin || inst.ownerId === user.id || (inst.members || []).includes(user.id));
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
    }

    function render() {
      const app = document.getElementById('app');
      const user = currentUser();

      if (!user) {
        app.innerHTML = renderLogin();
        bindLogin();
        return;
      }

      if (!state.instance) {
        app.innerHTML = renderDashboard(user);
        bindDashboard();
        return;
      }

      app.innerHTML = renderWorkspace(user);
      bindWorkspace();
    }

    function renderLogin() {
      return `
        <div class="app-shell">
          <header class="topbar">
            <div class="brand">
              <span class="brand-mark">🚌</span>
              <span>HASTUS libre</span>
            </div>
            <div class="topbar-actions">
              <span class="badge">Version 2 · Réseau</span>
            </div>
          </header>
          <main class="auth-wrap">
            <section class="auth-card">
              <h1>Connexion</h1>
              <p class="subtitle">Accédez à vos instances de travail et gérez vos lignes, réseaux, contrats et catalogues.</p>
              <div class="field">
                <label for="username">Nom d'utilisateur</label>
                <input id="username" autocomplete="username" />
              </div>
              <div class="field">
                <label for="password">Mot de passe</label>
                <input id="password" type="password" autocomplete="current-password" />
              </div>
              <div class="error" id="authError"></div>
              <div class="inline-actions">
                <button id="loginBtn" class="primary">Se connecter</button>
                <button id="registerBtn">Créer un compte</button>
              </div>
            </section>
          </main>
        </div>
      `;
    }

    function bindLogin() {
      const loginBtn = document.getElementById('loginBtn');
      const registerBtn = document.getElementById('registerBtn');
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const errorBox = document.getElementById('authError');

      const handleSubmit = (mode) => {
        const name = username.value.trim();
        const pass = password.value;
        const store = getStore();
        if (!name || pass.length < 4) {
          errorBox.textContent = 'Le nom et le mot de passe sont obligatoires. (4 caractères minimum)';
          return;
        }

        if (mode === 'login') {
          const user = store.users.find(u => u.name.toLowerCase() === name.toLowerCase() && u.password === btoa(pass));
          if (!user) {
            errorBox.textContent = 'Identifiants incorrects.';
            return;
          }
          store.session = user.id;
          saveStore(store);
          render();
          return;
        }

        if (store.users.some(u => u.name.toLowerCase() === name.toLowerCase())) {
          errorBox.textContent = 'Ce nom d\'utilisateur existe déjà.';
          return;
        }

        const newUser = {
          id: uid('u'),
          name,
          password: btoa(pass),
          admin: store.users.length === 0
        };
        store.users.push(newUser);
        store.session = newUser.id;
        saveStore(store);
        render();
      };

      loginBtn.addEventListener('click', () => handleSubmit('login'));
      registerBtn.addEventListener('click', () => handleSubmit('register'));
      [username, password].forEach(input => {
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') handleSubmit('login');
        });
      });
    }

    function getFilteredLines(data) {
      const query = (state.tableFilters.query || '').trim().toLowerCase();
      let rows = data.lines.filter(line => {
        const networkName = findNetworkName(data, line.reseauId).toLowerCase();
        const text = `${line.abrev || ''} ${line.nom || ''} ${networkName} ${line.activite || ''} ${line.mode || ''}`.toLowerCase();
        const matchesQuery = !query || text.includes(query);
        const matchesNetwork = state.tableFilters.network === 'all' || line.reseauId === state.tableFilters.network;
        const matchesActivity = state.tableFilters.activity === 'all' || line.activite === state.tableFilters.activity;
        const matchesMode = state.tableFilters.mode === 'all' || line.mode === state.tableFilters.mode;
        return matchesQuery && matchesNetwork && matchesActivity && matchesMode;
      });

      rows.sort((a, b) => {
        const dir = state.tableFilters.sortDir === 'asc' ? 1 : -1;
        const aValue = String(a[state.tableFilters.sortBy] ?? '').toLowerCase();
        const bValue = String(b[state.tableFilters.sortBy] ?? '').toLowerCase();
        return aValue.localeCompare(bValue, undefined, { numeric: true }) * dir;
      });

      return rows;
    }

        return `

      document.querySelectorAll('.edit-catalogue').forEach(btn => {
        btn.addEventListener('click', () => openCatalogueModal(btn.dataset.section, Number(btn.dataset.index)));
      });

      document.querySelectorAll('.delete-catalogue').forEach(btn => {
        btn.addEventListener('click', () => {
          const store = getStore();
          const data = getInstanceData(state.instance.id);
          const section = btn.dataset.section;
          const index = Number(btn.dataset.index);
          const labels = data.catalogue[section]?.labels || [];
          if (index < 0 || index >= labels.length) return;
          const label = labels[index];
          const used = data.lines.filter(line => {
            const values = [line.activite, line.mode, line.groupe, ...(line.vehicules || []), ...(line.energies || []), ...(line.fonctions || [])];
            return values.includes(label.nom);
          });
          if (used.length) {
            alert(`Impossible de supprimer ce libellé. Il est utilisé par ${used.length} ligne(s).`);
            return;
          }
          labels.splice(index, 1);
          store.data[state.instance.id] = data;
          saveStore(store);
          render();
        });
      });
    }

    function openInstanceModal(mode, instanceId = null) {
      const store = getStore();
      const existing = instanceId ? store.instances.find(inst => inst.id === instanceId) : null;
      const modalEl = document.createElement('div');
      modalEl.className = 'modal-backdrop';
      modalEl.innerHTML = `
        <div class="modal">
          <div class="header">
            <h2>${mode === 'create' ? 'Créer une instance' : 'Modifier l\'instance'}</h2>
            <button class="ghost close-modal">Fermer</button>
          </div>
          <div class="stack">
            <div class="field">
              <label>Nom</label>
              <input id="instanceName" value="${escapeHtml(existing ? existing.name : '')}" maxlength="32" />
            </div>
            <div class="field">
              <label>Description</label>
              <textarea id="instanceDescription" maxlength="256">${escapeHtml(existing ? existing.description : '')}</textarea>
            </div>
            <div class="error" id="instanceError"></div>
          </div>
          <div class="modal-actions">
            <button class="close-modal">Annuler</button>
            <button class="primary" id="confirmInstanceBtn">${mode === 'create' ? 'Créer' : 'Enregistrer'}</button>
          </div>
        </div>
      `;

      document.body.appendChild(modalEl);
      modalEl.querySelector('.close-modal').addEventListener('click', () => modalEl.remove());

      modalEl.querySelector('#confirmInstanceBtn').addEventListener('click', () => {
        const name = modalEl.querySelector('#instanceName').value.trim();
        const description = modalEl.querySelector('#instanceDescription').value.trim();
        const err = modalEl.querySelector('#instanceError');

        if (!name) {
          err.textContent = 'Le nom de l\'instance est obligatoire.';
          return;
        }

        if (mode === 'create') {
          const instance = {
            id: uid('i'),
            name,
            description,
            ownerId: currentUser().id,
            members: []
          };
          store.instances.push(instance);
          store.data[instance.id] = createEmptyData();
        } else {
          const inst = store.instances.find(i => i.id === instanceId);
          if (!inst) return;
          inst.name = name;
          inst.description = description;
        }

        saveStore(store);
        modalEl.remove();
        render();
      });
    }

    function duplicateInstanceModal(instanceId) {
      const store = getStore();
      const copy = store.instances.find(inst => inst.id === instanceId);
      if (!copy) return;
      const name = `${copy.name} (copie)`;
      const cloned = JSON.parse(JSON.stringify(store.data[instanceId] || createEmptyData()));
      const id = uid('i');
      store.instances.push({
        id,
        name,
        description: copy.description,
        ownerId: currentUser().id,
        members: []
      });
      store.data[id] = cloned;
      saveStore(store);
      render();
    }

    function editInstanceModal(instanceId) {
      openInstanceModal('edit', instanceId);
    }

    function openNetworkModal(networkId = null) {
      const store = getStore();
      const data = getInstanceData(state.instance.id);
      const existing = networkId ? data.networks.find(n => n.id === networkId) : null;
      const modalEl = document.createElement('div');
      modalEl.className = 'modal-backdrop';
      modalEl.innerHTML = `
        <div class="modal">
          <div class="header">
            <h2>${existing ? 'Modifier le réseau' : 'Nouveau réseau'}</h2>
            <button class="ghost close-modal">Fermer</button>
          </div>
          <div class="field">
            <label>Nom du réseau</label>
            <input id="networkName" value="${escapeHtml(existing ? existing.name : '')}" />
          </div>
          <div class="error" id="networkError"></div>
          <div class="modal-actions">
            <button class="close-modal">Annuler</button>
            <button class="primary" id="saveNetwork">Enregistrer</button>
          </div>
        </div>
      `;
      document.body.appendChild(modalEl);
      modalEl.querySelector('.close-modal').addEventListener('click', () => modalEl.remove());
      modalEl.querySelector('#saveNetwork').addEventListener('click', () => {
        const name = modalEl.querySelector('#networkName').value.trim();
        if (!name) {
          modalEl.querySelector('#networkError').textContent = 'Le nom du réseau est obligatoire.';
          return;
        }
        const store = getStore();
        const data = getInstanceData(state.instance.id);
        if (existing) {
          existing.name = name;
        } else {
          data.networks.push({ id: uid('n'), name, validiteDebut: '', validiteFin: '' });
        }
        store.data[state.instance.id] = data;
        saveStore(store);
        modalEl.remove();
        render();
      });
    }

    function openContractModal(contractId = null) {
      const store = getStore();
      const data = getInstanceData(state.instance.id);
      const existing = contractId ? data.contracts.find(c => c.id === contractId) : null;
      const modalEl = document.createElement('div');
      modalEl.className = 'modal-backdrop';
      modalEl.innerHTML = `
        <div class="modal">
          <div class="header">
            <h2>${existing ? 'Modifier le contrat' : 'Nouveau contrat'}</h2>
            <button class="ghost close-modal">Fermer</button>
          </div>
          <div class="field">
            <label>Nom du contrat</label>
            <input id="contractName" value="${escapeHtml(existing ? existing.name : '')}" />
          </div>
          <div class="error" id="contractError"></div>
          <div class="modal-actions">
            <button class="close-modal">Annuler</button>
            <button class="primary" id="saveContract">Enregistrer</button>
          </div>
        </div>
      `;
      document.body.appendChild(modalEl);
      modalEl.querySelector('.close-modal').addEventListener('click', () => modalEl.remove());
      modalEl.querySelector('#saveContract').addEventListener('click', () => {
        const name = modalEl.querySelector('#contractName').value.trim();
        if (!name) {
          modalEl.querySelector('#contractError').textContent = 'Le nom du contrat est obligatoire.';
          return;
        }
        const store = getStore();
        const data = getInstanceData(state.instance.id);
        if (existing) {
          existing.name = name;
        } else {
          data.contracts.push({ id: uid('c'), name, reseaux: [], prive: false });
        }
        store.data[state.instance.id] = data;
        saveStore(store);
        modalEl.remove();
        render();
      });
    }

    function openLineModal(lineId = null) {
      const store = getStore();
      const data = getInstanceData(state.instance.id);
      const existing = lineId ? data.lines.find(line => line.id === lineId) : null;
      const modalEl = document.createElement('div');
      modalEl.className = 'modal-backdrop';
      modalEl.innerHTML = `
        <div class="modal large">
          <div class="header">
            <h2>${existing ? 'Modifier la ligne' : 'Nouvelle ligne'}</h2>
            <button class="ghost close-modal">Fermer</button>
          </div>
          <div class="row">
            <div class="field">
              <label>Abréviation</label>
              <input id="lineAbrev" value="${escapeHtml(existing ? existing.abrev : '')}" maxlength="8" />
            </div>
            <div class="field">
              <label>Nom commercial</label>
              <input id="lineNom" value="${escapeHtml(existing ? existing.nom : '')}" maxlength="64" />
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>Réseau</label>
              <select id="lineReseau">
                <option value="">— Choisir —</option>
                ${data.networks.map(net => `<option value="${net.id}" ${existing && existing.reseauId === net.id ? 'selected' : ''}>${escapeHtml(net.name)}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>Contrat</label>
              <select id="lineContrat">
                <option value="">— Choisir —</option>
                ${data.contracts.map(contract => `<option value="${contract.id}" ${existing && existing.contratId === contract.id ? 'selected' : ''}>${escapeHtml(contract.name)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>Activité</label>
              <select id="lineActivite">
                <option value="">— Choisir —</option>
                ${getCatalogueOptions(data, 'Activités').map(opt => `<option value="${escapeHtml(opt.nom)}" ${existing && existing.activite === opt.nom ? 'selected' : ''}>${escapeHtml(opt.nom)}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>Mode</label>
              <select id="lineMode">
                <option value="">— Choisir —</option>
                ${getCatalogueOptions(data, 'Modes de transport').map(opt => `<option value="${escapeHtml(opt.nom)}" ${existing && existing.mode === opt.nom ? 'selected' : ''}>${escapeHtml(opt.nom)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="field">
            <label>Groupe</label>
            <select id="lineGroupe">
              <option value="">— Choisir —</option>
              ${getCatalogueOptions(data, 'Groupes de lignes').map(opt => `<option value="${escapeHtml(opt.nom)}" ${existing && existing.groupe === opt.nom ? 'selected' : ''}>${escapeHtml(opt.nom)}</option>`).join('')}
            </select>
          </div>
          <div class="error" id="lineError"></div>
          <div class="modal-actions">
            <button class="close-modal">Annuler</button>
            <button class="primary" id="saveLine">Enregistrer</button>
          </div>
        </div>
      `;
      document.body.appendChild(modalEl);
      modalEl.querySelector('.close-modal').addEventListener('click', () => modalEl.remove());
      modalEl.querySelector('#saveLine').addEventListener('click', () => {
        const abrev = modalEl.querySelector('#lineAbrev').value.trim();
        const nom = modalEl.querySelector('#lineNom').value.trim();
        const reseauId = modalEl.querySelector('#lineReseau').value || null;
        const contratId = modalEl.querySelector('#lineContrat').value || null;
        const activite = modalEl.querySelector('#lineActivite').value || '';
        const mode = modalEl.querySelector('#lineMode').value || '';
        const groupe = modalEl.querySelector('#lineGroupe').value || '';
        const err = modalEl.querySelector('#lineError');

        if (!abrev || !nom || !reseauId || !activite || !mode) {
          err.textContent = 'Abréviation, nom, réseau, activité et mode sont obligatoires.';
          return;
        }

        const instanceData = getInstanceData(state.instance.id);
        const linePayload = {
          id: existing ? existing.id : uid('l'),
          abrev,
          nom,
          reseauId,
          contratId,
          activite,
          mode,
          groupe,
          vehicules: existing ? existing.vehicules || [] : [],
          energies: existing ? existing.energies || [] : [],
          fonctions: existing ? existing.fonctions || [] : []
        };

        if (existing) {
          const idx = instanceData.lines.findIndex(line => line.id === existing.id);
          instanceData.lines[idx] = linePayload;
        } else {
          instanceData.lines.push(linePayload);
        }

        store.data[state.instance.id] = instanceData;
        saveStore(store);
        modalEl.remove();
        render();
      });
    }

    function openCatalogueModal(section, index = null) {
      const store = getStore();
      const data = getInstanceData(state.instance.id);
      const labels = data.catalogue[section]?.labels || [];
      const existing = index != null ? labels[index] : null;
      const modalEl = document.createElement('div');
      modalEl.className = 'modal-backdrop';
      modalEl.innerHTML = `
        <div class="modal">
          <div class="header">
            <h2>${existing ? 'Modifier le libellé' : 'Ajouter un libellé'}</h2>
            <button class="ghost close-modal">Fermer</button>
          </div>
          <div class="field">
            <label>Libellé</label>
            <input id="catalogueLabel" value="${escapeHtml(existing ? existing.nom : '')}" maxlength="32" />
          </div>
          <div class="error" id="catalogueError"></div>
          <div class="modal-actions">
            <button class="close-modal">Annuler</button>
            <button class="primary" id="saveCatalogueItem">Enregistrer</button>
          </div>
        </div>
      `;
      document.body.appendChild(modalEl);
      modalEl.querySelector('.close-modal').addEventListener('click', () => modalEl.remove());
      modalEl.querySelector('#saveCatalogueItem').addEventListener('click', () => {
        const value = modalEl.querySelector('#catalogueLabel').value.trim();
        if (!value) {
          modalEl.querySelector('#catalogueError').textContent = 'Le libellé est obligatoire.';
          return;
        }

        const data = getInstanceData(state.instance.id);
        if (existing) {
          existing.nom = value;
          existing.origin = 'local';
        } else {
          data.catalogue[section].labels.push({ nom: value, origin: 'local', codes: {} });
        }

        const store = getStore();
        store.data[state.instance.id] = data;
        saveStore(store);
        modalEl.remove();
        render();
      });
    }

    function countCatalogueAlerts(data) {
      let count = 0;
      Object.values(data.catalogue).forEach(cat => {
        cat.labels.forEach(label => {
          if (label.origin === 'local' && !(label.codes && label.codes.export)) count += 1;
        });
      });
      return count;
    }

    function getCatalogueOptions(data, category) {
      return (data.catalogue[category]?.labels || []).map(label => ({ ...label }));
    }

    function findNetworkName(data, id) {
      const item = (data.networks || []).find(net => net.id === id);
      return item ? item.name : '—';
    }

    function findContractName(data, id) {
      const item = (data.contracts || []).find(contract => contract.id === id);
      return item ? item.name : '—';
    }

    function applyBulkImport(data, text) {
      const lines = text.split(/\r?\n/).filter(Boolean);
      for (const row of lines) {
        const values = row.split(/\t|;/).map(v => v.trim());
        if (!values[0]) continue;
        const abrev = values[0].slice(0, 8);
        const nom = values[1]?.slice(0, 64) || '';
        const networkName = values[2]?.slice(0, 32) || '';
        const contractName = values[3]?.slice(0, 32) || '';
        const activite = values[4]?.slice(0, 32) || '';
        const mode = values[5]?.slice(0, 32) || '';
        const groupe = values[6]?.slice(0, 32) || '';

        let network = data.networks.find(net => net.name.toLowerCase() === networkName.toLowerCase());
        if (!network && networkName) {
          network = { id: uid('n'), name: networkName, validiteDebut: '', validiteFin: '' };
          data.networks.push(network);
        }

        let contract = null;
        if (contractName) {
          contract = data.contracts.find(c => c.name.toLowerCase() === contractName.toLowerCase());
        }

        if (!data.catalogue['Activités'].labels.some(label => label.nom.toLowerCase() === activite.toLowerCase()) && activite) {
          data.catalogue['Activités'].labels.push({ nom: activite, origin: 'local', codes: {} });
        }
        if (!data.catalogue['Modes de transport'].labels.some(label => label.nom.toLowerCase() === mode.toLowerCase()) && mode) {
          data.catalogue['Modes de transport'].labels.push({ nom: mode, origin: 'local', codes: {} });
        }
        if (!data.catalogue['Groupes de lignes'].labels.some(label => label.nom.toLowerCase() === groupe.toLowerCase()) && groupe) {
          data.catalogue['Groupes de lignes'].labels.push({ nom: groupe, origin: 'local', codes: {} });
        }

        const existing = data.lines.find(line => line.abrev.toLowerCase() === abrev.toLowerCase());
        if (existing) {
          if (nom) existing.nom = nom;
          if (network) existing.reseauId = network.id;
          if (contract) existing.contratId = contract.id;
          if (activite) existing.activite = activite;
          if (mode) existing.mode = mode;
          if (groupe) existing.groupe = groupe;
        } else {
          data.lines.push({
            id: uid('l'),
            abrev,
            nom,
            reseauId: network ? network.id : null,
            contratId: contract ? contract.id : null,
            activite,
            mode,
            groupe,
            vehicules: [],
            energies: [],
            fonctions: []
          });
        }
      }
    }

    function runCoreTests() {
      const data = createEmptyData();
      const results = [];
      data.networks.push({ id: 'r1', name: 'Réseau test' });
      data.contracts.push({ id: 'c1', name: 'Contrat test', reseaux: [], prive: false });
      data.lines.push({ id: 'l1', abrev: 'A1', nom: 'Ligne A', reseauId: 'r1', contratId: 'c1', activite: 'Urbaine', mode: 'Autobus', groupe: '', vehicules: [], energies: [], fonctions: [] });

      if (data.lines.length === 1) results.push('✅ initialisation');
      if (data.networks[0].name === 'Réseau test') results.push('✅ réseau');
      if (data.catalogue['Activités'].labels.some(v => v.nom === 'Urbaine')) results.push('✅ catalogue');
      if (data.lines[0].abrev === 'A1') results.push('✅ ligne');

      return results.join('\n') || 'Aucun test exécuté.';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const store = getStore();
      if (!Array.isArray(store.users)) {
        store.users = [];
        saveStore(store);
      }
      render();
    });
  </script>
