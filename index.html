  .inline-flex { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* Catalogue : couleurs d'origine des labels (légende affichée dans la vue). */
  .pastille { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .pastille.std { background: #0284c7; }

  .ico:hover { color: #0284c7; }
  /* Menu ⚙ Colonnes : grille STRICTE en 4 colonnes (demande de Jules) :
     case 1/8 (centrée) · nom 5/8 (aligné à gauche) · flèche ↑ 1/8 · flèche ↓ 1/8
     (boutons centrés). Les largeurs proportionnelles garantissent l'alignement. */
  .p-ligne { display: grid; grid-template-columns: 1fr 5fr 1fr 1fr; align-items: center; gap: 8px; padding: 6px 10px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }

    background: #0f172a; color: #fff; padding: 8px 10px; border-radius: 8px;

<body>
<div id="app"></div>
<script>
/* ================================================================
   HASTUS libre – Version 1 : bloc « Définition du réseau »
   ----------------------------------------------------------------
   ARCHITECTURE MODULAIRE (chaque section est indépendante) :
   1. NOYAU   : logique métier pure, sans aucune référence à l'affichage.
                C'est cette partie que les tests automatiques vérifient.
   2. BD      : sauvegarde locale (localStorage = dans ce navigateur).
   3. VUES    : affichage des écrans (identification, accueil, espace de travail).
   4. TESTS   : suite de tests automatiques exécutée sur le noyau.
   ================================================================ */

/* ============ 1. NOYAU : logique métier pure ============ */
const Noyau = (() => {

  /* Structure de données d'une instance neuve.
     Le catalogue par défaut est aligné sur les vocabulaires NeTEx/GTFS. */
  const instanceNeuve = () => ({
    reseaux: [],   // [{id, nom, validiteDebut, validiteFin}]
    contrats: [],  // [{id, nom, reseaux:[ids], prive:true}]
    lignes: [],    // [{id, abrev, nom, reseauId, contratId, activite, mode, groupe, vehicules:[], energies:[], fonctions:[]}]
    /* Le catalogue : un « classeur » dont chaque catégorie est un onglet.
       - labels : [{nom, origine: "standard"|"local", codes: {export: "3"}}]
         "standard" = issu des référentiels GTFS/NeTEx (bleu) ;
         "local" = ajouté ou modifié par l'utilisateur (orange).
       - colonnes : colonnes de codes d'export, remplies par l'utilisateur. */
    catalogue: {
      "Activités": catNeuve(["Urbaine", "Régulière (interurbaine)", "Scolaire", "À la demande", "Navette"]),
      "Modes de transport": catNeuve([["Tramway", "0"], ["Métro", "1"], ["Autobus", "3"], ["Autocar", "3"], ["Trolleybus", "11"]],
        v => ({ nom: v[0], origine: "standard", codes: { export: v[1] } })),
      "Types de véhicule": catNeuve(["Bus standard 12 m", "Bus articulé 18 m", "Car 13 m", "Minibus"]),
      "Types d'énergie": catNeuve(["Gasoil", "HVO", "Électrique", "GNV", "Hybride"]),
      "Fonctions embarquées": catNeuve(["Wi-Fi", "PMR", "Emport vélo", "Prise USB", "Écran info voyageurs"]),
      "Groupes de lignes": catNeuve([])   // sert au network_id des exports GTFS/NeTEx
    },
    colonnesCalculees: [], // colonnes compteur définies par l'utilisateur (onglet dédié)
    compteur: 1 // générateur d'identifiants locaux à l'instance
  });

  /* Fabrique une catégorie du catalogue : liste de labels + colonne d'export. */
  const catNeuve = (valeurs, vers) => ({
    colonnes: ["export"],
    labels: valeurs.map(vers || (v => ({ nom: v, origine: "standard", codes: {} })))
  });

  const nouvelId = (data) => "o" + (data.compteur++);

  /* Règle métier : une ligne = abréviation unique + 1 activité + 1 mode,
     plusieurs véhicules / énergies / fonctions. Retourne une liste d'erreurs. */
  function validerLigne(data, ligne, ignoreId) {
    const errs = [];
    if (!ligne.abrev || !ligne.abrev.trim()) errs.push("Abréviation obligatoire.");
    else if (ligne.abrev.trim().length > 8) errs.push("Abréviation : 8 caractères maximum.");
    else if (data.lignes.some(l => l.abrev.toLowerCase() === ligne.abrev.trim().toLowerCase()
              && l.id !== ignoreId)) errs.push("Abréviation déjà utilisée dans cette instance.");
    if (!ligne.nom || !ligne.nom.trim()) errs.push("Nom commercial obligatoire.");
    else if (ligne.nom.trim().length > 64) errs.push("Nom commercial : 64 caractères maximum.");
    if (!ligne.reseauId) errs.push("Réseau obligatoire.");
    if (!ligne.activite) errs.push("Activité obligatoire (une seule).");
    if (!ligne.mode) errs.push("Mode de transport obligatoire (un seul).");
    return errs;
  }

  /* Catalogue : ajout (doublons refusés), modification, suppression.
     origine "standard" (référentiel GTFS/NeTEx, couleur bleue) ou
     "local" (ajouté/modifié par l'utilisateur, couleur orange). */
  function ajouterLabel(data, categorie, valeur, origine) {
    const v = (valeur || "").trim().slice(0, 32);   // 32 caractères max
    const cat = data.catalogue[categorie];
    if (!v) return { ok: false, erreur: "Label vide." };
    if ((valeur || "").trim().length > 32) return { ok: false, erreur: "32 caractères maximum pour un label." };
    if (cat.labels.some(x => x.nom.toLowerCase() === v.toLowerCase()))
      return { ok: false, erreur: "Ce label existe déjà." };
    cat.labels.push({ nom: v, origine: origine || "local", codes: {} });
    return { ok: true };
  }
  function modifierLabel(data, categorie, index, valeur) {
    const v = (valeur || "").trim();
    if (!v) return { ok: false, erreur: "Label vide." };
    if (v.length > 32) return { ok: false, erreur: "32 caractères maximum pour un label." };
    const l = data.catalogue[categorie].labels[index];
    const ancien = l.nom;
    l.nom = v;
    l.origine = "local"; // un label modifié par l'utilisateur passe en orange
    // Répercussion : les lignes qui utilisaient l'ancien nom suivent le
    // renommage (sinon elles pointeraient vers un label qui n'existe plus).
    renommerDansLignes(data, categorie, ancien, v);
    return { ok: true };
  }
  function supprimerLabel(data, categorie, index) {
    const l = data.catalogue[categorie].labels[index];
    if (!l) return { ok: false, erreur: "Label introuvable." };
    // Règle métier (Jules) : un label UTILISÉ par des lignes ne se supprime pas.
    const usages = usagesLabel(data, categorie, l.nom);
    if (usages.length)
      return { ok: false, erreur: `Impossible : utilisé par ${usages.length} ligne(s) — ${usages.slice(0, 3).map(x => x.abrev).join(", ")}${usages.length > 3 ? "…" : ""}. Détachez-le d'abord (bouton 🔎).` };
    data.catalogue[categorie].labels.splice(index, 1);
    return { ok: true };
  }

  /* ---- Cartographie des usages (demande de Jules : « où est-ce utilisé ? »)
     Chaque catégorie du catalogue alimente un champ des lignes. */
  const USAGES_CATALOGUE = {
    "Activités":            { prop: "activite" },
    "Modes de transport":   { prop: "mode" },
    "Groupes de lignes":    { prop: "groupe" },
    "Types de véhicule":    { prop: "vehicules", multiple: true },
    "Types d'énergie":      { prop: "energies", multiple: true },
    "Fonctions embarquées": { prop: "fonctions", multiple: true }
  };
  /* Les lignes qui utilisent ce label du catalogue. */
  function usagesLabel(data, categorie, nom) {
    const u = USAGES_CATALOGUE[categorie];
    if (!u) return [];
    const memeNom = v => (v || "").toLowerCase() === nom.toLowerCase();
    return data.lignes.filter(l => u.multiple ? (l[u.prop] || []).some(memeNom) : memeNom(l[u.prop]));
  }
  /* Renomme un label dans toutes les lignes qui l'utilisent. */
  function renommerDansLignes(data, categorie, ancien, nouveau) {
    const u = USAGES_CATALOGUE[categorie];
    if (!u) return;
    data.lignes.forEach(l => {
      if (u.multiple) l[u.prop] = (l[u.prop] || []).map(x => x.toLowerCase() === ancien.toLowerCase() ? nouveau : x);
      else if ((l[u.prop] || "").toLowerCase() === ancien.toLowerCase()) l[u.prop] = nouveau;
    });
  }

  /* ---- Règles d'unicité et usages des réseaux / contrats ---- */
  /* Un nom identifie un objet : deux réseaux (ou deux contrats) de même
     nom sont interdits — c'est le « code unique » au niveau réseau/contrat. */
  function nomUtilise(liste, nom, ignoreId) {
    return liste.some(x => x.id !== ignoreId && x.nom.trim().toLowerCase() === nom.trim().toLowerCase());
  }
  function usagesReseau(data, id) {
    return {
      lignes: data.lignes.filter(l => l.reseauId === id),
      contrats: data.contrats.filter(c => (c.reseaux || []).includes(id))
    };
  }
  function usagesContrat(data, id) {
    return { lignes: data.lignes.filter(l => l.contratId === id) };
  }
  /* Doublons de codes d'export dans une catégorie : chaque code doit être
     unique (il identifiera le label dans les exports GTFS/NeTEx). */
  function doublonsCodes(data, categorie, colonne) {
    const vus = new Set(), doublons = new Set();
    data.catalogue[categorie].labels.forEach(l => {
      const c = (l.codes[colonne] || "").trim();
      if (c && vus.has(c)) doublons.add(c);
      vus.add(c);
    });
    return [...doublons];
  }
  /* Valeur d'une colonne calculée utilisateur (testée par la suite). */
  function valeurColCalculee(ligne, def) { return (ligne[def.cible] || []).length; }

  /* Référentiel des standards (aligné GTFS / NeTEx). Le bouton « Mettre à
     jour » de la vue Catalogue ajoute automatiquement les valeurs manquantes,
     marquées "standard" (bleu), avec leur code GTFS pré-rempli quand il
     existe (ex. route_type des modes de transport). Structure prête à être
     alimentée plus tard par une API : il suffit d'enrichir ce référentiel. */
  const REFERENTIEL = {
    "Activités": [["Navette nocturne", ""], ["Transport de substitution", ""]],
    "Modes de transport": [["Train / RER", "2"], ["Ferry / bateau", "4"], ["Téléphérique", "6"], ["Funiculaire", "7"]],
    "Types de véhicule": [["Midibus", ""], ["Bus bi-articulé 24 m", ""], ["Autocar double étage", ""]],
    "Types d'énergie": [["Hydrogène", ""], ["BioGNV", ""], ["Électrique batterie", ""]],
    "Fonctions embarquées": [["Climatisation", ""], ["Validation sans contact", ""], ["Bandeau lumineux extérieur", ""], ["Annonces sonores", ""]],
    "Groupes de lignes": []
  };
  function majReferentiel(data) {
    let ajoutes = 0;
    Object.entries(REFERENTIEL).forEach(([categorie, valeurs]) => {
      valeurs.forEach(([v, code]) => {
        const r = ajouterLabel(data, categorie, v, "standard");
        if (r.ok) {
          if (code) data.catalogue[categorie].labels[data.catalogue[categorie].labels.length - 1].codes["export"] = code;
          ajoutes++;
        }
      });
    });
    return { ajoutes };
  }

  /* Import en masse depuis Excel. Colonnes : Abrév, Nom, Réseau, Contrat,
     Activité, Mode, Groupe (l'abréviation est la clé : existante → mise à
     jour, nouvelle → création).
     Règles métier (Jules) :
     - une valeur obligatoire inconnue (réseau, activité, mode, groupe) est
       CRÉÉE automatiquement ; le badge ⚠ du catalogue rappellera qu'elle
       doit être paramétrée (code d'export) ;
     - les lignes « suspectes » (même nom commercial qu'une ligne existante)
       sont signalées pour validation avant l'import ;
     - le contrat, non obligatoire, n'est jamais créé automatiquement :
     il n'est relié que s'il existe déjà. */
  function appliquerColle(data, texte) {
    const res = { maj: 0, crees: 0, ignorees: 0, nouvellesValeurs: {}, suspects: [] };
    // Crée la valeur dans le catalogue si inconnue (marquée "local", orange).
    const marquer = (cat, v) => {
      if (!data.catalogue[cat].labels.some(x => x.nom.toLowerCase() === v.toLowerCase())) {
        ajouterLabel(data, cat, v, "local");
        (res.nouvellesValeurs[cat] = res.nouvellesValeurs[cat] || []).push(v);
      }
    };
    // Réseau obligatoire : un nom inconnu est créé immédiatement.
    const reseauDe = (nomR) => {
      let r = data.reseaux.find(x => x.nom.toLowerCase() === nomR.toLowerCase());
      if (!r) {
        r = { id: nouvelId(data), nom: nomR, validiteDebut: "", validiteFin: "" };
        data.reseaux.push(r);
        (res.nouvellesValeurs["Réseaux"] = res.nouvellesValeurs["Réseaux"] || []).push(nomR);
      }
      return r;
    };
    const lignesCollees = texte.trim().split(/\r?\n/).filter(r => r.trim());
    lignesCollees.forEach((row, idx) => {
      const c = row.split(/\t|;/);
      // Ignore la ligne d'en-tête si elle commence par "Abrév" (cas du copier-coller depuis l'export).
      if (idx === 0 && /^abr/i.test((c[0] || "").trim())) return;
      const abrev = (c[0] || "").trim();
      if (!abrev) { res.ignorees++; return; }
      // Limites (identiques à la saisie manuelle) : abréviation 8 car.,
      // nom 64 car. — la ligne est ignorée si elle ne les respecte pas.
      if (abrev.length > 8) { res.ignorees++; return; }
      const nom = (c[1] || "").trim();
      if (nom.length > 64) { res.ignorees++; return; }
      // Champs libres (réseau, contrat, activité, mode, groupe) : 32 car.
      const reseauNom = (c[2] || "").trim().slice(0, 32);
      const contratNom = (c[3] || "").trim().slice(0, 32);
      const activite = (c[4] || "").trim().slice(0, 32);
      const mode = (c[5] || "").trim().slice(0, 32);
      const groupe = (c[6] || "").trim().slice(0, 32);
      const existante = data.lignes.find(l => l.abrev.toLowerCase() === abrev.toLowerCase());
      if (existante) {
        if (nom) existante.nom = nom;
        if (reseauNom) existante.reseauId = reseauDe(reseauNom).id;
        if (contratNom) { const ct = data.contrats.find(x => x.nom.toLowerCase() === contratNom.toLowerCase()); if (ct) existante.contratId = ct.id; }
        if (activite) { marquer("Activités", activite); existante.activite = activite; }
        if (mode) { marquer("Modes de transport", mode); existante.mode = mode; }
        if (groupe) { marquer("Groupes de lignes", groupe); existante.groupe = groupe; }
        res.maj++;
      } else {
        // Suspect (demande de Jules) : même nom commercial qu'une ligne
        // existante, abréviation différente → validation demandée.
        if (nom && data.lignes.some(l => l.nom.toLowerCase() === nom.toLowerCase()))
          res.suspects.push({ abrev, nom });
        const r = reseauNom ? reseauDe(reseauNom) : null;
        const ct = contratNom ? data.contrats.find(x => x.nom.toLowerCase() === contratNom.toLowerCase()) : null;
        if (activite) marquer("Activités", activite);
        if (mode) marquer("Modes de transport", mode);
        if (groupe) marquer("Groupes de lignes", groupe);
        data.lignes.push({
          id: nouvelId(data), abrev, nom,
          reseauId: r ? r.id : null, contratId: ct ? ct.id : null,
          activite, mode, groupe,
          vehicules: [], energies: [], fonctions: []
        });
        res.crees++;
      }
    });
    return res;
  }

  /* Export du tableau au format TSV (collable directement dans Excel). */
  function exporterTSV(data, cles) {
    const entetes = cles.join("\t");
    const corps = data.lignes.map(l => cles.map(c => l[c] || "").join("\t"));
    return [entetes, ...corps].join("\n");
  }

  return { instanceNeuve, nouvelId, validerLigne, ajouterLabel, modifierLabel, supprimerLabel, appliquerColle, exporterTSV, majReferentiel,
           usagesLabel, renommerDansLignes, nomUtilise, usagesReseau, usagesContrat, doublonsCodes, valeurColCalculee };
})();

/* ============ 2. BD : persistance locale ============ */
const BD = (() => {
  const CLE = "hastus_libre_v1";
  let etat = null;
  /* Identifiant unique : horodatage + suffixe aléatoire. L'horodatage seul
     peut donner le MÊME id à deux créations dans la même milliseconde (bug
     découvert par la suite de tests : deux utilisateurs créés à la suite
     partageaient leur id, donc leurs instances !). Le suffixe aléatoire
     rend la collision impossible. */
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function charger() {
    try { etat = JSON.parse(localStorage.getItem(CLE)) || null; } catch (e) { etat = null; }
    if (!etat) etat = { utilisateurs: [], session: null, instances: [], donnees: {} };
    migrer(etat);
    return etat;
  }
  /* Migration : met à jour les données existantes vers le format actuel.
     Le catalogue a évolué (listes de textes → classeurs avec codes d'export
     et origine des labels). Sans cette étape, des données sauvegardées avec
     une version précédente deviendraient illisibles : la compatibilité
     ascendante est la règle d'or des mises à jour. */
  function migrer(e) {
    Object.values(e.donnees || {}).forEach(d => {
      if (d.catalogue) Object.entries(d.catalogue).forEach(([categorie, val]) => {
        if (Array.isArray(val)) // ancien format : simple liste de textes
          d.catalogue[categorie] = { colonnes: ["export"], labels: val.map(v => ({ nom: v, origine: "standard", codes: {} })) };
      });
      if (d.catalogue && !d.catalogue["Groupes de lignes"])
        d.catalogue["Groupes de lignes"] = { colonnes: ["export"], labels: [] };
      if (!d.colonnesCalculees) d.colonnesCalculees = [];
      (d.lignes || []).forEach(l => { if (l.groupe === undefined) l.groupe = ""; });
    });
  }
  function sauver() { localStorage.setItem(CLE, JSON.stringify(etat)); }
  function lire() { if (!etat) charger(); return etat; }

  /* Identification locale (V1 : tout reste dans CE navigateur —
     la gestion en ligne avec vrais comptes viendra dans un bloc ultérieur). */
  function inscrire(nom, motDePasse) {
    const e = lire();
    if (e.utilisateurs.some(u => u.nom.toLowerCase() === nom.trim().toLowerCase()))
      return { ok: false, erreur: "Ce nom d'utilisateur existe déjà." };
    if (!nom.trim() || motDePasse.length < 4)
      return { ok: false, erreur: "Nom requis, mot de passe de 4 caractères minimum." };
    // Le PREMIER utilisateur créé devient administrateur.
    const u = { id: uid("u"), nom: nom.trim(), mdp: btoa(motDePasse), admin: e.utilisateurs.length === 0 };
    e.utilisateurs.push(u); e.session = u.id; sauver();
    return { ok: true };
  }
  function connecter(nom, motDePasse) {
    const e = lire();
    const u = e.utilisateurs.find(u => u.nom.toLowerCase() === nom.trim().toLowerCase() && u.mdp === btoa(motDePasse));
    if (!u) return { ok: false, erreur: "Identifiants incorrects." };
    e.session = u.id; sauver(); return { ok: true };
  }
  function deconnecter() { lire().session = null; sauver(); }
  function utilisateurCourant() { const e = lire(); return e.utilisateurs.find(u => u.id === e.session) || null; }

  /* Instances : chaque instance est isolée (droits + données). */
  function mesInstances() {
    const e = lire(); const u = utilisateurCourant();
    if (!u) return [];
    return e.instances.filter(i => u.admin || i.proprio === u.id || (i.membres || []).includes(u.id));
  }
  function creerInstance(nom, desc) {
    const e = lire(); const u = utilisateurCourant(); if (!u) return { ok: false, erreur: "Non connecté." };
    // Sécurité : bornage côté données (le maxlength HTML protège la saisie,
    // cette vérification protège l'application elle-même).
    nom = (nom || "").trim().slice(0, LIMITES.nomInstance);
    desc = (desc || "").trim().slice(0, LIMITES.descInstance);
    if (!nom) return { ok: false, erreur: "Nom d'instance obligatoire." };
    try {
      const inst = { id: uid("i"), nom, desc, proprio: u.id, membres: [] };
      e.instances.push(inst);
      e.donnees[inst.id] = Noyau.instanceNeuve();
      sauver(); return { ok: true };
    } catch (err) {
      return { ok: false, erreur: "Échec de la création : " + err.message };
    }
  }
  function dupliquerInstance(id, nouveauNom, nouvelleDesc) {
    const e = lire(); const u = utilisateurCourant(); if (!u) return { ok: false, erreur: "Non connecté." };
    const src = e.instances.find(i => i.id === id); if (!src) return { ok: false, erreur: "Instance introuvable." };
    // Bornage identique à la création.
    nouveauNom = (nouveauNom || "").trim().slice(0, LIMITES.nomInstance);
    nouvelleDesc = (nouvelleDesc || "").trim().slice(0, LIMITES.descInstance);
    if (!nouveauNom) return { ok: false, erreur: "Nom obligatoire." };
    try {
      const inst = { ...src, id: uid("i"), nom: nouveauNom, desc: nouvelleDesc, proprio: u.id, membres: [] };
      // Copie PROFONDE des données : la copie vit ensuite sa vie indépendamment.
      e.instances.push(inst);
      e.donnees[inst.id] = JSON.parse(JSON.stringify(e.donnees[id]));
      sauver(); return { ok: true };
    } catch (err) {
      return { ok: false, erreur: "Échec de la duplication : " + err.message };
    }
  }
  function modifierInstance(id, nom, desc) {
    const e = lire(); const i = e.instances.find(x => x.id === id); if (!i) return { ok: false, erreur: "Introuvable." };
    // Bornage identique à la création (le maxlength HTML protège la saisie,
    // cette vérification protège l'application elle-même).
    i.nom = nom.trim().slice(0, LIMITES.nomInstance);
    i.desc = (desc || "").trim().slice(0, LIMITES.descInstance);
    sauver(); return { ok: true };
  }
  function supprimerInstance(id) {
    const e = lire();
    e.instances = e.instances.filter(i => i.id !== id);
    delete e.donnees[id]; sauver();
  }
  function donneesInstance(id) { return lire().donnees[id]; }
  /* Remise à zéro interne (uniquement pour la suite de tests : simule un
     rechargement de page en vidant le cache mémoire de la base). */
  function _raz() { etat = null; }

  /* Droits (V1 : affectation d'utilisateurs à une instance ; les rôles
     détaillés seront définis dans une version ultérieure). */
  function affecterMembre(idInstance, idUtilisateur) {
    const e = lire(); const inst = e.instances.find(i => i.id === idInstance);
    if (!inst) return { ok: false, erreur: "Instance introuvable." };
    if (!inst.membres.includes(idUtilisateur)) inst.membres.push(idUtilisateur);
    sauver(); return { ok: true };
  }
  function retirerMembre(idInstance, idUtilisateur) {
    const e = lire(); const inst = e.instances.find(i => i.id === idInstance);
    if (!inst) return { ok: false, erreur: "Instance introuvable." };
    inst.membres = inst.membres.filter(m => m !== idUtilisateur);
    sauver(); return { ok: true };
  }

  return { charger, lire, sauver, inscrire, connecter, deconnecter, utilisateurCourant, _raz,
           mesInstances, creerInstance, dupliquerInstance, modifierInstance, supprimerInstance,
           donneesInstance, affecterMembre, retirerMembre };
})();

/* ============ 3. VUES : affichage ============ */

// Fabrique un élément HTML depuis une chaîne, et échappe le texte dynamique.
function h(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* État d'interface courant (quelle instance, quel onglet, quelles colonnes). */
const App = { instanceOuverte: null, vue: "lignes", vueObjet: "reseaux", colonnes: null,
              tris: [], filtres: {}, actionsDebut: false, vueCat: "Activités" };

/* ---------- Sécurité & diagnostic ----------
   Toute erreur JavaScript non capturée s'affiche dans un bandeau rouge en
   haut de l'écran. Indispensable pour diagnostiquer à distance (ex. sur
   GitHub Pages ou un téléphone, sans console de développeur). */
function afficherErreur(msg) {
  let b = document.getElementById("bloc-erreur");
  if (!b) {
    b = document.createElement("div");
    b.id = "bloc-erreur";
    b.style.cssText = "background:#dc2626;color:#fff;padding:8px 16px;font-size:13px;position:sticky;top:0;z-index:999;";
    document.body.prepend(b);
  }
  b.textContent = "⚠️ Erreur : " + msg;
}
window.addEventListener("error", (ev) => afficherErreur(ev.message));

/* Limites de sécurité (demandées + appliquées aussi côté données,
   car un `maxlength` HTML seul peut être contourné). */
const LIMITES = { nomInstance: 32, descInstance: 256 };

function rafraichir() {
  const app = document.getElementById("app");
  const u = BD.utilisateurCourant();
  if (!u) { app.replaceChildren(vueIdentification()); return; }
  if (!App.instanceOuverte) { app.replaceChildren(vueAccueil(u)); return; }
  app.replaceChildren(vueEspaceTravail(u));
}

/* ---------- Écran identification ---------- */
function vueIdentification() {

    <div class="conteneur" style="max-width:420px;margin-top:40px;">
      <div class="carte" style="display:block;">
        <h1>Identification</h1>

/* ---------- Bouton supprimer sensible (double clic en 3 s) ---------- */
function boutonSupprimer(texte, onConfirme) {
  const b = h(`<button class="suppr"><div class="barre"></div><span style="position:relative;">${texte}</span></button>`);
  let arme = false;
  b.onclick = () => {
    if (!arme) {
      // Premier clic : on arme, la barre se vide en 3 s puis on désarme seul.
      arme = true; b.classList.add("armed"); b.querySelector("span").textContent = "Confirmer ?";
      setTimeout(() => { arme = false; b.classList.remove("armed"); b.querySelector("span").textContent = texte; }, 3000);
    } else { onConfirme(); }
  };
  return b;
}

/* Fenêtre modale générique. « large » = occupe presque tout l'écran
   (utilisée par l'import : le tableau doit tenir en largeur). */
function modal(contenu, large) {
  const fond = h(`<div class="modal-fond"><div class="modal"></div></div>`);
  if (large) { fond.firstChild.style.maxWidth = "95vw"; fond.firstChild.style.width = "95%"; }
  fond.firstChild.appendChild(contenu);
  fond.onclick = (e) => { if (e.target === fond) fond.remove(); };
  document.body.appendChild(fond);
  return fond;
}

/* Fenêtre « où est-il utilisé ? » (demande de Jules) : liste les éléments
   qui utilisent un objet, UN PAR UN, chacun modifiable ou supprimable
   directement depuis la liste. */
function modalUsages(titre, obtenirUsages) {
  const form = h(`<div>
    <h2>🔎 Utilisations — ${esc(titre)}</h2>
    <div id="u-liste"></div>
    <div class="ligne-boutons"><button id="m-fermer" class="b-bleu">Fermer</button></div>
  </div>`);
  const box = form.querySelector("#u-liste");
  const dessiner = () => {
    box.innerHTML = "";
    const usages = obtenirUsages();
    if (!usages.length) { box.appendChild(h(`<p class="info-txt">Aucune utilisation.</p>`)); return; }
    usages.forEach(u => {
      const carte = h(`<div class="carte" style="margin:6px 0;padding:8px 14px;">
        <span>${u.label()}</span><span class="inline-flex"></span></div>`);
      const act = carte.lastElementChild;
      const bM = h(`<button>Modifier</button>`);
      bM.onclick = () => { form.closest(".modal-fond").remove(); u.modifier(); };
      act.appendChild(bM);
      act.appendChild(boutonSupprimer("Supprimer", () => { u.supprimer(); BD.sauver(); dessiner(); }));
      box.appendChild(carte);
    });
  };
  form.querySelector("#m-fermer").onclick = () => form.closest(".modal-fond").remove();
  dessiner();
  modal(form);
}

function vueAccueil(u) {

  const racine = h(`<div>
    <div class="bandeau">
      <span class="logo">🚌 HASTUS libre</span>
      <span class="inline-flex"><span class="info-txt">${esc(u.nom)}${u.admin ? " (admin)" : ""}</span>

    </div>

      <div class="inline-flex" style="justify-content:space-between;width:100%;">
        <h1>Mes instances de travail</h1>
        <span class="inline-flex">
          <button id="tests">🧪 Tests</button>
          <button id="nouvelle" class="b-bleu">+ Nouvelle instance</button>
        </span>
      </div>
      <div id="liste"></div>
    </div>
  </div>`);
  racine.querySelector("#deco").onclick = () => { BD.deconnecter(); App.instanceOuverte = null; rafraichir(); };
  racine.querySelector("#tests").onclick = lancerTests;
  racine.querySelector("#nouvelle").onclick = () => {
    // Modale de création : maxlength HTML + compteur de caractères en direct,
    // + validation double côté données. try/catch pour afficher l'erreur précise
    // si quelque chose échoue (au lieu d'un silence incompréhensible).
    const form = h(`<div>
      <h2>Créer une nouvelle instance</h2>
      <div class="champ"><label>Nom de l'instance (32 caractères max.)</label>
        <input id="m-nom" maxlength="32"/><div class="info-txt" id="cpt-nom">0 / 32</div></div>
      <div class="champ"><label>Description courte (256 caractères max.)</label>
        <textarea id="m-desc" rows="2" maxlength="256"></textarea><div class="info-txt" id="cpt-desc">0 / 256</div></div>
      <div class="erreur" id="m-err"></div>
      <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-bleu">Créer</button></div>
    </div>`);
    modal(form);
    // Compteurs de caractères en direct.
    const majCompteur = () => {
      form.querySelector("#cpt-nom").textContent = `${form.querySelector("#m-nom").value.length} / 32`;
      form.querySelector("#cpt-desc").textContent = `${form.querySelector("#m-desc").value.length} / 256`;
    };
    form.querySelector("#m-nom").addEventListener("input", majCompteur);
    form.querySelector("#m-desc").addEventListener("input", majCompteur);
    form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
    form.querySelector("#m-ok").onclick = () => {
      try {
        const r = BD.creerInstance(form.querySelector("#m-nom").value, form.querySelector("#m-desc").value);
        if (!r.ok) { form.querySelector("#m-err").textContent = r.erreur; return; }
        form.closest(".modal-fond").remove(); rafraichir();
      } catch (err) {
        form.querySelector("#m-err").textContent = "Erreur inattendue : " + err.message;
        afficherErreur(err.message + " (création d'instance)");
      }
    };
  };

  const liste = racine.querySelector("#liste");
  if (!insts.length) {
    liste.appendChild(h(`<p class="info-txt" style="text-align:center;padding:40px;">Aucune instance. Créez-en une pour commencer !</p>`));
  }
  insts.forEach(inst => {
    const d = BD.donneesInstance(inst.id);
    const carte = h(`<div class="carte">
      <div><b>${esc(inst.nom)}</b><div class="info-txt">${esc(inst.desc)}</div></div>
      <span class="inline-flex">
        <span class="etiquette">${d.reseaux.length} réseaux</span>
        <span class="etiquette">${d.contrats.length} contrats</span>
        <span class="etiquette">${d.lignes.length} lignes</span>
      </span>
      <span class="inline-flex"></span>
    </div>`);
    // lastElementChild = dernier ÉLÉMENT uniquement (lastChild peut renvoyer un
    // nœud texte invisible — espace avant </div> — qui ne peut pas
    // recevoir de bouton : c'était le bug du bandeau rouge).
    const act = carte.lastElementChild;
    const bOuvrir = h(`<button class="b-bleu">Ouvrir</button>`);
    bOuvrir.onclick = () => { App.instanceOuverte = inst; App.vue = "lignes"; App.colonnes = null; rafraichir(); };
    const bDupl = h(`<button class="b-vert">Dupliquer</button>`);
    // Dupliquer : mêmes limites de sécurité que la création.
    bDupl.onclick = () => {
      const form = h(`<div>
        <h2>Dupliquer « ${esc(inst.nom)} »</h2>
        <p class="info-txt">La copie reprendra toutes les données. Ajustez le nom et la description.</p>
        <div class="champ"><label>Nom</label><input id="m-nom" maxlength="32" value="${esc(inst.nom.slice(0, LIMITES.nomInstance - 8))} (copie)" /></div>
        <div class="champ"><label>Description</label><textarea id="m-desc" rows="2" maxlength="256">${esc(inst.desc)}</textarea></div>
        <div class="erreur" id="m-err"></div>
        <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-vert">Dupliquer</button></div>
      </div>`);
      modal(form);
      form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
      form.querySelector("#m-ok").onclick = () => {
        const r = BD.dupliquerInstance(inst.id, form.querySelector("#m-nom").value, form.querySelector("#m-desc").value);
        if (!r.ok) { alert(r.erreur); return; }
        form.closest(".modal-fond").remove(); rafraichir();
      };
    };
    const bMod = h(`<button>Modifier</button>`);

      // Modifier : mêmes garde-fous que la création (limites + compteurs).
      const form = h(`<div>
        <h2>Modifier l'instance</h2>

          <input id="m-nom" maxlength="32" value="${esc(inst.nom)}"/><div class="info-txt" id="cpt-nom"></div></div>
        <div class="champ"><label>Description (256 caractères max.)</label>
          <textarea id="m-desc" rows="2" maxlength="256">${esc(inst.desc)}</textarea><div class="info-txt" id="cpt-desc"></div></div>
        <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-bleu">Enregistrer</button></div>
      </div>`);
      modal(form);
      const majCompteur = () => {
        form.querySelector("#cpt-nom").textContent = `${form.querySelector("#m-nom").value.length} / 32`;
        form.querySelector("#cpt-desc").textContent = `${form.querySelector("#m-desc").value.length} / 256`;
      };
      form.querySelector("#m-nom").addEventListener("input", majCompteur);
      form.querySelector("#m-desc").addEventListener("input", majCompteur);
      majCompteur();
      form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
      form.querySelector("#m-ok").onclick = () => {
        const r = BD.modifierInstance(inst.id, form.querySelector("#m-nom").value, form.querySelector("#m-desc").value);
        if (!r.ok) { alert(r.erreur); return; }
        form.closest(".modal-fond").remove(); rafraichir();
      };
    };
    act.appendChild(bOuvrir); act.appendChild(bDupl); act.appendChild(bMod);
    act.appendChild(boutonSupprimer("Supprimer", () => { BD.supprimerInstance(inst.id); rafraichir(); }));
    // Gestion des droits : réservée à l'admin ou au propriétaire de l'instance.
    if (u.admin || inst.proprio === u.id) {

/* Fenêtre de gestion des droits (V1 : affectation simple de membres). */
function modalDroits(inst) {
  const e = BD.lire();
  const form = h(`<div>
    <h2>Droits — ${esc(inst.nom)}</h2>
    <p class="info-txt">Affectez des utilisateurs à cette instance. Les rôles détaillés viendront dans une version ultérieure.</p>

    membresBox.innerHTML = "";
    e.utilisateurs.filter(x => inst.membres.includes(x.id) || x.id === inst.proprio).forEach(m => {
      const role = m.id === inst.proprio ? "propriétaire" : "membre";

      if (m.id !== inst.proprio) {

    if (ev.target.value) { BD.affecterMembre(inst.id, ev.target.value); dessinerMembres(); }
  };
  form.querySelector("#m-fermer").onclick = () => form.closest(".modal-fond").remove();
  dessinerMembres();
  modal(form);

/* ---------- Espace de travail (instance ouverte) ---------- */

  </div>`);
  racine.querySelector("#retour").onclick = () => { App.instanceOuverte = null; App.colonnes = null; rafraichir(); };
  const onglets = racine.querySelector("#onglets");
  // Badge ⚠ sur l'onglet catalogue : valeurs à paramétrer (créées par un
  // import en masse ou saisies sans code d'export).
  const dOng = BD.donneesInstance(App.instanceOuverte.id);
  const nbAP = Object.values(dOng.catalogue).reduce((n, cat) =>
    n + cat.labels.filter(l => l.origine === "local" && !(l.codes.export || "").trim()).length, 0);
  [["lignes", "🚏 Toutes les lignes"], ["vue", "🚌 Réseaux & contrats"],
   ["catalogue", "🏷️ Catalogue de l'instance" + (nbAP ? ` <span class="etiquette" style="background:#fef3c7;border-color:#f59e0b;color:#92400e;">⚠ ${nbAP}</span>` : "")]].forEach(([cle, label]) => {
    const b = h(`<button class="onglet ${App.vue === cle ? "actif" : ""}">${label}</button>`);
    b.onclick = () => { App.vue = cle; rafraichir(); };
    onglets.appendChild(b);
  });
  const contenu = racine.querySelector("#contenu");
  if (App.vue === "lignes") contenu.appendChild(vueLignes());
  if (App.vue === "vue") contenu.appendChild(vueReseauxContrats());
  if (App.vue === "catalogue") contenu.appendChild(vueCatalogue());
  return racine;
}

/* ---------- Vue : toutes les lignes (tableau paramétrable) ---------- */
/* Les colonnes calculées ("auto") ne stockent rien : leur valeur est
   dérivée à la volée. Les préférences de colonnes sont mémorisées par instance. */
/* Colonnes de base du tableau des lignes.
   - "id" est FIXE : toujours affichée, non décochable (identifiant unique
     calculé par l'instance, servira de clé aux exports GTFS/NeTEx).
   - Les colonnes calculées définies par l'utilisateur (onglet dédié du
     catalogue) s'ajoutent dynamiquement : voir colonnesDisponibles(). */
const COLONNES = [
  { cle: "id", label: "ID unique", fixe: true },
  { cle: "abrev", label: "Abrév." },
  { cle: "nom", label: "Nom commercial" },
  { cle: "reseau", label: "Réseau", join: "reseauId", src: "reseaux" },
  { cle: "contrat", label: "Contrat", join: "contratId", src: "contrats" },
  { cle: "activite", label: "Activité" },
  { cle: "mode", label: "Mode" },
  { cle: "groupe", label: "Groupe" },
  { cle: "nbVehicules", label: "Nb véhicules", calc: l => l.vehicules.length },
  { cle: "nbEnergies", label: "Nb énergies", calc: l => l.energies.length },
  { cle: "nbFonctions", label: "Nb fonctions", calc: l => l.fonctions.length },
];
/* Toutes les colonnes disponibles = base + colonnes calculées utilisateur
   (un compteur : nombre d'éléments d'une liste rattachée à la ligne). */
function colonnesDisponibles() {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const calcU = (d.colonnesCalculees || []).map(c => ({
    cle: "u:" + c.nom, label: c.nom, calc: l => Noyau.valeurColCalculee(l, c), utilisateur: true
  }));
  return [...COLONNES, ...calcU];
}
function colonnesAffichees() {
  const pref = localStorage.getItem("hastus_colonnes_" + App.instanceOuverte.id);
  return pref ? JSON.parse(pref) : ["abrev", "nom", "reseau", "contrat", "activite", "mode", "groupe", "nbVehicules"];
}
function valColonne(d, col, l) {
  if (col.calc) return col.calc(l);
  if (col.join) { const o = d[col.src].find(x => x.id === l[col.join]); return o ? o.nom : "—"; }
  return l[col.cle] || "";
}

function vueLignes() {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  if (!App.colonnes) App.colonnes = colonnesAffichees();
  const dispo = colonnesDisponibles();
  // Ordre d'affichage = ordre choisi par l'utilisateur (menu ⚙ Colonnes),
  // ID unique fixe en tête, et colonne Actions positionnable début/fin.
  const act = { cle: "__actions", label: "Actions" };
  const cles = App.actionsDebut
    ? ["__actions", "id", ...App.colonnes]
    : ["id", ...App.colonnes, "__actions"];
  const cols = cles.map(cle => cle === "__actions" ? act : dispo.find(c => c.cle === cle)).filter(Boolean);
  const lignesAffichees = trierEtFiltrer(d, dispo);

  const racine = h(`<div style="width:90%;margin:0 auto;">
    <div class="inline-flex" style="justify-content:space-between;width:100%;margin-bottom:10px;">
      <span class="info-txt">Toutes les lignes de cette instance — double-clic pour modifier.</span>
      <span class="inline-flex">
        <span class="menu-col"><button id="b-col">⚙ Colonnes</button></span>
        <button id="b-copy">📋 Copier (Excel)</button>
        <button id="b-masse">📥 Importer</button>
      </span>
    </div>
    <div style="margin-bottom:10px;"><button id="b-nouv" class="b-bleu">+ Créer une ligne</button></div>
    <div class="enveloppe-table"><table>
      <thead><tr id="entetes"></tr></thead>
      <tbody id="corps"></tbody>
    </table></div>
    <p class="info-txt" id="compte" style="margin-top:8px;"></p>
  </div>`);

  /* Entêtes de colonnes (demandes de Jules) :
     - clic sur le titre : tri croissant → décroissant → retiré (cumulatif,
       l'ordre de tri suit l'ordre des clics) ;
     - bouton 🔎 : pop-up de filtre CENTRÉE dans la vue (champ toujours
       visible), avec choix de l'opérateur + OK / Annuler / Retirer ;
     - badge « filtré ✕ » : un clic retire le filtre. */
  const entetes = racine.querySelector("#entetes");
  cols.forEach(col => {
    const th = document.createElement("th");
    th.style.position = "relative";
    if (col.cle === "__actions") {
      th.innerHTML = "Actions";
      th.style.textAlign = "right";
      entetes.appendChild(th);
      return;
    }
    const tri = App.tris.find(t => t.cle === col.cle);
    th.innerHTML = `<span style="cursor:pointer;">${esc(col.label)}${col.calc ? ' <span class="etiquette">auto</span>' : ""}${tri ? (tri.asc ? " ▲" : " ▼") : ""}</span>${App.filtres[col.cle] ? ' <span class="etiquette f-badge" style="background:#fef9c3;cursor:pointer;" title="Cliquer pour retirer ce filtre">filtré ✕</span>' : ""} <button class="ico" title="Filtrer sur cette colonne">🔎</button>`;
    th.querySelector("span").onclick = () => {
      const t = App.tris.find(x => x.cle === col.cle);
      if (!t) App.tris.push({ cle: col.cle, asc: true });      // 1er clic : croissant
      else if (t.asc) t.asc = false;                            // 2e : décroissant
      else App.tris = App.tris.filter(x => x.cle !== col.cle); // 3e : retiré
      rafraichir();
    };
    // Badge « filtré ✕ » : retire le filtre en UN clic.
    const badge = th.querySelector(".f-badge");
    if (badge) badge.onclick = (e) => { e.stopPropagation(); delete App.filtres[col.cle]; rafraichir(); };
    th.querySelector(".ico").onclick = (e) => {
      e.stopPropagation();
      // Le filtre s'ouvre dans une POP-UP CENTRÉE (pas d'ancre sous l'entête :
      // le champ était masqué par le tableau — demande de Jules). Police
      // réduite pour limiter les problèmes d'affichage.
      const f = App.filtres[col.cle] || { op: "contient", txt: "" };
      const box = h(`<div style="max-width:380px;">
        <h2 style="font-size:16px;">🔎 Filtre — ${esc(col.label)}</h2>
        <div class="champ"><label style="font-size:12px;">Opérateur</label>
          <select id="f-op" style="font-size:12px;">${FILTRES_OPS.map(o => `<option value="${o}" ${f.op === o ? "selected" : ""}>${o}</option>`).join("")}</select></div>
        <div class="champ"><label style="font-size:12px;">Valeur</label>
          <input id="f-txt" value="${esc(f.txt)}" placeholder="texte…" style="font-size:12px;"/></div>
        <div class="ligne-boutons">
          <button id="f-del" style="font-size:12px;">✕ Retirer le filtre</button>
          <button id="f-ann" style="font-size:12px;">Annuler</button>
          <button id="f-ok" class="b-bleu" style="font-size:12px;">OK</button>
        </div></div>`);
      modal(box);
      const tOp = box.querySelector("#f-op"), tTxt = box.querySelector("#f-txt");
      tOp.onchange = () => { tTxt.disabled = tOp.value === "est vide" || tOp.value === "n'est pas vide"; };
      tOp.onchange();
      tTxt.focus();
      const fermer = () => box.closest(".modal-fond").remove();
      const ok = () => {
        const op = tOp.value, v = tTxt.value.trim();
        if (op === "est vide" || op === "n'est pas vide") App.filtres[col.cle] = { op, txt: "" };
        else if (v) App.filtres[col.cle] = { op, txt: v };
        else delete App.filtres[col.cle];
        fermer(); rafraichir();
      };
      box.querySelector("#f-ok").onclick = ok;
      tTxt.onkeydown = (e) => { if (e.key === "Enter") ok(); };
      box.querySelector("#f-ann").onclick = fermer;
      box.querySelector("#f-del").onclick = () => { delete App.filtres[col.cle]; fermer(); rafraichir(); };
    };
    entetes.appendChild(th);
  });

  /* Lignes du tableau : double-clic = modification (sélection multiple
     retirée à la demande de Jules : elle ne servait à rien). */
  const corps = racine.querySelector("#corps");
  const iAct = cols.findIndex(c => c.cle === "__actions");
  lignesAffichees.forEach(l => {
    const tr = document.createElement("tr");
    tr.dataset.id = l.id;
    tr.innerHTML = cols.map(col => col.cle === "__actions"
      ? `<td style="text-align:right;"></td>`
      : `<td>${esc(valColonne(d, col, l))}</td>`).join("");
    // Colonne Actions : deux icônes. La suppression garde sa double
    // confirmation (1er clic arme 3 s, 2e supprime).
    const actions = tr.children[iAct];
    const bMod = h(`<button class="ico" title="Modifier">✎</button>`);
    bMod.onclick = () => modalLigne(l.id);
    actions.appendChild(bMod);
    actions.appendChild(boutonSupprimer("🗑", () => {
      d.lignes = d.lignes.filter(x => x.id !== l.id);
      BD.sauver(); rafraichir();
    }));
    tr.ondblclick = (e) => {
      if (e.target.closest("button")) return;
      modalLigne(l.id);
    };
    corps.appendChild(tr);
  });
  racine.querySelector("#compte").textContent =
    `${lignesAffichees.length} ligne(s) affichée(s) sur ${d.lignes.length}` +
    (Object.keys(App.filtres).length || App.tris.length
      ? ` — ${Object.keys(App.filtres).length} filtre(s), ${App.tris.length} tri(s) actifs` : "");

  // Menu ⚙ Colonnes : mise en page UNIFORME (grille : case | nom | flèches),
  // panneau persistant jusqu'à « Appliquer », réordonnancement ↑ ↓, et
  // position de la colonne Actions (début ou fin de tableau uniquement).
  const bCol = racine.querySelector("#b-col");
  bCol.onclick = () => {
    const ancien = racine.querySelector(".panneau");
    if (ancien) { ancien.remove(); return; }
    let travail = [...App.colonnes];
    dispo.forEach(c => { if (!c.fixe && c.cle !== "__actions" && !travail.includes(c.cle)) travail.push(c.cle); });
    const cochees = new Set(App.colonnes);
    const pan = h(`<div class="panneau" style="width:340px;">
      <b style="font-size:13px;">Colonnes affichées</b>
      <p class="info-txt" style="margin:2px 0 6px;">↑ ↓ réordonner · cocher/décocher · « Appliquer » enregistre.</p>
      <div id="p-liste" style="max-height:300px;overflow-y:auto;"></div>
      <div style="margin-top:6px;border-top:1px solid #e2e8f0;padding-top:6px;">
        <button id="p-actions" style="width:100%;font-size:12px;"></button>
      </div>
      <div class="ligne-boutons" style="margin:6px 0 0;">
        <button id="p-ann">✕ Fermer</button>
        <button id="p-ok" class="b-bleu">Appliquer</button>
      </div>
    </div>`);
    const majTxtActions = () => {
      pan.querySelector("#p-actions").textContent =
        `Colonne Actions : ${App.actionsDebut ? "au début" : "à la fin"} du tableau — cliquer pour changer`;
    };
    majTxtActions();
    const dessiner = () => {
      const box = pan.querySelector("#p-liste");
      box.innerHTML = "";
      travail.forEach((cle, i) => {
        const col = dispo.find(c => c.cle === cle);
        const l = h(`<label class="p-ligne">
          <input type="checkbox" ${cochees.has(cle) || col.fixe ? "checked" : ""} ${col.fixe ? "disabled" : ""}/>
          <span>${esc(col.label)}${col.fixe ? ' <span class="etiquette">fixe</span>' : ""}</span>
          <button title="Monter" ${i === 0 ? "disabled" : ""}>↑</button>
          <button title="Descendre" ${i === travail.length - 1 ? "disabled" : ""}>↓</button>
        </label>`);
        const cb = l.querySelector("input");
        cb.onchange = () => cb.checked ? cochees.add(cle) : cochees.delete(cle);
        const [haut, bas] = l.querySelectorAll("button");
        haut.onclick = () => { travail.splice(i, 1); travail.splice(i - 1, 0, cle); dessiner(); };
        bas.onclick = () => { travail.splice(i, 1); travail.splice(i + 1, 0, cle); dessiner(); };
        box.appendChild(l);
      });
    };
    dessiner();
    pan.querySelector("#p-actions").onclick = () => {
      // La colonne Actions ne se place qu'en début ou en fin de tableau.
      App.actionsDebut = !App.actionsDebut;
      majTxtActions();
    };
    pan.querySelector("#p-ann").onclick = () => pan.remove();
    pan.querySelector("#p-ok").onclick = () => {
      App.colonnes = travail.filter(cle => cochees.has(cle));
      localStorage.setItem("hastus_colonnes_" + App.instanceOuverte.id, JSON.stringify(App.colonnes));
      rafraichir();
    };
    bCol.parentElement.appendChild(pan);
  };

  // Copier vers Excel (demande de Jules) : TOUTES les colonnes brutes sont
  // copiées (même non affichées) ; les colonnes OBLIGATOIRES portent une *
  // dans leur nom ; après la copie, une fenêtre rappelle lesquelles.
  racine.querySelector("#b-copy").onclick = () => {
    copierExcelVersPressePapiers(d);
    const oblig = COLONNES_MASSE.filter(c => c.oblig).map(c => c.label).join(", ");
    const info = h(`<div>
      <h2>📋 Copié pour Excel</h2>
      <p class="info-txt">Le tableau complet (toutes les colonnes) est dans le presse-papiers : collez-le dans Excel avec Ctrl+V.</p>
      <p class="info-txt">Les colonnes dont le nom porte une <b>*</b> — <b>${esc(oblig)}</b> — sont <b>obligatoires</b> :
      à l'import, une valeur manquante est refusée, et une valeur inconnue est créée automatiquement (badge ⚠ dans le catalogue).</p>
      <div class="ligne-boutons"><button id="b-ok" class="b-bleu">Fermer</button></div>
    </div>`);
    info.querySelector("#b-ok").onclick = () => info.closest(".modal-fond").remove();
    modal(info);
  };

  // Importer : fichier du PC (CSV/texte) ou collage, avec prévisualisation.
  racine.querySelector("#b-masse").onclick = () => modalImporter();

  racine.querySelector("#b-nouv").onclick = () => modalLigne(null);
  return racine;
}

/* Opérateurs disponibles pour le filtre d'une colonne (bulle 🔎). */
const FILTRES_OPS = ["contient", "ne contient pas", "est égal à", "est différent de", "commence par", "finit par", "est vide", "n'est pas vide"];

/* Colonnes de l'import/export Excel (● = obligatoire). Sert aussi au
   « Copier (Excel) » : tout est copié, * sur les obligatoires. */
const COLONNES_MASSE = [
  { cle: "abrev", label: "Abrév.", oblig: true },
  { cle: "nom", label: "Nom commercial", oblig: true },
  { cle: "reseau", label: "Réseau", oblig: true },
  { cle: "contrat", label: "Contrat" },
  { cle: "activite", label: "Activité", oblig: true },
  { cle: "mode", label: "Mode", oblig: true },
  { cle: "groupe", label: "Groupe" }
];
function valMasse(d, l, cle) {
  if (cle === "reseau") { const r = d.reseaux.find(x => x.id === l.reseauId); return r ? r.nom : ""; }
  if (cle === "contrat") { const c = d.contrats.find(x => x.id === l.contratId); return c ? c.nom : ""; }
  return l[cle] || "";
}

/* Trie et filtre les lignes selon l'état d'affichage. Cumulatif :
   - filtres en ET (un par colonne, opérateur au choix, sans casse) ;
   - tris enchaînés dans l'ordre des clics (1re colonne cliquée dominante). */
function trierEtFiltrer(d, dispo) {
  let liste = [...d.lignes];
  Object.entries(App.filtres).forEach(([cle, f]) => {
    const col = dispo.find(c => c.cle === cle);
    if (!col || !f) return;
    const evalue = (v) => {
      const t = String(f.txt).toLowerCase();
      switch (f.op) {
        case "ne contient pas":  return !v.includes(t);
        case "est égal à":       return v === t;
        case "est différent de": return v !== t;
        case "commence par":     return v.startsWith(t);
        case "finit par":        return v.endsWith(t);
        case "est vide":         return !v;
        case "n'est pas vide":   return !!v;
        default:                 return v.includes(t);   // « contient »
      }
    };
    liste = liste.filter(l => evalue(String(valColonne(d, col, l)).toLowerCase()));
  });
  const cmp = (a, b) => {
    for (const t of App.tris) {
      const col = dispo.find(c => c.cle === t.cle);
      if (!col) continue;
      const r = String(valColonne(d, col, a)).localeCompare(String(valColonne(d, col, b)), "fr", { numeric: true });
      if (r !== 0) return t.asc ? r : -r;
    }
    return 0;
  };
  return liste.sort(cmp);
}

/* TSV complet (toutes les colonnes brutes), * sur les obligatoires.
   Utilisé par « Copier (Excel) » et par la fenêtre d'import. */
function copierExcelVersPressePapiers(d) {
  const tsv = COLONNES_MASSE.map(c => c.label + (c.oblig ? "*" : "")).join("\t") + "\n" +
    d.lignes.map(l => COLONNES_MASSE.map(c => valMasse(d, l, c.cle)).join("\t")).join("\n");
  navigator.clipboard?.writeText(tsv);
  return tsv;
}

/* ---------- Importer : fichier du PC ou collage (demande de Jules) ----------
   Fenêtre large : lecture d'un fichier CSV/texte exporté d'Excel (les .xlsx
   sont binaires : on demande un enregistrement en CSV), ou collage direct,
   puis PRÉVISUALISATION du résultat avant import :
   - vert = création, orange = cellule modifiée, rouge = suspect (même nom
     commercial qu'une ligne existante), gris = ligne ignorée ;
   - à la validation : compte des créations/modifications + valeurs inconnues
     créées automatiquement (badge ⚠ dans le catalogue) ;
   - les suspects demandent une confirmation explicite. */
function modalImporter() {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const form = h(`<div style="min-width:900px;max-width:95vw;">
    <h2>Importer des lignes</h2>
    <p class="info-txt">Colonnes : <b>${COLONNES_MASSE.map(c => c.label + (c.oblig ? "*" : "")).join(" — ")}</b> (* = obligatoire).
      L'abréviation est la clé : existante → mise à jour, nouvelle → création.</p>
    <div class="champ"><label>📂 Fichier du PC (CSV ou texte exporté d'Excel)</label>
      <input type="file" id="m-fichier" accept=".csv,.txt,.tsv"/></div>
    <div class="champ"><label>…ou collez les lignes ici (depuis Excel : Ctrl+C puis Ctrl+V)</label>
      <textarea id="m-texte" rows="4" placeholder="Abrév&#9;Nom&#9;…"></textarea></div>
    <div class="inline-flex" style="justify-content:space-between;width:100%;">
      <button id="m-export">📋 Exporter les lignes actuelles vers Excel</button>
      <span class="ligne-boutons" style="margin:0;"><button id="m-ann">Annuler</button>
      <button id="m-prev" class="b-bleu">Prévisualiser l'import</button></span>
    </div>
  </div>`);
  form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
  form.querySelector("#m-export").onclick = () => {
    copierExcelVersPressePapiers(d);
    alert("Lignes actuelles copiées ! Collez-les dans Excel (Ctrl+V).");
  };
  form.querySelector("#m-prev").onclick = () => {
    const fichier = form.querySelector("#m-fichier").files[0];
    if (fichier) {
      if (/\.(xlsx|xls)$/i.test(fichier.name)) {
        alert("Le format .xlsx est un fichier binaire : dans Excel, faites « Fichier → Enregistrer sous → CSV (séparateur point-virgule) », puis réessayez.");
        return;
      }
      const lecteur = new FileReader();
      lecteur.onload = () => preparer(String(lecteur.result));
      lecteur.readAsText(fichier);
    } else {
      const texte = form.querySelector("#m-texte").value;
      if (!texte.trim()) { alert("Choisissez un fichier ou collez des lignes."); return; }
      preparer(texte);
    }
  };
  // Analyse sur une COPIE des données : rien n'est modifié avant l'import
  // confirmé. La prévisualisation s'appuie sur cette même copie.
  function preparer(texte) {
    const plan = Noyau.appliquerColle(JSON.parse(JSON.stringify(d)), texte);
    modalApercu(texte, plan);
  }
  modal(form, true);
}

/* Prévisualisation de l'import : le tableau complet en largeur, chaque
   ligne colorée selon son devenir. Import réel identique au plan analysé. */
function modalApercu(texte, plan) {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const lignesFichier = texte.trim().split(/\r?\n/).filter(r => r.trim());
  const form = h(`<div style="min-width:900px;max-width:95vw;">
    <h2>Prévisualisation de l'import</h2>
    <p class="info-txt"><b>Légende :</b>
      <span class="etiquette" style="background:#dcfce7;border-color:#86efac;color:#166534;">création</span>
      <span class="etiquette" style="background:#ffedd5;border-color:#fdba74;color:#9a3412;">cellule modifiée</span>
      <span class="etiquette" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">suspect : nom déjà utilisé</span>
      <span class="etiquette" style="background:#f1f5f9;color:#64748b;">ignorée</span></p>
    <div class="enveloppe-table" style="max-height:320px;overflow-y:auto;"><table>
      <thead><tr>${COLONNES_MASSE.map(c => `<th class="${c.oblig ? "th-oblig" : ""}">${c.label}${c.oblig ? " ●" : ""}</th>`).join("")}<th>Statut</th></tr></thead>
      <tbody id="a-corps"></tbody>
    </table></div>
    <p class="info-txt" id="a-resume"></p>
    <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-vert">Importer</button></div>
  </div>`);
  const corps = form.querySelector("#a-corps");
  lignesFichier.forEach((row, idx) => {
    const c = row.split(/\t|;/);
    if (idx === 0 && /^abr/i.test((c[0] || "").trim())) return;
    const tr = document.createElement("tr");
    const abrev = (c[0] || "").trim();
    if (!abrev) {
      tr.innerHTML = `<td colspan="${COLONNES_MASSE.length}" style="color:#64748b;">${esc(row)}</td><td><span class="etiquette" style="background:#f1f5f9;color:#64748b;">ignorée</span></td>`;
      corps.appendChild(tr);
      return;
    }
    const existante = d.lignes.find(l => l.abrev.toLowerCase() === abrev.toLowerCase());
    const suspecte = !existante && plan.suspects.some(s => s.abrev === abrev);
    let statut, cls;
    if (existante) { statut = "modification"; cls = "background:#ffedd5;border-color:#fdba74;color:#9a3412;"; }
    else if (suspecte) { statut = "⚠ suspect : nom déjà utilisé"; cls = "background:#fef2f2;border-color:#fca5a5;color:#991b1b;"; }
    else { statut = "création"; cls = "background:#dcfce7;border-color:#86efac;color:#166534;"; }
    // Cellules : orange si la valeur diffère de la ligne existante.
    tr.innerHTML = COLONNES_MASSE.map((col, i) => {
      const nouvelle = (c[i] || "").trim();
      const actuelle = existante ? valMasse(d, existante, col.cle) : "";
      const modifiee = existante && nouvelle && nouvelle !== actuelle;
      return `<td class="${modifiee ? "cell-loc" : ""}">${esc(nouvelle)}</td>`;
    }).join("") + `<td><span class="etiquette" style="${cls}">${statut}</span></td>`;
    corps.appendChild(tr);
  });
  const nv = Object.entries(plan.nouvellesValeurs || {});
  form.querySelector("#a-resume").innerHTML =
    `<b>${plan.crees}</b> création(s), <b>${plan.maj}</b> modification(s), ${plan.ignorees} ignorée(s).` +
    (nv.length ? ` Valeurs inconnues qui seront créées : ${nv.map(([k, vs]) => `<b>${esc(k)}</b> → ${vs.map(esc).join(", ")}`).join(" ; ")} (badge ⚠ dans le catalogue).` : "") +
    (plan.suspects.length ? ` <b>⚠ ${plan.suspects.length} suspect(s)</b> : ${plan.suspects.map(s => esc(s.abrev)).join(", ")}.` : "");
  let confirme = false;
  form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
  form.querySelector("#m-ok").onclick = () => {
    if (plan.suspects.length && !confirme) {
      confirme = true;
      form.querySelector("#m-ok").textContent = "Confirmer malgré les suspects";
      form.querySelector("#a-resume").innerHTML += " Relancez le bouton pour importer quand même.";
      return;
    }
    const res = Noyau.appliquerColle(d, texte);
    BD.sauver();
    form.closest(".modal-fond").remove(); rafraichir();
    alert(`Import terminé : ${res.crees} création(s), ${res.maj} modification(s), ${res.ignorees} ignorée(s).` +
      (Object.keys(res.nouvellesValeurs).length
        ? ` Nouvelles valeurs à paramétrer : ${Object.entries(res.nouvellesValeurs).map(([k, vs]) => `${k} (${vs.join(", ")})`).join(" ; ")}.`
        : ""));
  };
  modal(form, true);
}

/* Formulaire d'une ligne (création ou modification) avec validation métier. */
function modalLigne(idLigne) {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const existante = idLigne ? d.lignes.find(l => l.id === idLigne) : null;
  const init = existante || { abrev: "", nom: "", reseauId: "", contratId: null, activite: "", mode: "", groupe: "", vehicules: [], energies: [], fonctions: [] };
  const cat = d.catalogue;
  // Générateur de blocs à choix multiples (véhicules / énergies / fonctions).
  const casesMultiples = (titre, catCle, prop) => `<div class="champ"><label>${titre} (plusieurs)</label>
    <div class="inline-flex">${cat[catCle].labels.map(x =>
      `<label class="libelle"><input type="checkbox" data-grp="${prop}" value="${esc(x.nom)}" ${init[prop].includes(x.nom) ? "checked" : ""}/> ${esc(x.nom)}</label>`).join("")}</div></div>`;
  // Icône ℹ️ : au survol, la bulle indique quels champs sont publics
  // (visibles dans les exports) et lesquels sont privés transporteur.
  const aidePubPrive = `Champs PUBLICS (visibles dans les exports) : Abréviation, Nom commercial, Réseau, Activité, Mode de transport, Groupe, types de véhicule, énergies, fonctions embarquées. Champ PRIVÉ transporteur : Contrat.`;
  const form = h(`<div>
    <h2>${existante ? "Modifier" : "Créer"} une ligne <span class="aide-info" data-info="${esc(aidePubPrive)}">ℹ️</span></h2>
    <div class="grille">
      <div class="champ"><label>Abréviation (8 car. max)</label><input id="m-abrev" maxlength="8" value="${esc(init.abrev)}"/></div>
      <div class="champ"><label>Nom commercial (64 car. max)</label><input id="m-nom" maxlength="64" value="${esc(init.nom)}"/></div>
      <div class="champ"><label>Réseau</label><select id="m-reseau"><option value="">— Choisir —</option>
        ${d.reseaux.map(r => `<option value="${r.id}" ${init.reseauId === r.id ? "selected" : ""}>${esc(r.nom)}</option>`).join("")}</select></div>
      <div class="champ"><label>Contrat</label><select id="m-contrat"><option value="">— Aucun —</option>
        ${d.contrats.map(c => `<option value="${c.id}" ${init.contratId === c.id ? "selected" : ""}>${esc(c.nom)}</option>`).join("")}</select></div>
      <div class="champ"><label>Activité (1 seule)</label>
        <select id="m-act"><option value="">— Choisir —</option>
        ${cat["Activités"].labels.map(a => `<option ${init.activite === a.nom ? "selected" : ""}>${esc(a.nom)}</option>`).join("")}</select></div>
      <div class="champ"><label>Mode de transport (1 seul)</label>
        <select id="m-mode"><option value="">— Choisir —</option>
        ${cat["Modes de transport"].labels.map(m => `<option ${init.mode === m.nom ? "selected" : ""}>${esc(m.nom)}</option>`).join("")}</select></div>
      <div class="champ"><label>Groupe</label>
        <select id="m-groupe"><option value="">— Aucun —</option>
        ${cat["Groupes de lignes"].labels.map(g => `<option ${init.groupe === g.nom ? "selected" : ""}>${esc(g.nom)}</option>`).join("")}</select></div>
    </div>
    ${casesMultiples("Types de véhicule", "Types de véhicule", "vehicules")}
    ${casesMultiples("Types d'énergie", "Types d'énergie", "energies")}
    ${casesMultiples("Fonctions embarquées", "Fonctions embarquées", "fonctions")}
    <div class="erreur" id="m-err"></div>
    <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-bleu">Enregistrer</button></div>
  </div>`);
  modal(form);
  form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
  form.querySelector("#m-ok").onclick = () => {
    const ligne = {
      ...(existante || {}),
      abrev: form.querySelector("#m-abrev").value,
      nom: form.querySelector("#m-nom").value,
      reseauId: form.querySelector("#m-reseau").value,
      contratId: form.querySelector("#m-contrat").value || null,
      activite: form.querySelector("#m-act").value,
      mode: form.querySelector("#m-mode").value,
      groupe: form.querySelector("#m-groupe").value,
      vehicules: Array.from(form.querySelectorAll('[data-grp="vehicules"]:checked')).map(x => x.value),
      energies: Array.from(form.querySelectorAll('[data-grp="energies"]:checked')).map(x => x.value),
      fonctions: Array.from(form.querySelectorAll('[data-grp="fonctions"]:checked')).map(x => x.value)
    };
    // Validation métier AVANT enregistrement (mêmes règles que les tests automatiques).
    const errs = Noyau.validerLigne(d, ligne, existante ? existante.id : null);
    if (errs.length) { form.querySelector("#m-err").innerHTML = errs.map(e => "• " + esc(e)).join("<br/>"); return; }
    if (existante) { Object.assign(existante, ligne); }
    else { ligne.id = Noyau.nouvelId(d); d.lignes.push(ligne); }
    BD.sauver(); form.closest(".modal-fond").remove(); rafraichir();
  };
}

/* ---------- Vue : réseaux & contrats ---------- */
function vueReseauxContrats() {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const racine = h(`<div style="width:90%;margin:0 auto;">
    <div class="inline-flex" style="gap:12px;margin-bottom:12px;">
      <span id="b-creer"></span>
      <span class="vue-switch" id="switch"></span>
    </div>
    <div id="liste"></div>
  </div>`);
  const sw = racine.querySelector("#switch");
  const bReseaux = h(`<button class="${App.vueObjet === "reseaux" ? "actif" : ""}">Tous les réseaux</button>`);
  bReseaux.onclick = () => { App.vueObjet = "reseaux"; rafraichir(); };
  const bContrats = h(`<button class="${App.vueObjet === "contrats" ? "actif" : ""}">Tous les contrats</button>`);
  bContrats.onclick = () => { App.vueObjet = "contrats"; rafraichir(); };
  sw.appendChild(bReseaux); sw.appendChild(bContrats);
  const bCreer = racine.querySelector("#b-creer");
  const liste = racine.querySelector("#liste");
  const nbLignes = (pred) => d.lignes.filter(pred).length;

  if (App.vueObjet === "reseaux") {
    const b = h(`<button class="b-bleu">+ Créer un réseau</button>`);
    b.onclick = () => modalReseau(null);
    bCreer.appendChild(b);
    if (!d.reseaux.length) liste.appendChild(h(`<p class="info-txt">Aucun réseau. Créez-en un : il sera disponible pour rattacher des lignes.</p>`));
    d.reseaux.forEach(r => {
      const carte = h(`<div class="carte">
        <div><b>${esc(r.nom)}</b>
          <div class="info-txt">Validité : ${esc(r.validiteDebut || "?")} → ${esc(r.validiteFin || "?")}</div></div>
        <span class="inline-flex">
          <span class="etiquette">${nbLignes(l => l.reseauId === r.id)} lignes</span>
          <span class="etiquette">${d.contrats.filter(c => (c.reseaux || []).includes(r.id)).length} contrats</span>
        </span>
        <span class="inline-flex"></span>
      </div>`);
      const act = carte.lastElementChild;
      const bM = h(`<button>Modifier</button>`); bM.onclick = () => modalReseau(r.id); act.appendChild(bM);
      // Règle métier (Jules) : un réseau utilisé par des lignes OU des
      // contrats ne peut pas être supprimé.
      act.appendChild(boutonSupprimer("Supprimer", () => {
        const u = Noyau.usagesReseau(d, r.id);
        if (u.lignes.length || u.contrats.length) {
          alert(`Impossible : réseau utilisé par ${u.lignes.length} ligne(s) et ${u.contrats.length} contrat(s). Utilisez 🔎 pour voir et nettoyer les utilisations.`);
          return;
        }
        d.reseaux = d.reseaux.filter(x => x.id !== r.id); BD.sauver(); rafraichir();
      }));
      const bUse = h(`<button title="Où est-il utilisé ?">🔎</button>`);
      bUse.onclick = () => modalUsages(r.nom, () => {
        const u = Noyau.usagesReseau(d, r.id);
        return [
          ...u.lignes.map(l => ({
            label: () => `Ligne <b>${esc(l.abrev)}</b> — ${esc(l.nom)}`,
            modifier: () => modalLigne(l.id),
            supprimer: () => { d.lignes = d.lignes.filter(x => x.id !== l.id); }
          })),
          ...u.contrats.map(c => ({
            label: () => `Contrat <b>${esc(c.nom)}</b>`,
            modifier: () => modalContrat(c.id),
            supprimer: () => { d.contrats = d.contrats.filter(x => x.id !== c.id); }
          }))
        ];
      });
      act.appendChild(bUse);
      liste.appendChild(carte);
    });
  } else {
    const b = h(`<button class="b-bleu">+ Créer un contrat</button>`);
    b.onclick = () => modalContrat(null);
    bCreer.appendChild(b);
    if (!d.contrats.length) liste.appendChild(h(`<p class="info-txt">Aucun contrat. Les contrats sont des objets privés transporteur.</p>`));
    d.contrats.forEach(c => {
      const carte = h(`<div class="carte">
        <div><b>${esc(c.nom)}</b>
          <div class="info-txt">Réseaux : ${d.reseaux.filter(r => (c.reseaux || []).includes(r.id)).map(r => esc(r.nom)).join(", ") || "—"}</div></div>
        <span class="inline-flex"><span class="etiquette">${nbLignes(l => l.contratId === c.id)} lignes</span></span>
        <span class="inline-flex"></span>
      </div>`);
      const act = carte.lastElementChild;
      const bM = h(`<button>Modifier</button>`); bM.onclick = () => modalContrat(c.id); act.appendChild(bM);
      // Règle métier (Jules) : un contrat utilisé par des lignes ne peut
      // pas être supprimé.
      act.appendChild(boutonSupprimer("Supprimer", () => {
        const u = Noyau.usagesContrat(d, c.id);
        if (u.lignes.length) { alert(`Impossible : contrat utilisé par ${u.lignes.length} ligne(s). Utilisez 🔎 pour voir et nettoyer les utilisations.`); return; }
        d.contrats = d.contrats.filter(x => x.id !== c.id); BD.sauver(); rafraichir();
      }));
      const bUse = h(`<button title="Où est-il utilisé ?">🔎</button>`);
      bUse.onclick = () => modalUsages(c.nom, () =>
        Noyau.usagesContrat(d, c.id).lignes.map(l => ({
          label: () => `Ligne <b>${esc(l.abrev)}</b> — ${esc(l.nom)}`,
          modifier: () => modalLigne(l.id),
          supprimer: () => { d.lignes = d.lignes.filter(x => x.id !== l.id); }
        })));
      act.appendChild(bUse);
      liste.appendChild(carte);
    });
  }
  return racine;
}

/* Formulaire réseau : nom + période de validité (bornée à 2099). */
function modalReseau(idReseau) {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const r = idReseau ? d.reseaux.find(x => x.id === idReseau) : null;
  const form = h(`<div>
    <h2>${r ? "Modifier" : "Créer"} un réseau</h2>
    <div class="champ"><label>Nom du réseau (32 car. max)</label><input id="m-nom" maxlength="32" value="${r ? esc(r.nom) : ""}"/></div>
    <div class="grille">
      <div class="champ"><label>Début de validité</label><input id="m-deb" type="date" value="${r ? esc(r.validiteDebut) : ""}"/></div>
      <div class="champ"><label>Fin de validité (jusqu'à 2099)</label><input id="m-fin" type="date" min="2020-01-01" max="2099-12-31" value="${r ? esc(r.validiteFin) : ""}"/></div>
    </div>
    <div class="erreur" id="m-err"></div>
    <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-bleu">Enregistrer</button></div>
  </div>`);
  modal(form);
  form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
  form.querySelector("#m-ok").onclick = () => {
    const nom = form.querySelector("#m-nom").value.trim();
    const deb = form.querySelector("#m-deb").value, fin = form.querySelector("#m-fin").value;
    if (!nom) { form.querySelector("#m-err").textContent = "Nom obligatoire."; return; }
    if (deb && fin && deb > fin) { form.querySelector("#m-err").textContent = "La fin de validité doit suivre le début."; return; }
    if (fin && fin > "2099-12-31") { form.querySelector("#m-err").textContent = "La validité ne peut dépasser 2099."; return; }
    // Règle d'unicité (Jules) : deux réseaux ne peuvent pas porter le même nom.
    if (Noyau.nomUtilise(d.reseaux, nom, r ? r.id : null)) { form.querySelector("#m-err").textContent = "Un réseau porte déjà ce nom (le nom est un code unique)."; return; }
    if (r) { r.nom = nom; r.validiteDebut = deb; r.validiteFin = fin; }
    else d.reseaux.push({ id: Noyau.nouvelId(d), nom, validiteDebut: deb, validiteFin: fin });
    BD.sauver(); form.closest(".modal-fond").remove(); rafraichir();
  };
}
