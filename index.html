  // Importer : fichier du PC (CSV/texte) ou collage, avec prévisualisation.
  racine.querySelector("#b-masse").onclick = () => modalImporter();

  racine.querySelector("#b-nouv").onclick = () => modalLigne(null);
  return racine;
}

/* Opérateurs disponibles pour le filtre d'une colonne (bulle 🔎). */
const FILTRES_OPS = ["contient", "ne contient pas", "est égal à", "est différent de", "commence par", "finit par", "est vide", "n'est pas vide"];

/* Colonnes de l'import/export Excel (● = obligatoire). Sert aussi au
   « Copier (Excel) » : tout est copié, * sur les obligatoires. */
const COLONNES_MASSE = [
  { cle: "abrev", label: "Abrév.", oblig: true },
  { cle: "nom", label: "Nom commercial", oblig: true },
  { cle: "reseau", label: "Réseau", oblig: true },
  { cle: "contrat", label: "Contrat" },
  { cle: "activite", label: "Activité", oblig: true },
  { cle: "mode", label: "Mode", oblig: true },
  { cle: "groupe", label: "Groupe" }
];
function valMasse(d, l, cle) {
  if (cle === "reseau") { const r = d.reseaux.find(x => x.id === l.reseauId); return r ? r.nom : ""; }
  if (cle === "contrat") { const c = d.contrats.find(x => x.id === l.contratId); return c ? c.nom : ""; }
  return l[cle] || "";
}

/* Trie et filtre les lignes selon l'état d'affichage. Cumulatif :
   - filtres en ET (un par colonne, opérateur au choix, sans casse) ;
   - tris enchaînés dans l'ordre des clics (1re colonne cliquée dominante).
   OPTIMISATION : chaque cellule est calculée UNE SEULE fois (mémoïsation)
   au lieu d'être recalculée à chaque filtre ET à chaque comparaison du tri
   (le tri appelle la comparaison n·log(n) fois : le gain est énorme sur
   les grandes tables). */
function trierEtFiltrer(d, dispo) {
  // Cache des jointures (réseau/contrat) : une Map par table au lieu d'un
  // find() parcourant tout le tableau pour CHAQUE cellule.
  const cache = {};
  dispo.forEach(col => {
    if (col.join) cache[col.src] = new Map(d[col.src].map(x => [x.id, x.nom]));
  });
  // Mémoïsation : id de ligne + clé de colonne → valeur déjà calculée.
  const memo = new Map();
  const cellule = (l, col) => {
    let m = memo.get(l.id);
    if (!m) { m = {}; memo.set(l.id, m); }
    let v = m[col.cle];
    if (v === undefined) { v = valColonne(d, col, l, cache); m[col.cle] = v; }
    return v;
  };
  // Filtres (en ET, sans casse).
  let liste = [...d.lignes];
  // Barre de filtres rapide (recherche + listes déroulantes) : appliquée
  // EN PLUS des filtres 🔎 de colonnes (toujours en ET).
  const b = App.barre || {};
  const nomsReseaux = cache.reseaux || new Map();
  if (b.q || (b.reseau && b.reseau !== "all") || (b.activite && b.activite !== "all") || (b.mode && b.mode !== "all") || (b.groupe && b.groupe !== "all")) {
    const q = String(b.q || "").trim().toLowerCase();
    liste = liste.filter(l => {
      if (b.reseau && b.reseau !== "all" && l.reseauId !== b.reseau) return false;
      if (b.activite && b.activite !== "all" && (l.activite || "") !== b.activite) return false;
      if (b.mode && b.mode !== "all" && (l.mode || "") !== b.mode) return false;
      if (b.groupe && b.groupe !== "all" && (l.groupe || "") !== b.groupe) return false;
      if (q) {
        const texte = `${l.abrev || ""} ${l.nom || ""} ${nomsReseaux.get(l.reseauId) || ""} ${l.activite || ""} ${l.mode || ""} ${l.groupe || ""}`.toLowerCase();
        if (!texte.includes(q)) return false;
      }
      return true;
    });
  }
  for (const [cle, f] of Object.entries(App.filtres)) {
    const col = dispo.find(c => c.cle === cle);
    if (!col || !f) continue;
    const t = String(f.txt).toLowerCase();
    const evalue = (v) => {
      switch (f.op) {
        case "ne contient pas":  return !v.includes(t);
        case "est égal à":       return v === t;
        case "est différent de": return v !== t;
        case "commence par":     return v.startsWith(t);
        case "finit par":        return v.endsWith(t);
        case "est vide":         return !v;
        case "n'est pas vide":   return !!v;
        default:                 return v.includes(t);   // « contient »
      }
    };
    liste = liste.filter(l => evalue(String(cellule(l, col)).toLowerCase()));
  }
  // Tris : colonnes de tri résolues UNE fois (pas à chaque comparaison),
  // puis tri par décorations : chaque cellule n'est lue qu'une fois.
  const tris = App.tris
    .map(t => ({ t, col: dispo.find(c => c.cle === t.cle) }))
    .filter(x => x.col);
  const cleTri = (l) => tris.map(({ col }) => String(cellule(l, col)).toLowerCase()).join("\u0000");
  const triCache = new Map();
  const ordre = (l) => { let k = triCache.get(l.id); if (k === undefined) { k = cleTri(l); triCache.set(l.id, k); } return k; };
  liste.sort((a, b) => {
    const ka = ordre(a), kb = ordre(b);
    if (ka === kb) return 0;
    // Comparaison champ par champ pour respecter l'ordre des clics.
    const va = ka.split("\u0000"), vb = kb.split("\u0000");
    for (let i = 0; i < va.length; i++) {
      const r = va[i].localeCompare(vb[i], "fr", { numeric: true });
      if (r !== 0) return tris[i].t.asc ? r : -r;
    }
    return 0;
  });
  return liste;
}

/* TSV complet (toutes les colonnes brutes), * sur les obligatoires.
   Utilisé par « Copier (Excel) » et par la fenêtre d'import. */
function copierExcelVersPressePapiers(d) {
  const tsv = COLONNES_MASSE.map(c => c.label + (c.oblig ? "*" : "")).join("\t") + "\n" +
    d.lignes.map(l => COLONNES_MASSE.map(c => valMasse(d, l, c.cle)).join("\t")).join("\n");
  navigator.clipboard?.writeText(tsv);
  return tsv;
}

/* ---------- Importer : fichier du PC ou collage (demande de Jules) ----------
   Fenêtre large : lecture d'un fichier CSV/texte exporté d'Excel (les .xlsx
   sont binaires : on demande un enregistrement en CSV), ou collage direct,
   puis PRÉVISUALISATION du résultat avant import :
   - vert = création, orange = cellule modifiée, rouge = suspect (même nom
     commercial qu'une ligne existante), gris = ligne ignorée ;
   - à la validation : compte des créations/modifications + valeurs inconnues
     créées automatiquement (badge ⚠ dans le catalogue) ;
   - les suspects demandent une confirmation explicite. */
function modalImporter() {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const form = h(`<div style="min-width:900px;max-width:95vw;">
    <h2>Importer des lignes</h2>
    <p class="info-txt">Colonnes : <b>${COLONNES_MASSE.map(c => c.label + (c.oblig ? "*" : "")).join(" — ")}</b> (* = obligatoire).
      L'abréviation est la clé : existante → mise à jour, nouvelle → création.</p>
    <div class="champ"><label>📂 Fichier du PC (CSV ou texte exporté d'Excel)</label>
      <input type="file" id="m-fichier" accept=".csv,.txt,.tsv"/></div>
    <div class="champ"><label>…ou collez les lignes ici (depuis Excel : Ctrl+C puis Ctrl+V)</label>
      <textarea id="m-texte" rows="4" placeholder="Abrév&#9;Nom&#9;…"></textarea></div>
    <div class="inline-flex" style="justify-content:space-between;width:100%;">
      <button id="m-export">📋 Exporter les lignes actuelles vers Excel</button>
      <span class="ligne-boutons" style="margin:0;"><button id="m-ann">Annuler</button>
      <button id="m-prev" class="b-bleu">Prévisualiser l'import</button></span>
    </div>
  </div>`);
  form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
  form.querySelector("#m-export").onclick = () => {
    copierExcelVersPressePapiers(d);
    alert("Lignes actuelles copiées ! Collez-les dans Excel (Ctrl+V).");
  };
  form.querySelector("#m-prev").onclick = () => {
    const fichier = form.querySelector("#m-fichier").files[0];
    if (fichier) {
      if (/\.(xlsx|xls)$/i.test(fichier.name)) {
        alert("Le format .xlsx est un fichier binaire : dans Excel, faites « Fichier → Enregistrer sous → CSV (séparateur point-virgule) », puis réessayez.");
        return;
      }
      const lecteur = new FileReader();
      lecteur.onload = () => preparer(String(lecteur.result));
      lecteur.readAsText(fichier);
    } else {
      const texte = form.querySelector("#m-texte").value;
      if (!texte.trim()) { alert("Choisissez un fichier ou collez des lignes."); return; }
      preparer(texte);
    }
  };
  // Analyse sur une COPIE des données : rien n'est modifié avant l'import
  // confirmé. La prévisualisation s'appuie sur cette même copie.
  function preparer(texte) {
    const plan = Noyau.appliquerColle(JSON.parse(JSON.stringify(d)), texte);
    modalApercu(texte, plan);
  }
  modal(form, true);
}

/* Prévisualisation de l'import : le tableau complet en largeur, chaque
   ligne colorée selon son devenir. Import réel identique au plan analysé. */
function modalApercu(texte, plan) {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const lignesFichier = texte.trim().split(/\r?\n/).filter(r => r.trim());
  const form = h(`<div style="min-width:900px;max-width:95vw;">
    <h2>Prévisualisation de l'import</h2>
    <p class="info-txt"><b>Légende :</b>
      <span class="etiquette" style="background:#dcfce7;border-color:#86efac;color:#166534;">création</span>
      <span class="etiquette" style="background:#ffedd5;border-color:#fdba74;color:#9a3412;">cellule modifiée</span>
      <span class="etiquette" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">suspect : nom déjà utilisé</span>
      <span class="etiquette" style="background:#f1f5f9;color:#64748b;">ignorée</span></p>
    <div class="enveloppe-table" style="max-height:320px;overflow-y:auto;"><table>
      <thead><tr>${COLONNES_MASSE.map(c => `<th class="${c.oblig ? "th-oblig" : ""}">${c.label}${c.oblig ? " ●" : ""}</th>`).join("")}<th>Statut</th></tr></thead>
      <tbody id="a-corps"></tbody>
    </table></div>
    <p class="info-txt" id="a-resume"></p>
    <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-vert">Importer</button></div>
  </div>`);
  const corps = form.querySelector("#a-corps");
  lignesFichier.forEach((row, idx) => {
    const c = row.split(/\t|;/);
    if (idx === 0 && /^abr/i.test((c[0] || "").trim())) return;
    const tr = document.createElement("tr");
    const abrev = (c[0] || "").trim();
    if (!abrev) {
      tr.innerHTML = `<td colspan="${COLONNES_MASSE.length}" style="color:#64748b;">${esc(row)}</td><td><span class="etiquette" style="background:#f1f5f9;color:#64748b;">ignorée</span></td>`;
      corps.appendChild(tr);
      return;
    }
    const existante = d.lignes.find(l => l.abrev.toLowerCase() === abrev.toLowerCase());
    const suspecte = !existante && plan.suspects.some(s => s.abrev === abrev);
    let statut, cls;
    if (existante) { statut = "modification"; cls = "background:#ffedd5;border-color:#fdba74;color:#9a3412;"; }
    else if (suspecte) { statut = "⚠ suspect : nom déjà utilisé"; cls = "background:#fef2f2;border-color:#fca5a5;color:#991b1b;"; }
    else { statut = "création"; cls = "background:#dcfce7;border-color:#86efac;color:#166534;"; }
    // Cellules : orange si la valeur diffère de la ligne existante.
    tr.innerHTML = COLONNES_MASSE.map((col, i) => {
      const nouvelle = (c[i] || "").trim();
      const actuelle = existante ? valMasse(d, existante, col.cle) : "";
      const modifiee = existante && nouvelle && nouvelle !== actuelle;
      return `<td class="${modifiee ? "cell-loc" : ""}">${esc(nouvelle)}</td>`;
    }).join("") + `<td><span class="etiquette" style="${cls}">${statut}</span></td>`;
    corps.appendChild(tr);
  });
  const nv = Object.entries(plan.nouvellesValeurs || {});
  form.querySelector("#a-resume").innerHTML =
    `<b>${plan.crees}</b> création(s), <b>${plan.maj}</b> modification(s), ${plan.ignorees} ignorée(s).` +
    (nv.length ? ` Valeurs inconnues qui seront créées : ${nv.map(([k, vs]) => `<b>${esc(k)}</b> → ${vs.map(esc).join(", ")}`).join(" ; ")} (badge ⚠ dans le catalogue).` : "") +
    (plan.suspects.length ? ` <b>⚠ ${plan.suspects.length} suspect(s)</b> : ${plan.suspects.map(s => esc(s.abrev)).join(", ")}.` : "");
  let confirme = false;
  form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
  form.querySelector("#m-ok").onclick = () => {
    if (plan.suspects.length && !confirme) {
      confirme = true;
      form.querySelector("#m-ok").textContent = "Confirmer malgré les suspects";
      form.querySelector("#a-resume").innerHTML += " Relancez le bouton pour importer quand même.";
      return;
    }
    const res = Noyau.appliquerColle(d, texte);
    BD.sauver();
    form.closest(".modal-fond").remove(); rafraichir();
    alert(`Import terminé : ${res.crees} création(s), ${res.maj} modification(s), ${res.ignorees} ignorée(s).` +
      (Object.keys(res.nouvellesValeurs).length
        ? ` Nouvelles valeurs à paramétrer : ${Object.entries(res.nouvellesValeurs).map(([k, vs]) => `${k} (${vs.join(", ")})`).join(" ; ")}.`
        : ""));
  };
  modal(form, true);
}

/* Formulaire d'une ligne (création ou modification) avec validation métier. */
function modalLigne(idLigne) {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const existante = idLigne ? d.lignes.find(l => l.id === idLigne) : null;
  const init = existante || { abrev: "", nom: "", reseauId: "", contratId: null, activite: "", mode: "", groupe: "", vehicules: [], energies: [], fonctions: [] };
  const cat = d.catalogue;
  /* Liste à sélection multiple (demande de Jules V1.10) : remplace les
     cases à cocher. Chaque terme cliqué affiche une coche ✓ ; un champ de
     filtre et un bouton de tri (A→Z / Z→A) aident à retrouver un terme.
     La sélection est relue à l'enregistrement via .multi-item.sel. */
  const listeMultiple = (titre, catCle, prop) => `<div class="champ liste-multi" data-grp="${prop}">
      <div class="multi-entete"><label style="margin:0;">${titre} (plusieurs — cliquez pour cocher)</label>
        <span class="inline-flex" style="gap:6px;">
          <input class="multi-q" placeholder="Filtrer…" style="width:150px;"/>
          <button type="button" class="petit multi-tri" title="Inverser l'ordre de la liste">A→Z</button>
        </span></div>
      <div class="multi-liste">${cat[catCle].labels.map(x =>
      `<div class="multi-item${init[prop].includes(x.nom) ? " sel" : ""}" data-v="${esc(x.nom)}"><span class="coche">${init[prop].includes(x.nom) ? "✓" : ""}</span><span>${esc(x.nom)}</span></div>`).join("")}</div>
      <div class="info-txt multi-nb" style="margin:4px 0 0;"></div>
    </div>`;
  // Icône ℹ️ : au survol, la bulle indique quels champs sont publics
  // (visibles dans les exports) et lesquels sont privés transporteur.
  const aidePubPrive = `Champs PUBLICS (visibles dans les exports) : Abréviation, Nom commercial, Réseau, Activité, Mode de transport, Groupe, types de véhicule, énergies, fonctions embarquées. Champ PRIVÉ transporteur : Contrat.`;
  const form = h(`<div>
    <h2>${existante ? "Modifier" : "Créer"} une ligne <span class="aide-info" data-info="${esc(aidePubPrive)}">ℹ️</span></h2>
    <div class="grille">
      <div class="champ"><label>Abréviation (8 car. max)</label><input id="m-abrev" maxlength="8" value="${esc(init.abrev)}"/></div>
      <div class="champ"><label>Nom commercial (64 car. max)</label><input id="m-nom" maxlength="64" value="${esc(init.nom)}"/></div>
      <div class="champ"><label>Réseau</label><select id="m-reseau"><option value="">— Choisir —</option>
        ${d.reseaux.map(r => `<option value="${r.id}" ${init.reseauId === r.id ? "selected" : ""}>${esc(r.nom)}</option>`).join("")}</select></div>
      <div class="champ"><label>Contrat</label><select id="m-contrat"><option value="">— Aucun —</option>
        ${d.contrats.map(c => `<option value="${c.id}" ${init.contratId === c.id ? "selected" : ""}>${esc(c.nom)}</option>`).join("")}</select></div>
      <div class="champ"><label>Activité (1 seule)</label>
        <select id="m-act"><option value="">— Choisir —</option>
        ${cat["Activités"].labels.map(a => `<option ${init.activite === a.nom ? "selected" : ""}>${esc(a.nom)}</option>`).join("")}</select></div>
      <div class="champ"><label>Mode de transport (1 seul)</label>
        <select id="m-mode"><option value="">— Choisir —</option>
        ${cat["Modes de transport"].labels.map(m => `<option ${init.mode === m.nom ? "selected" : ""}>${esc(m.nom)}</option>`).join("")}</select></div>
      <div class="champ"><label>Groupe</label>
        <select id="m-groupe"><option value="">— Aucun —</option>
        ${cat["Groupes de lignes"].labels.map(g => `<option ${init.groupe === g.nom ? "selected" : ""}>${esc(g.nom)}</option>`).join("")}</select></div>
    </div>
    ${listeMultiple("Types de véhicule", "Types de véhicule", "vehicules")}
    ${listeMultiple("Types d'énergie", "Types d'énergie", "energies")}
    ${listeMultiple("Fonctions embarquées", "Fonctions embarquées", "fonctions")}
    <div class="erreur" id="m-err"></div>
    <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-bleu">Enregistrer</button></div>
  </div>`);
  /* Fenêtre LARGE (demande de Jules V1.10) : les 3/4 de la largeur du
     tableau « Toutes les lignes » (panneau-travail) — au moins 560 px. */
  const fondLigne = modal(form);
  const panneau = document.querySelector(".panneau-travail");
  const largTableau = panneau ? panneau.getBoundingClientRect().width : 1200;
  const boxLigne = fondLigne.firstChild;
  boxLigne.style.maxWidth = "none";
  boxLigne.style.width = Math.max(560, Math.round(largTableau * 0.75)) + "px";
  /* Listes à sélection multiple : filtre, tri, coche ✓ et compteur. */
  form.querySelectorAll(".liste-multi").forEach(bloc => {
    const q = bloc.querySelector(".multi-q"), tri = bloc.querySelector(".multi-tri");
    const lbox = bloc.querySelector(".multi-liste"), nb = bloc.querySelector(".multi-nb");
    const majNb = () => nb.textContent = lbox.querySelectorAll(".multi-item.sel").length + " sélectionné(s)";
    q.oninput = () => {
      const v = q.value.trim().toLowerCase();
      lbox.querySelectorAll(".multi-item").forEach(it => {
        it.style.display = it.dataset.v.toLowerCase().includes(v) ? "" : "none";
      });
    };
    let sensAsc = true;
    tri.onclick = () => {
      sensAsc = !sensAsc;
      Array.from(lbox.children).sort((a, b) =>
        sensAsc ? a.dataset.v.localeCompare(b.dataset.v) : b.dataset.v.localeCompare(a.dataset.v)
      ).forEach(it => lbox.appendChild(it));
      tri.textContent = sensAsc ? "A→Z" : "Z→A";
    };
    lbox.addEventListener("click", (e) => {
      const it = e.target.closest(".multi-item"); if (!it) return;
      it.classList.toggle("sel");
      it.querySelector(".coche").textContent = it.classList.contains("sel") ? "✓" : "";
      majNb();
    });
    majNb();
  });
  form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
  form.querySelector("#m-ok").onclick = () => {
    const ligne = {
      ...(existante || {}),
      abrev: form.querySelector("#m-abrev").value,
      nom: form.querySelector("#m-nom").value,
      reseauId: form.querySelector("#m-reseau").value,
      contratId: form.querySelector("#m-contrat").value || null,
      activite: form.querySelector("#m-act").value,
      mode: form.querySelector("#m-mode").value,
      groupe: form.querySelector("#m-groupe").value,
      vehicules: Array.from(form.querySelectorAll('[data-grp="vehicules"] .multi-item.sel')).map(x => x.dataset.v),
      energies: Array.from(form.querySelectorAll('[data-grp="energies"] .multi-item.sel')).map(x => x.dataset.v),
      fonctions: Array.from(form.querySelectorAll('[data-grp="fonctions"] .multi-item.sel')).map(x => x.dataset.v)
    };
    // Validation métier AVANT enregistrement (mêmes règles que les tests automatiques).
    const errs = Noyau.validerLigne(d, ligne, existante ? existante.id : null);
    if (errs.length) { form.querySelector("#m-err").innerHTML = errs.map(e => "• " + esc(e)).join("<br/>"); return; }
    if (existante) { Object.assign(existante, ligne); }
    else { ligne.id = Noyau.nouvelId(d); d.lignes.push(ligne); }
    BD.sauver(); form.closest(".modal-fond").remove(); rafraichir();
  };
}

/* ---------- Vue : réseaux & contrats ---------- */
function vueReseauxContrats() {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const racine = h(`<div style="width:90%;margin:0 auto;">
    <div class="inline-flex" style="justify-content:center;width:100%;margin-bottom:10px;">
      <span class="vue-switch" id="switch"></span>
    </div>
    <div class="barre-filtres" style="grid-template-columns:2.4fr 1.2fr;">
      <div class="champ"><label>Recherche</label>
        <input id="rc-q" value="${esc(App.barreRC.q)}" placeholder="Nom, ligne incluse, ${App.vueObjet === "reseaux" ? "contrat" : "réseau"}, date…"/></div>
      <div class="champ"><label>Trier par</label>
        <select id="rc-tri">${[["nom-asc", "Nom A→Z"], ["nom-desc", "Nom Z→A"], ["deb-asc", "Validité début ↑"], ["deb-desc", "Validité début ↓"], ["fin-asc", "Validité fin ↑"], ["fin-desc", "Validité fin ↓"]]
          .map(([v, l]) => `<option value="${v}" ${App.barreRC.tri === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    </div>
    <div style="margin-bottom:12px;"><span id="b-creer"></span></div>
    <div id="liste"></div>
  </div>`);
  const sw = racine.querySelector("#switch");
  const bReseaux = h(`<button class="${App.vueObjet === "reseaux" ? "actif" : ""}">Tous les réseaux</button>`);
  bReseaux.onclick = () => { App.vueObjet = "reseaux"; rafraichir(); };
  const bContrats = h(`<button class="${App.vueObjet === "contrats" ? "actif" : ""}">Tous les contrats</button>`);
  bContrats.onclick = () => { App.vueObjet = "contrats"; rafraichir(); };
  sw.appendChild(bReseaux); sw.appendChild(bContrats);
  const bCreer = racine.querySelector("#b-creer");
  const liste = racine.querySelector("#liste");
  const nbLignes = (pred) => d.lignes.filter(pred).length;

  /* Recherche + tri (demande de Jules V1.10) : la recherche filtre sur le
     nom, les lignes rattachées, les contrats/réseaux liés ET les dates de
     validité ; le tri fonctionne par nom ou par date de validité. */
  racine.querySelector("#rc-q").oninput = (e) => {
    App.barreRC.q = e.target.value; rafraichir();
    const cible = document.getElementById("rc-q");
    if (cible) { cible.focus(); cible.setSelectionRange(cible.value.length, cible.value.length); }
  };
  racine.querySelector("#rc-tri").onchange = (e) => { App.barreRC.tri = e.target.value; rafraichir(); };
  const q = App.barreRC.q.trim().toLowerCase();
  const txtLignes = (pred) => d.lignes.filter(pred).map(l => (l.abrev + " " + l.nom).toLowerCase()).join(" ");
  const trier = (items, cleTxt) => {
    const [cle, sens] = App.barreRC.tri.split("-");
    const champ = cle === "nom" ? "nom" : (cle === "deb" ? "validiteDebut" : "validiteFin");
    return items.sort((a, b) => {
      const c = (a[champ] || a.nom || "").localeCompare(b[champ] || b.nom || "");
      return sens === "desc" ? -c : c;
    });
  };

  if (App.vueObjet === "reseaux") {
    const b = h(`<button class="b-bleu">+ Créer un réseau</button>`);
    b.onclick = () => modalReseau(null);
    bCreer.appendChild(b);
    // Recherche d'un réseau : nom, lignes rattachées, contrats liés, dates.
    const visibles = trier(d.reseaux.filter(r => !q ||
      [r.nom, txtLignes(l => l.reseauId === r.id),
        d.contrats.filter(c => (c.reseaux || []).includes(r.id)).map(c => c.nom).join(" "),
        r.validiteDebut || "", r.validiteFin || ""].join(" ").toLowerCase().includes(q)), "reseau");
    if (!visibles.length) liste.appendChild(h(`<p class="info-txt">${d.reseaux.length ? "Aucun réseau ne correspond à la recherche." : "Aucun réseau. Créez-en un : il sera disponible pour rattacher des lignes."}</p>`));
    visibles.forEach(r => {
      const carte = h(`<div class="carte">
        <div><b>${esc(r.nom)}</b>
          <div class="info-txt">Validité : ${esc(r.validiteDebut || "?")} → ${esc(r.validiteFin || "?")}</div></div>
        <span class="inline-flex">
          <span class="etiquette">${nbLignes(l => l.reseauId === r.id)} lignes</span>
          <span class="etiquette">${d.contrats.filter(c => (c.reseaux || []).includes(r.id)).length} contrats</span>
        </span>
        <span class="inline-flex"></span>
      </div>`);
      const act = carte.lastElementChild;
      const bM = h(`<button>Modifier</button>`); bM.onclick = () => modalReseau(r.id); act.appendChild(bM);
      // Règle métier (Jules) : un réseau utilisé par des lignes OU des
      // contrats ne peut pas être supprimé.
      act.appendChild(boutonSupprimer("Supprimer", () => {
        const u = Noyau.usagesReseau(d, r.id);
        if (u.lignes.length || u.contrats.length) {
          alert(`Impossible : réseau utilisé par ${u.lignes.length} ligne(s) et ${u.contrats.length} contrat(s). Utilisez 🔎 pour voir et nettoyer les utilisations.`);
          return;
        }
        d.reseaux = d.reseaux.filter(x => x.id !== r.id); BD.sauver(); rafraichir();
      }));
      const bUse = h(`<button title="Où est-il utilisé ?">🔎</button>`);
      bUse.onclick = () => modalUsages(r.nom, () => {
        const u = Noyau.usagesReseau(d, r.id);
        return [
          ...u.lignes.map(l => ({
            label: () => `Ligne <b>${esc(l.abrev)}</b> — ${esc(l.nom)}`,
            modifier: () => modalLigne(l.id),
            supprimer: () => { d.lignes = d.lignes.filter(x => x.id !== l.id); }
          })),
          ...u.contrats.map(c => ({
            label: () => `Contrat <b>${esc(c.nom)}</b>`,
            modifier: () => modalContrat(c.id),
            supprimer: () => { d.contrats = d.contrats.filter(x => x.id !== c.id); }
          }))
        ];
      });
      act.appendChild(bUse);
      liste.appendChild(carte);
    });
  } else {
    const b = h(`<button class="b-bleu">+ Créer un contrat</button>`);
    b.onclick = () => modalContrat(null);
    bCreer.appendChild(b);
    // Recherche d'un contrat : nom, lignes rattachées, réseaux liés.
    const visiblesC = trier(d.contrats.filter(c => !q ||
      [c.nom, txtLignes(l => l.contratId === c.id),
        d.reseaux.filter(r => (c.reseaux || []).includes(r.id)).map(r => r.nom).join(" ")].join(" ").toLowerCase().includes(q)), "contrat");
    if (!visiblesC.length) liste.appendChild(h(`<p class="info-txt">${d.contrats.length ? "Aucun contrat ne correspond à la recherche." : "Aucun contrat. Les contrats sont des objets privés transporteur."}</p>`));
    visiblesC.forEach(c => {
      const carte = h(`<div class="carte">
        <div><b>${esc(c.nom)}</b>
          <div class="info-txt">Réseaux : ${d.reseaux.filter(r => (c.reseaux || []).includes(r.id)).map(r => esc(r.nom)).join(", ") || "—"}</div></div>
        <span class="inline-flex"><span class="etiquette">${nbLignes(l => l.contratId === c.id)} lignes</span></span>
        <span class="inline-flex"></span>
      </div>`);
      const act = carte.lastElementChild;
      const bM = h(`<button>Modifier</button>`); bM.onclick = () => modalContrat(c.id); act.appendChild(bM);
      // Règle métier (Jules) : un contrat utilisé par des lignes ne peut
      // pas être supprimé.
      act.appendChild(boutonSupprimer("Supprimer", () => {
        const u = Noyau.usagesContrat(d, c.id);
        if (u.lignes.length) { alert(`Impossible : contrat utilisé par ${u.lignes.length} ligne(s). Utilisez 🔎 pour voir et nettoyer les utilisations.`); return; }
        d.contrats = d.contrats.filter(x => x.id !== c.id); BD.sauver(); rafraichir();
      }));
      const bUse = h(`<button title="Où est-il utilisé ?">🔎</button>`);
      bUse.onclick = () => modalUsages(c.nom, () =>
        Noyau.usagesContrat(d, c.id).lignes.map(l => ({
          label: () => `Ligne <b>${esc(l.abrev)}</b> — ${esc(l.nom)}`,
          modifier: () => modalLigne(l.id),
          supprimer: () => { d.lignes = d.lignes.filter(x => x.id !== l.id); }
        })));
      act.appendChild(bUse);
      liste.appendChild(carte);
    });
  }
  return racine;
}

/* ============================================================
   V2.5 — TABLEAUX DES RÉSEAUX ET DES CONTRATS (demande de Jules) :
   chacun a son onglet, avec EXACTEMENT la disposition du tableau
   « Toutes les lignes » : ⚙ Colonnes (mémorisé par instance),
   📋 Copier (Excel), 📥 Importer, barre de recherche à choix
   multiples, bouton « + Créer » au-dessus à gauche du tableau,
   ✎/🔎/🗑 par ligne, double-clic = fiche.
   ============================================================ */

const RESEAU_COLONNES = [
  { cle: "id", label: "ID unique", fixe: true },
  { cle: "nom", label: "Nom" },
  { cle: "validiteDebut", label: "Début validité" },
  { cle: "validiteFin", label: "Fin validité" },
  { cle: "nbLignes", label: "Lignes" },
  { cle: "nbContrats", label: "Contrats" }
];

function vueReseaux() {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const prefCle = "hastus_colonnes_reseaux_" + App.instanceOuverte.id;
  if (!App.barreReseaux) App.barreReseaux = { q: "", validite: "all", contrat: "all" };
  const b = App.barreReseaux;
  let colonnesChoisies;
  try {
    const p = JSON.parse(localStorage.getItem(prefCle) || "null");
    colonnesChoisies = Array.isArray(p) && p.length ? p : ["nom", "validiteDebut", "validiteFin", "nbLignes", "nbContrats"];
  } catch (e) { colonnesChoisies = ["nom", "validiteDebut", "validiteFin", "nbLignes", "nbContrats"]; }
  const q = String(b.q || "").trim().toLowerCase();
  const aujourdhui = new Date().toISOString().slice(0, 10);
  const nbLignes = (id) => d.lignes.filter(l => l.reseauId === id).length;
  const contratsDe = (id) => d.contrats.filter(c => (c.reseaux || []).includes(id));
  const visibles = d.reseaux.filter(r => {
    if (q && !(r.nom + " " + (r.validiteDebut || "") + " " + (r.validiteFin || "")).toLowerCase().includes(q)) return false;
    if (b.validite === "cours" && !(r.validiteDebut <= aujourdhui && (!r.validiteFin || r.validiteFin >= aujourdhui))) return false;
    if (b.validite === "avenir" && !(r.validiteDebut > aujourdhui)) return false;
    if (b.validite === "expire" && !(r.validiteFin && r.validiteFin < aujourdhui)) return false;
    if (b.contrat === "oui" && contratsDe(r.id).length === 0) return false;
    if (b.contrat === "non" && contratsDe(r.id).length > 0) return false;
    return true;
  });
  const cles = ["id", ...colonnesChoisies];
  const cols = cles.map(cle => RESEAU_COLONNES.find(c => c.cle === cle)).filter(Boolean);
  const valCol = (r, cle) => cle === "nbLignes" ? nbLignes(r.id) : cle === "nbContrats" ? contratsDe(r.id).length : (r[cle] || "—");

  const racine = h(`<div class="carte panneau-travail tableau-page">
    <div class="barre-outils">
      <div class="titre">Tableau de gestion des réseaux</div>
      <div class="actions">
        <span class="menu-col"><button id="rs-col">⚙ Colonnes</button></span>
        <button id="rs-copy">📋 Copier (Excel)</button>
        <button id="rs-masse">📥 Importer</button>
      </div>
    </div>
    <div class="barre-filtres" style="grid-template-columns:2fr 1fr 1fr;">
      <div class="champ"><label>Recherche</label>
        <input id="rs-q" value="${esc(b.q)}" placeholder="Nom, date de validité…"/></div>
      <div class="champ"><label>Validité</label>
        <select id="rs-val">${[["all", "Toutes"], ["cours", "En cours"], ["avenir", "À venir"], ["expire", "Expirées"]]
          .map(([v, l]) => `<option value="${v}" ${b.validite === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="champ"><label>Contrats liés</label>
        <select id="rs-ctr">${[["all", "Tous"], ["oui", "Avec contrat"], ["non", "Sans contrat"]]
          .map(([v, l]) => `<option value="${v}" ${b.contrat === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="inline-flex" style="justify-content:space-between;width:100%;margin-bottom:10px;">
      <button id="rs-nouv" class="b-bleu">+ Créer un réseau</button>
      <button id="rs-raz" class="petit">Réinitialiser les filtres</button>
    </div>
    <div class="enveloppe-table"><table>
      <thead><tr>${cols.map(c => `<th>${esc(c.label)}</th>`).join("")}<th style="text-align:right;">Actions</th></tr></thead>
      <tbody id="rs-corps"></tbody>
    </table></div>
    <p class="info-txt" id="rs-compte" style="margin-top:8px;"></p>
  </div>`);

  racine.querySelector("#rs-q").oninput = (e) => { b.q = e.target.value; rafraichir(); const c = document.getElementById("rs-q"); if (c) { c.focus(); c.setSelectionRange(c.value.length, c.value.length); } };
  racine.querySelector("#rs-val").onchange = (e) => { b.validite = e.target.value; rafraichir(); };
  racine.querySelector("#rs-ctr").onchange = (e) => { b.contrat = e.target.value; rafraichir(); };
  racine.querySelector("#rs-nouv").onclick = () => modalReseau(null);
  racine.querySelector("#rs-raz").onclick = () => { App.barreReseaux = { q: "", validite: "all", contrat: "all" }; rafraichir(); };

  const corps = racine.querySelector("#rs-corps");
  corps.innerHTML = visibles.map(r =>
    `<tr data-id="${esc(r.id)}">` + cols.map(c => `<td>${esc(String(valCol(r, c.cle)))}</td>`).join("")
    + `<td style="text-align:right;"><button class="ico" data-act="mod" data-id="${esc(r.id)}" title="Modifier">✎</button><button class="ico" data-act="use" data-id="${esc(r.id)}" title="Où est-il utilisé ?">🔎</button><button class="ico suppr" data-act="sup" data-id="${esc(r.id)}" title="Supprimer">🗑</button></td></tr>`
  ).join("") + (!visibles.length ? `<tr><td colspan="${cols.length + 1}" style="text-align:center;color:#64748b;">${d.reseaux.length ? "Aucun réseau ne correspond aux filtres." : "Aucun réseau — cliquez « + Créer un réseau »."}</td></tr>` : "");
  corps.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.act === "mod") return modalReseau(id);
    if (btn.dataset.act === "use") {
      const r = d.reseaux.find(x => x.id === id);
      return modalUsages(r.nom, () => {
        const u = Noyau.usagesReseau(d, id);
        return [
          ...u.lignes.map(l => ({ label: () => `Ligne <b>${esc(l.abrev)}</b> — ${esc(l.nom)}`, modifier: () => modalLigne(l.id), supprimer: () => { d.lignes = d.lignes.filter(x => x.id !== l.id); } })),
          ...u.contrats.map(c => ({ label: () => `Contrat <b>${esc(c.nom)}</b>`, modifier: () => modalContrat(c.id), supprimer: () => { d.contrats = d.contrats.filter(x => x.id !== c.id); } }))
        ];
      });
    }
    if (btn.classList.contains("armed")) {
      const u = Noyau.usagesReseau(d, id);
      if (u.lignes.length || u.contrats.length) { alert(`Impossible : réseau utilisé par ${u.lignes.length} ligne(s) et ${u.contrats.length} contrat(s).`); return; }
      d.reseaux = d.reseaux.filter(x => x.id !== id); BD.sauver(); rafraichir(); return;
    }
    btn.classList.add("armed"); btn.textContent = "Confirmer ?";
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = "🗑"; } }, 3000);
  });
  corps.addEventListener("dblclick", (e) => { if (e.target.closest("button")) return; const tr = e.target.closest("tr"); if (tr && tr.dataset.id) modalReseau(tr.dataset.id); });
  racine.querySelector("#rs-compte").textContent = `${visibles.length} réseau(x) affiché(s) sur ${d.reseaux.length}`;

  /* ⚙ Colonnes : même mécanique que les tableaux lignes/arrêts. */
  racine.querySelector("#rs-col").onclick = () => {
    const ancien = racine.querySelector(".panneau");
    if (ancien) { ancien.remove(); return; }
    let travail = [...colonnesChoisies];
    RESEAU_COLONNES.forEach(c => { if (!c.fixe && !travail.includes(c.cle)) travail.push(c.cle); });
    const cochees = new Set(colonnesChoisies);
    const pan = h(`<div class="panneau" style="width:320px;">
      <b style="font-size:13px;">Colonnes affichées</b>
      <p class="info-txt" style="margin:2px 0 6px;">Cocher/décocher · « Appliquer » enregistre.</p>
      <div id="rsp-liste" style="max-height:240px;overflow-y:auto;"></div>
      <div class="ligne-boutons" style="margin:6px 0 0;">
        <button id="rsp-ann">✕ Fermer</button><button id="rsp-ok" class="b-bleu">Appliquer</button>
      </div>
    </div>`);
    const dessiner = () => {
      const box = pan.querySelector("#rsp-liste");
      box.innerHTML = "";
      travail.forEach(cle => {
        const col = RESEAU_COLONNES.find(c => c.cle === cle);
        const l = h(`<label class="p-ligne"><input type="checkbox" ${cochees.has(cle) || col.fixe ? "checked" : ""} ${col.fixe ? "disabled" : ""}/> <span>${esc(col.label)}${col.fixe ? ' <span class="etiquette">fixe</span>' : ""}</span></label>`);
        l.querySelector("input").onchange = (ev) => ev.target.checked ? cochees.add(cle) : cochees.delete(cle);
        box.appendChild(l);
      });
    };
    dessiner();
    pan.querySelector("#rsp-ann").onclick = () => pan.remove();
    pan.querySelector("#rsp-ok").onclick = () => {
      colonnesChoisies = travail.filter(cle => cochees.has(cle));
      localStorage.setItem(prefCle, JSON.stringify(colonnesChoisies));
      rafraichir();
    };
    racine.querySelector("#rs-col").parentElement.appendChild(pan);
  };

  /* 📋 Copier (Excel). */
  racine.querySelector("#rs-copy").onclick = () => {
    const tsv = ["Nom\tDébut\tFin\tLignes\tContrats"].concat(
      d.reseaux.map(r => [r.nom, r.validiteDebut || "", r.validiteFin || "",
        d.lignes.filter(l => l.reseauId === r.id).map(l => l.abrev).join(" "), contratsDe(r.id).map(c => c.nom).join(" | ")].join("\t"))
    ).join("\n");
    navigator.clipboard?.writeText(tsv);
    alert(`Les ${d.reseaux.length} réseau(x) sont dans le presse-papiers : collez-les dans Excel avec Ctrl+V.`);
  };

  /* 📥 Importer : TSV/CSV « Nom* — Début — Fin » ; clé = nom unique. */
  racine.querySelector("#rs-masse").onclick = () => {
    const form = h(`<div>
      <h2>Importer des réseaux</h2>
      <p class="info-txt">Colonnes : <b>Nom* — Début (AAAA-MM-JJ) — Fin (AAAA-MM-JJ)</b> (* = obligatoire, nom unique).</p>
      <p class="info-txt">Un réseau portant déjà ce nom est mis à jour (validité) ; sinon il est créé.</p>
      <label><input type="file" id="rs-fichier" accept=".csv,.tsv,.txt"></label>
      <label>ou collez ici :<br><textarea id="rs-texte" rows="6" style="width:100%;" placeholder="Réseau Nord&#9;2024-01-01&#9;2099-12-31"></textarea></label>
      <div class="ligne-boutons"><button id="rs-ann" class="b-blanc">Annuler</button><button id="rs-go" class="b-bleu">Importer</button></div>
    </div>`);
    modal(form);
    form.querySelector("#rs-ann").onclick = () => form.closest(".modal-fond").remove();
    form.querySelector("#rs-go").onclick = () => {
      const texte = form.querySelector("#rs-texte").value;
      if (!texte.trim()) { alert("Collez des lignes (ou utilisez le fichier ci-dessus)."); return; }
      let crees = 0, maj = 0, ignorees = 0;
      texte.split(/\r?\n/).map(x => x.trim()).filter(Boolean).forEach(ligneTxt => {
        const c = ligneTxt.split(/\t|;/).map(x => (x || "").trim());
        const nom = c[0], deb = c[1] || "", fin = c[2] || "";
        if (!nom) { ignorees++; return; }
        const existant = d.reseaux.find(r => r.nom.toLowerCase() === nom.toLowerCase());
        if (existant) { existant.validiteDebut = deb; existant.validiteFin = fin; maj++; }
        else { d.reseaux.push({ id: Noyau.nouvelId(d), nom, validiteDebut: deb, validiteFin: fin }); crees++; }
      });
      BD.sauver(); form.closest(".modal-fond").remove(); rafraichir();
      alert(`Import terminé : ${crees} création(s), ${maj} mise(s) à jour, ${ignorees} ignorée(s).`);
    };
  };

  return racine;
}

      <b style="font-size:13px;">Colonnes affichées</b>
      <p class="info-txt" style="margin:2px 0 6px;">Cocher/décocher · « Appliquer » enregistre.</p>
      <div id="ctp-liste" style="max-height:240px;overflow-y:auto;"></div>
      <div class="ligne-boutons" style="margin:6px 0 0;">
        <button id="ctp-ann">✕ Fermer</button><button id="ctp-ok" class="b-bleu">Appliquer</button>
      </div>
    </div>`);
    const dessiner = () => {
      const box = pan.querySelector("#ctp-liste");
      box.innerHTML = "";
      travail.forEach(cle => {
        const col = CONTRAT_COLONNES.find(c => c.cle === cle);
        const l = h(`<label class="p-ligne"><input type="checkbox" ${cochees.has(cle) || col.fixe ? "checked" : ""} ${col.fixe ? "disabled" : ""}/> <span>${esc(col.label)}${col.fixe ? ' <span class="etiquette">fixe</span>' : ""}</span></label>`);
        l.querySelector("input").onchange = (ev) => ev.target.checked ? cochees.add(cle) : cochees.delete(cle);
        box.appendChild(l);
      });
    };
    dessiner();
    pan.querySelector("#ctp-ann").onclick = () => pan.remove();
    pan.querySelector("#ctp-ok").onclick = () => {
      colonnesChoisies = travail.filter(cle => cochees.has(cle));
      localStorage.setItem(prefCle, JSON.stringify(colonnesChoisies));
      rafraichir();
    };
    racine.querySelector("#ct-col").parentElement.appendChild(pan);
  };

  racine.querySelector("#ct-copy").onclick = () => {
    const tsv = ["Nom\tRéseaux\tLignes"].concat(
      d.contrats.map(c => [c.nom, reseauxDe(c).map(r => r.nom).join(" | "),
        d.lignes.filter(l => l.contratId === c.id).map(l => l.abrev).join(" ")].join("\t"))
    ).join("\n");
    navigator.clipboard?.writeText(tsv);
    alert(`Les ${d.contrats.length} contrat(s) sont dans le presse-papiers : collez-les dans Excel avec Ctrl+V.`);
  };

  racine.querySelector("#ct-masse").onclick = () => {
    const form = h(`<div>
      <h2>Importer des contrats</h2>
      <p class="info-txt">Colonnes : <b>Nom* — Réseaux (noms séparés par « | »)</b> (* = obligatoire, nom unique).</p>
      <p class="info-txt">Un contrat portant déjà ce nom est mis à jour (réseaux concernés) ; sinon il est créé.</p>
      <label><input type="file" id="ct-fichier" accept=".csv,.tsv,.txt"></label>
      <label>ou collez ici :<br><textarea id="ct-texte" rows="6" style="width:100%;" placeholder="Exploitation Sud&#9;Réseau Sud | Réseau Nord"></textarea></label>
      <div class="ligne-boutons"><button id="ct-ann" class="b-blanc">Annuler</button><button id="ct-go" class="b-bleu">Importer</button></div>
    </div>`);
    modal(form);
    form.querySelector("#ct-ann").onclick = () => form.closest(".modal-fond").remove();
    form.querySelector("#ct-go").onclick = () => {
      const texte = form.querySelector("#ct-texte").value;
      if (!texte.trim()) { alert("Collez des lignes (ou utilisez le fichier ci-dessus)."); return; }
      let crees = 0, maj = 0, ignorees = 0;
      texte.split(/\r?\n/).map(x => x.trim()).filter(Boolean).forEach(ligneTxt => {
        const c = ligneTxt.split(/\t|;/).map(x => (x || "").trim());
        const nom = c[0];
        if (!nom) { ignorees++; return; }
        const nomsReseaux = (c[1] || "").split("|").map(x => x.trim()).filter(Boolean);
        const ids = nomsReseaux.map(n => (d.reseaux.find(r => r.nom.toLowerCase() === n.toLowerCase()) || {}).id).filter(Boolean);
        if (nomsReseaux.length && ids.length !== nomsReseaux.length) { ignorees++; return; }
        const existant = d.contrats.find(x => x.nom.toLowerCase() === nom.toLowerCase());
        if (existant) { existant.reseaux = ids; maj++; }
        else { d.contrats.push({ id: Noyau.nouvelId(d), nom, reseaux: ids }); crees++; }
      });
      BD.sauver(); form.closest(".modal-fond").remove(); rafraichir();
      alert(`Import terminé : ${crees} création(s), ${maj} mise(s) à jour, ${ignorees} ignorée(s).`);
    };
  };

  return racine;
}

/* Formulaire réseau : nom + période de validité (bornée à 2099). */
function modalReseau(idReseau) {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const r = idReseau ? d.reseaux.find(x => x.id === idReseau) : null;
  const form = h(`<div>
    <h2>${r ? "Modifier" : "Créer"} un réseau</h2>
    <div class="champ"><label>Nom du réseau (32 car. max)</label><input id="m-nom" maxlength="32" value="${r ? esc(r.nom) : ""}"/></div>
    <div class="grille">
      <div class="champ"><label>Début de validité</label><input id="m-deb" type="date" value="${r ? esc(r.validiteDebut) : ""}"/></div>
      <div class="champ"><label>Fin de validité (jusqu'à 2099)</label><input id="m-fin" type="date" min="2020-01-01" max="2099-12-31" value="${r ? esc(r.validiteFin) : ""}"/></div>
    </div>
    <div class="erreur" id="m-err"></div>
    <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-bleu">Enregistrer</button></div>
  </div>`);
  modal(form);
  form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
  form.querySelector("#m-ok").onclick = () => {
    const nom = form.querySelector("#m-nom").value.trim();
    const deb = form.querySelector("#m-deb").value, fin = form.querySelector("#m-fin").value;
    if (!nom) { form.querySelector("#m-err").textContent = "Nom obligatoire."; return; }
    if (deb && fin && deb > fin) { form.querySelector("#m-err").textContent = "La fin de validité doit suivre le début."; return; }
    if (fin && fin > "2099-12-31") { form.querySelector("#m-err").textContent = "La validité ne peut dépasser 2099."; return; }
    // Règle d'unicité (Jules) : deux réseaux ne peuvent pas porter le même nom.
    if (Noyau.nomUtilise(d.reseaux, nom, r ? r.id : null)) { form.querySelector("#m-err").textContent = "Un réseau porte déjà ce nom (le nom est un code unique)."; return; }
    if (r) { r.nom = nom; r.validiteDebut = deb; r.validiteFin = fin; }
    else d.reseaux.push({ id: Noyau.nouvelId(d), nom, validiteDebut: deb, validiteFin: fin });
    BD.sauver(); form.closest(".modal-fond").remove(); rafraichir();
  };
}

    <div class="erreur" id="m-err"></div>

    // Règle d'unicité (Jules) : deux contrats ne peuvent pas porter le même nom.
    if (Noyau.nomUtilise(d.contrats, nom, c ? c.id : null)) { form.querySelector("#m-err").textContent = "Un contrat porte déjà ce nom (le nom est un code unique)."; return; }

/* ---------- Vue : catalogue de l'instance (classeur à onglets) ---------- */
/* Chaque catégorie = un onglet du classeur. L'onglet affiche un TABLEAU :
   - colonne « Label » (fond coloré selon l'origine, cf. légende),
   - colonnes d'export remplies par l'utilisateur (codes des futurs exports),
   - actions : modifier ✎ / supprimer ✕, plus « + Ajouter un label ».
   Un onglet supplémentaire « Colonnes calculées » définit les compteurs
   du tableau « Toutes les lignes ». */
App.vueCat = "Activités";
function vueCatalogue() {
  const d = BD.donneesInstance(App.instanceOuverte.id);
  const cats = [...Object.keys(d.catalogue), "Colonnes calculées"];
  // « Colonnes calculées » désactivé : on retombe sur la 1re catégorie si
  // l'état de l'interface pointait dessus (ancienne session).
  if (!App.vueCat || !cats.includes(App.vueCat) || App.vueCat === "Colonnes calculées") App.vueCat = cats[0];
  /* Disposition (reprise du prototype V2) : onglets de catégories VERTICAUX
     à gauche, panneau de contenu à droite. Toutes les fonctionnalités V1
     (codes d'export, colonnes renommables/supprimables, standards, légende)
     sont conservées. */
  const racine = h(`<div style="width:90%;margin:0 auto;">
    <div class="catalogue-disposition">
      <div class="menu-gauche"><div id="onglets-cat" style="display:grid;gap:6px;"></div></div>
      <div class="panneau-catalogue">
        <div>
          <p class="info-txt" style="margin:0;">Listes de référence de l'instance, alignées sur les standards NeTEx / GTFS.
            <button id="maj-ref" style="border:none;background:none;color:#64748b;text-decoration:underline;cursor:pointer;font-size:12px;padding:0;" title="Ajoute les valeurs des standards manquantes">🔄 Mettre à jour depuis les standards</button></p>
          <p class="info-txt" style="margin:2px 0 0;"><b>Légende :</b> <span class="pastille std"></span> issu des standards (ou ajouté par la mise à jour) ·
            <span class="pastille loc"></span> ajouté ou modifié par vous ·
            <span class="etiquette alerte">⚠ n</span> valeurs à paramétrer (aucun code d'export rempli). Dès qu'une colonne est remplie pour chaque valeur, le badge disparaît.</p>
        </div>
        <div id="contenu-cat" style="margin-top:12px;"></div>
      </div>
    </div>
  </div>`);
  const ongletsBox = racine.querySelector("#onglets-cat");
  // Badge ⚠ : nombre de valeurs à paramétrer (ajoutées automatiquement ou
  // par l'utilisateur, sans code d'export renseigné).
  /* Valeur « paramétrée » = AU MOINS UNE colonne d'export remplie
     (avant : seule la colonne nommée « export » comptait → un label rempli
     dans une autre colonne restait en avertissement — bug signalé par
     Jules sur l'onglet Activités). */
  const aParametrer = (cat) => d.catalogue[cat]
    ? d.catalogue[cat].labels.filter(l => l.origine === "local" && !Object.values(l.codes || {}).some(c => (c || "").trim())).length : 0;
  cats.forEach(cat => {
    const nb = cat === "Colonnes calculées" ? 0 : aParametrer(cat);
    // « Colonnes calculées » : DÉSACTIVÉ pour l'instant (grisé, à améliorer
    // plus tard — demande de Jules V1.11).
    const grise = cat === "Colonnes calculées";
    const b = h(`<button class="onglet ${App.vueCat === cat ? "actif" : ""} ${grise ? "onglet-gris" : ""}" ${grise ? "disabled" : ""} ${grise ? 'title="Bientôt disponible"' : ""}>${esc(cat)}${nb ? ` <span class="etiquette alerte">⚠ ${nb}</span>` : ""}</button>`);
    if (!grise) b.onclick = () => { App.vueCat = cat; rafraichir(); };
    ongletsBox.appendChild(b);
  });
  // Mise à jour : ajoute les valeurs du référentiel GTFS/NeTEx absentes
  // du catalogue, marquées « standard » (bleu). Le référentiel est embarqué
  // (les vocabulaires GTFS sont stables) et prêt à être enrichi par une API.
  racine.querySelector("#maj-ref").onclick = () => {
    const res = Noyau.majReferentiel(d);
    BD.sauver(); rafraichir();
    alert(res.ajoutes === 0
      ? "Catalogue déjà à jour : aucune valeur des standards ne manque."
      : `${res.ajoutes} label(s) ajouté(s) depuis les standards GTFS/NeTEx (en bleu).`);
  };
  const box = racine.querySelector("#contenu-cat");
  /* Mise à jour EN DIRECT des badges ⚠ des onglets (demande de Jules V1.10) :
     dès que chaque valeur d'une catégorie possède son code d'export, le
     badge disparaît — sans bouton « Enregistrer », tout est automatique. */
  const majAlertes = () => {
    ongletsBox.querySelectorAll("button").forEach((b, idx) => {
      const cat = cats[idx];
      if (!cat || cat === "Colonnes calculées") return;
      const nb = aParametrer(cat);
      let badge = b.querySelector(".etiquette.alerte");
      if (nb) {
        if (badge) badge.textContent = "⚠ " + nb;
        else b.appendChild(h(`<span class="etiquette alerte">⚠ ${nb}</span>`));
      } else if (badge) badge.remove();
    });
  };
  if (App.vueCat === "Colonnes calculées") box.appendChild(vueColonnesCalculees(d));
  else box.appendChild(vueOngletCatalogue(d, App.vueCat, majAlertes));
  return racine;
}

/* Un onglet du classeur : le tableau des labels d'une catégorie. */
function vueOngletCatalogue(d, categorie, majAlertes) {
  const cat = d.catalogue[categorie];
  const racine = h(`<div>
    <div class="inline-flex" style="margin-bottom:10px;">
      <button id="c-add" class="b-bleu">+ Ajouter un label</button>
      <button id="c-col">+ Ajouter une colonne d'export</button>
      <button id="c-copy">📋 Copier (Excel)</button>
      <button id="c-imp">📥 Importer</button>
    </div>
    <div class="enveloppe-table tableau-refs"><table>
      <thead><tr><th>Label</th>${cat.colonnes.map((c, ci) => `<th data-ci="${ci}">${esc(c)} <button class="ico f-ren" title="Renommer cette colonne d'export">✎</button><button class="ico f-sup" title="Supprimer cette colonne d'export">✕</button></th>`).join("")}<th style="text-align:right;">Actions</th></tr></thead>
      <tbody id="c-corps"></tbody>
    </table></div>
  </div>`);
  // En-têtes des colonnes d'export : renommer (les codes suivent le nouveau
  // nom) et supprimer — mais toujours en garder AU MOINS UNE.
  racine.querySelectorAll("th[data-ci]").forEach(th => {
    const ci = Number(th.dataset.ci);
    th.querySelector(".f-ren").onclick = () => {
      const ancien = cat.colonnes[ci];
      const nv = (prompt("Nouveau nom de la colonne d'export :", ancien) || "").trim();
      if (!nv || nv === ancien) return;
      if (nv.length > 32) { alert("32 caractères maximum pour un nom de colonne."); return; }
      if (cat.colonnes.includes(nv)) { alert("Ce nom de colonne existe déjà dans cet onglet."); return; }
      cat.labels.forEach(l => { l.codes[nv] = l.codes[ancien]; delete l.codes[ancien]; });
      cat.colonnes[ci] = nv;
      BD.sauver(); rafraichir();
    };
    th.querySelector(".f-sup").onclick = () => {
      if (cat.colonnes.length <= 1) { alert("Impossible : il doit rester au moins une colonne d'export dans cet onglet."); return; }
      const nom = cat.colonnes[ci];
      if (!confirm(`Supprimer la colonne « ${nom} » ? Les codes d'export qu'elle contient seront perdus.`)) return;
      cat.labels.forEach(l => delete l.codes[nom]);
      cat.colonnes.splice(ci, 1);
      BD.sauver(); rafraichir();
    };
  });
  const corps = racine.querySelector("#c-corps");
  /* OPTIMISATION : le tableau est construit en UNE SEULE écriture innerHTML
     et les événements sont DÉLÉGUÉS sur le tbody (1 écouteur « change » pour
     les codes, 1 écouteur « click » pour les 3 boutons — au lieu de 3
     boutons + n inputs PAR ligne). */
  const dessiner = () => {
    corps.innerHTML = cat.labels.map((lab, i) =>
      `<tr><td class="cell-${lab.origine === "standard" ? "std" : "loc"}">${esc(lab.nom)}</td>`
      + cat.colonnes.map(c => `<td><input data-code="${esc(c)}" data-i="${i}" maxlength="16" value="${esc(lab.codes[c] || "")}" style="padding:3px 6px;font-size:12px;" placeholder="code…"/></td>`).join("")
      + `<td style="text-align:right;">
          <button data-act="mod" data-i="${i}" title="Modifier le label">✎</button>
          <button data-act="sup" data-i="${i}" title="Supprimer">✕</button>
          <button data-act="use" data-i="${i}" title="Où est-il utilisé ?">🔎</button>
        </td></tr>`
    ).join("") + (!cat.labels.length
      ? `<tr><td colspan="${cat.colonnes.length + 2}" style="text-align:center;color:#64748b;">Aucun label — ajoutez-en ou lancez la mise à jour des standards.</td></tr>`
      : "");
  };
  // Codes d'export : saisie directe dans la cellule, enregistrée au
  // change — avec règle d'unicité (deux labels d'une même catégorie ne
  // peuvent pas porter le même code : il les identifiera à l'export).
  corps.addEventListener("change", (e) => {
    const inp = e.target.closest("input[data-code]");
    if (!inp) return;
    const i = Number(inp.dataset.i), lab = cat.labels[i];
    const val = inp.value.trim();
    const dejaPris = val && cat.labels.some((x, j) => j !== i &&
      (x.codes[inp.dataset.code] || "").trim().toLowerCase() === val.toLowerCase());
    if (dejaPris) {
      alert("Ce code est déjà utilisé par un autre label de cette catégorie : chaque code doit être unique.");
      inp.value = lab.codes[inp.dataset.code] || "";
      return;
    }
    lab.codes[inp.dataset.code] = val; BD.sauver(); if (majAlertes) majAlertes();
  });
  // Boutons d'action (délégation) : modifier / supprimer / utilisations.
  corps.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const i = Number(b.dataset.i), lab = cat.labels[i];
    if (b.dataset.act === "mod") {
      const nv = prompt("Modifier le label :", lab.nom);
      if (nv !== null) { const r = Noyau.modifierLabel(d, categorie, i, nv); if (!r.ok) alert(r.erreur); else { BD.sauver(); dessiner(); if (majAlertes) majAlertes(); } }
    } else if (b.dataset.act === "sup") {
      // Règle métier (Jules) : la suppression est refusée si le label est
      // utilisé par au moins une ligne (le message indique lesquelles).
      const r = Noyau.supprimerLabel(d, categorie, i);
      if (!r.ok) { alert(r.erreur); return; }
      BD.sauver(); dessiner(); if (majAlertes) majAlertes();
    } else if (b.dataset.act === "use") {
      modalUsages(lab.nom, () =>
        Noyau.usagesLabel(d, categorie, lab.nom).map(l => ({
          label: () => `Ligne <b>${esc(l.abrev)}</b> — ${esc(l.nom)}`,
          modifier: () => modalLigne(l.id),
          supprimer: () => { d.lignes = d.lignes.filter(x => x.id !== l.id); }
        })));
    }
  });
  dessiner();
  racine.querySelector("#c-add").onclick = () => {
    const nv = prompt("Nouveau label (s'ajoute à la liste) :");
    if (nv) { const r = Noyau.ajouterLabel(d, categorie, nv, "local"); if (!r.ok) alert(r.erreur); else { BD.sauver(); dessiner(); if (majAlertes) majAlertes(); } }
  };
  racine.querySelector("#c-col").onclick = () => {
    const nv = (prompt("Nom de la nouvelle colonne d'export :", "export") || "").trim();
    if (!nv) return;
    if (nv.length > 32) { alert("32 caractères maximum pour un nom de colonne."); return; }
    if (cat.colonnes.includes(nv)) { alert("Cette colonne existe déjà."); return; }
    cat.colonnes.push(nv);
    BD.sauver(); rafraichir();
  };
  /* ---- 📋 Copier (Excel) et 📥 Importer : mêmes fonctions que le tableau
     des lignes, appliquées au classeur de CETTE catégorie (V1.11). ---- */
  racine.querySelector("#c-copy").onclick = () => {
    const tsv = ["Label\t" + cat.colonnes.join("\t")]
      .concat(cat.labels.map(l => l.nom + "\t" + cat.colonnes.map(c => l.codes[c] || "").join("\t"))).join("\n");
    navigator.clipboard?.writeText(tsv);
    alert("« " + categorie + " » copié ! Collez dans Excel (Ctrl+V).");
  };
  racine.querySelector("#c-imp").onclick = () => {
    const form = h(`<div style="min-width:700px;max-width:95vw;">
      <h2>Importer « ${esc(categorie)} »</h2>
      <p class="info-txt">Colonnes : <b>Label — ${cat.colonnes.join(" — ")}</b>.
        Le nom du label est la clé : existant → mise à jour des codes, nouveau → création.
        Des colonnes inconnues de l'entête seront ajoutées automatiquement.</p>
      <div class="champ"><label>📂 Fichier du PC (CSV ou texte exporté d'Excel)</label>
        <input type="file" id="m-fichier" accept=".csv,.txt,.tsv"/></div>
      <div class="champ"><label>…ou collez les lignes ici (depuis Excel : Ctrl+C puis Ctrl+V)</label>
        <textarea id="m-texte" rows="5" placeholder="Label&#9;${esc(cat.colonnes.join("&#9;"))}"></textarea></div>
      <div class="ligne-boutons"><button id="m-ann">Annuler</button>
        <button id="m-prev" class="b-bleu">Prévisualiser l'import</button></div>
    </div>`);
    modal(form, true);
    form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
    form.querySelector("#m-prev").onclick = () => {
      const fichier = form.querySelector("#m-fichier").files[0];
      if (fichier) {
        if (/\.(xlsx|xls)$/i.test(fichier.name)) {
          alert("Le format .xlsx est un fichier binaire : dans Excel, faites « Fichier → Enregistrer sous → CSV (séparateur point-virgule) », puis réessayez.");
          return;
        }
        const lecteur = new FileReader();
        lecteur.onload = () => preparerCat(String(lecteur.result));
        lecteur.readAsText(fichier);
      } else {
        const texte = form.querySelector("#m-texte").value;
        if (!texte.trim()) { alert("Choisissez un fichier ou collez des lignes."); return; }
        preparerCat(texte);
      }
    };
    /* Analyse (sur rien : rien n'est modifié avant la confirmation) :
       détection du séparateur (tabulation / ; / virgule), entête optionnelle
       commençant par « Label ». Chaque ligne → création ou mise à jour. */
    const preparerCat = (texte) => {
      const lignes = texte.trim().split(/\r?\n/).filter(r => r.trim());
      if (!lignes.length) { alert("Rien à importer."); return; }
      const sep = ["\t", ";", ","].map(s => ({ s, n: lignes[0].split(s).length })).sort((a, b) => b.n - a.n)[0].s;
      const rangees = lignes.map(r => r.split(sep));
      let colonnes = cat.colonnes.slice(), debut = 0;
      const prem = (rangees[0][0] || "").trim().toLowerCase();
      if (prem === "label" || prem === "labels" || prem === "libellé" || prem === "libelle") {
        colonnes = rangees[0].slice(1).map(x => x.trim()).filter(Boolean);
        debut = 1;
      }
      if (!colonnes.length) { alert("Aucune colonne d'export détectée."); return; }
      const plan = rangees.slice(debut).map(r => {
        const nom = (r[0] || "").trim();
        const codes = {};
        colonnes.forEach((c, i) => { const v = (r[i + 1] || "").trim().slice(0, 16); if (v) codes[c] = v; });
        const existant = nom && cat.labels.find(l => l.nom.toLowerCase() === nom.toLowerCase());
        return { nom, codes, colonnes, statut: !nom ? "ignoré" : existant ? "modifié" : "créé", cible: existant || null };
      }).filter(p => p.statut !== "ignoré");
      if (!plan.length) { alert("Aucune ligne exploitable."); return; }
      const nbC = plan.filter(p => p.statut === "créé").length, nbM = plan.length - nbC;
      const apercu = h(`<div>
        <h2>Prévisualisation — « ${esc(categorie)} »</h2>
        <p class="info-txt"><span class="etiquette" style="background:#dcfce7;border-color:#86efac;color:#166534;">${nbC} création(s)</span>
          <span class="etiquette" style="background:#ffedd5;border-color:#fdba74;color:#9a3412;">${nbM} mise(s) à jour</span></p>
        <div class="enveloppe-table" style="max-height:300px;overflow-y:auto;"><table>
          <thead><tr><th>Label</th><th>Codes</th><th>Devenir</th></tr></thead>
          <tbody>${plan.map(p => `<tr><td>${esc(p.nom)}</td>
            <td>${esc(Object.entries(p.codes).map(([c, v]) => c + " = " + v).join(", ") || "—")}</td>
            <td>${p.statut === "créé" ? "🟢 création" : "🟠 mise à jour"}</td></tr>`).join("")}</tbody>
        </table></div>
        <div class="ligne-boutons"><button id="m-ann2">Annuler</button>
          <button id="m-ok" class="b-bleu">Importer ${plan.length} ligne(s)</button></div>
      </div>`);
      modal(apercu, true);
      apercu.querySelector("#m-ann2").onclick = () => apercu.closest(".modal-fond").remove();
      apercu.querySelector("#m-ok").onclick = () => {
        // Application : nouvelles colonnes ajoutées, labels créés/mis à jour.
        plan.forEach(p => {
          Object.keys(p.codes).forEach(c => { if (!cat.colonnes.includes(c) && c.length <= 32) cat.colonnes.push(c); });
          if (p.cible) Object.assign(p.cible.codes, p.codes);
          else { const r = Noyau.ajouterLabel(d, categorie, p.nom, "local"); if (r.ok) Object.assign(cat.labels[cat.labels.length - 1].codes, p.codes); }
        });
        BD.sauver(); apercu.closest(".modal-fond").remove(); form.closest(".modal-fond").remove();
        dessiner(); if (majAlertes) majAlertes();
      };
    };
  };
  return racine;
}

/* Onglet « Colonnes calculées » : définit les compteurs disponibles
   dans le menu ⚙ Colonnes du tableau « Toutes les lignes ». */
const CIBLES = [["vehicules", "types de véhicule"], ["energies", "types d'énergie"], ["fonctions", "fonctions embarquées"]];
function vueColonnesCalculees(d) {
  const racine = h(`<div>
    <p class="info-txt">Une colonne calculée compte, pour chaque ligne, le nombre d'éléments cochés dans une liste.
      Elle apparaît ensuite dans le tableau « Toutes les lignes » via le menu ⚙ Colonnes.</p>
    <div class="inline-flex" style="margin-bottom:10px;">
      <button id="u-add" class="b-bleu">+ Ajouter une colonne calculée</button>
    </div>
    <div class="enveloppe-table"><table>
      <thead><tr><th>Nom de la colonne</th><th>Compte</th><th style="text-align:right;">Actions</th></tr></thead>
      <tbody id="u-corps"></tbody>
    </table></div>
  </div>`);
  const corps = racine.querySelector("#u-corps");
  const dessiner = () => {
    corps.innerHTML = "";
    (d.colonnesCalculees || []).forEach((c, i) => {
      const cible = (CIBLES.find(x => x[0] === c.cible) || [c.cible, c.cible])[1];
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${esc(c.nom)}</td><td>Nombre de ${esc(cible)}</td><td style="text-align:right;"></td>`;
      const actions = tr.lastElementChild;
      actions.appendChild(boutonSupprimer("Supprimer", () => { d.colonnesCalculees.splice(i, 1); BD.sauver(); dessiner(); }));
      corps.appendChild(tr);
    });
    if (!(d.colonnesCalculees || []).length) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="3" style="text-align:center;color:#64748b;">Aucune colonne calculée.</td>`;
      corps.appendChild(tr);
    }
  };
  dessiner();
  racine.querySelector("#u-add").onclick = () => {
    const form = h(`<div>
      <h2>Nouvelle colonne calculée</h2>
      <div class="champ"><label>Nom de la colonne</label><input id="m-nom" placeholder="ex. Nb véhicules"/></div>
      <div class="champ"><label>Que compte-t-on ?</label>
        <select id="m-cible">${CIBLES.map(([cle, txt]) => `<option value="${cle}">Nombre de ${txt}</option>`).join("")}</select></div>
      <div class="ligne-boutons"><button id="m-ann">Annuler</button><button id="m-ok" class="b-bleu">Créer</button></div>
    </div>`);
    modal(form);
    form.querySelector("#m-ann").onclick = () => form.closest(".modal-fond").remove();
    form.querySelector("#m-ok").onclick = () => {
      const nom = form.querySelector("#m-nom").value.trim();
      if (!nom) return;
      d.colonnesCalculees.push({ nom, cible: form.querySelector("#m-cible").value });
      BD.sauver(); form.closest(".modal-fond").remove(); rafraichir();
    };
  };
  return racine;
}

/* ============ 4. TESTS : suite automatique sur le noyau ============ */
/* Principe : on manipule un jeu de données fictif EN MÉMOIRE (jamais
   sauvegardé) et on compare le résultat à ce qu'on attend. Un test
   échoué = un message précis sur la régression. Relancez après chaque
   modification de l'appli. */
function lancerTests() {
  const results = [];
  const test = (nom, fn) => {
    try { fn(); results.push({ nom, ok: true }); }
    catch (e) { results.push({ nom, ok: false, msg: e.message }); }
  };
  const assert = (cond, msg) => { if (!cond) throw new Error(msg); };

  test("Instance neuve contient les 7 catégories du catalogue", () => {
    const d = Noyau.instanceNeuve();
    assert(Object.keys(d.catalogue).length === 7, "7 catégories attendues (V2.6 : + Zones)");
    assert(d.lignes.length === 0, "Aucune ligne au départ");
    // Le catalogue est maintenant un classeur : labels avec origine + codes.
    assert(d.catalogue["Activités"].labels[0].origine === "standard", "Les labels d'origine sont 'standard'");
  });

  test("Une ligne valide passe la validation", () => {
    const d = Noyau.instanceNeuve();
    d.reseaux.push({ id: "r1", nom: "STAR", validiteDebut: "2026-09-01", validiteFin: "2099-12-31" });
    const errs = Noyau.validerLigne(d, { abrev: "A", nom: "Ligne A", reseauId: "r1", activite: "Urbaine", mode: "Autobus" }, null);
    assert(errs.length === 0, "Aucune erreur attendue, reçues : " + errs.join(" "));
  });

  test("Une ligne sans activité ni mode est refusée", () => {
    const d = Noyau.instanceNeuve();
    d.reseaux.push({ id: "r1", nom: "STAR", validiteDebut: "", validiteFin: "" });
    const errs = Noyau.validerLigne(d, { abrev: "A", nom: "Ligne A", reseauId: "r1", activite: "", mode: "" }, null);
    assert(errs.some(e => e.includes("Activité")), "L'erreur 'Activité obligatoire' manque");
    assert(errs.some(e => e.includes("Mode")), "L'erreur 'Mode obligatoire' manque");
  });

  test("Deux lignes ne peuvent pas avoir la même abréviation", () => {
    const d = Noyau.instanceNeuve();
    d.reseaux.push({ id: "r1", nom: "STAR", validiteDebut: "", validiteFin: "" });
    assert(Noyau.validerLigne(d, { abrev: "A", nom: "Ligne A", reseauId: "r1", activite: "Urbaine", mode: "Autobus" }, null).length === 0,
      "La première ligne devrait être valide");
    d.lignes.push({ id: "l1", abrev: "A", nom: "Ligne A", reseauId: "r1", activite: "Urbaine", mode: "Autobus", vehicules: [], energies: [], fonctions: [] });
    const errs2 = Noyau.validerLigne(d, { abrev: "a", nom: "Autre", reseauId: "r1", activite: "Urbaine", mode: "Autobus" }, null);
    assert(errs2.some(e => e.includes("Abréviation")), "Le doublon d'abréviation (même casse) doit être détecté");
  });

  test("Catalogue : ajout, refus de doublon, modification, suppression", () => {
    const d = Noyau.instanceNeuve();
    assert(Noyau.ajouterLabel(d, "Activités", "Navette nocturne").ok, "L'ajout devrait réussir");
    assert(!Noyau.ajouterLabel(d, "Activités", "urbaine").ok, "Un doublon (même casse) doit être refusé");
    Noyau.modifierLabel(d, "Activités", 0, "Urbaine dense");
    assert(d.catalogue["Activités"].labels[0].nom === "Urbaine dense", "Le label modifié doit remplacer l'ancien");
    assert(d.catalogue["Activités"].labels[0].origine === "local", "Un label modifié devient 'local' (orange)");
    const avant = d.catalogue["Modes de transport"].labels.length;
    Noyau.supprimerLabel(d, "Modes de transport", 0);
    assert(d.catalogue["Modes de transport"].labels.length === avant - 1, "La suppression doit retirer exactement 1 label");
  });

  test("Mise à jour standards : ajouts automatiques marqués 'standard', code GTFS pré-rempli, idempotente", () => {
    const d = Noyau.instanceNeuve();
    const r1 = Noyau.majReferentiel(d);
    assert(r1.ajoutes > 0, "La 1re mise à jour doit ajouter des labels");
    const metro = d.catalogue["Modes de transport"].labels.find(x => x.nom === "Métro");
    assert(metro && metro.codes["export"] === "1", "Le Métro doit être ajouté avec le code GTFS '1'");
    assert(metro.origine === "standard", "Un label ajouté automatiquement est 'standard' (bleu)");
    const r2 = Noyau.majReferentiel(d);
    assert(r2.ajoutes === 0, "Une 2e mise à jour ne doit rien ajouter (idempotence)");
  });

  test("Label utilisé : suppression refusée, renommage répercuté sur les lignes", () => {
    const d = Noyau.instanceNeuve();
    d.reseaux.push({ id: "r1", nom: "STAR", validiteDebut: "", validiteFin: "" });
    d.lignes.push({ id: "l1", abrev: "A", nom: "Ligne A", reseauId: "r1", contratId: null, activite: "Urbaine", mode: "Autobus", groupe: "", vehicules: ["Minibus"], energies: [], fonctions: [] });
    const idxAct = d.catalogue["Activités"].labels.findIndex(x => x.nom === "Urbaine");
    // Suppression refusée : le label est utilisé par 1 ligne.
    const r = Noyau.supprimerLabel(d, "Activités", idxAct);
    assert(!r.ok && r.erreur.includes("1 ligne"), "La suppression d'un label utilisé doit être refusée en citant le nombre de lignes");
    assert(Noyau.usagesLabel(d, "Types de véhicule", "Minibus").length === 1, "Le Minibus est utilisé par 1 ligne");
    // Renommage : les lignes qui l'utilisaient suivent le changement.
    Noyau.modifierLabel(d, "Activités", idxAct, "Urbaine dense");
    assert(d.lignes[0].activite === "Urbaine dense", "Le renommage doit être répercuté sur la ligne");
  });

  test("Réseaux/contrats : noms uniques + usages comptés avant suppression", () => {
    const d = Noyau.instanceNeuve();
    d.reseaux.push({ id: "r1", nom: "STAR", validiteDebut: "", validiteFin: "" });
    d.contrats.push({ id: "c1", nom: "Délégation", reseaux: ["r1"] });
    d.lignes.push({ id: "l1", abrev: "A", nom: "Ligne A", reseauId: "r1", contratId: "c1", activite: "Urbaine", mode: "Autobus", groupe: "", vehicules: [], energies: [], fonctions: [] });
    assert(Noyau.nomUtilise(d.reseaux, "star", null), "Un doublon de nom de réseau doit être détecté (même casse)");
    assert(!Noyau.nomUtilise(d.contrats, "Autre contrat", null), "Un nom de contrat libre doit être accepté");
    const u = Noyau.usagesReseau(d, "r1");
    assert(u.lignes.length === 1 && u.contrats.length === 1, "Le réseau est utilisé par 1 ligne et 1 contrat");
    assert(Noyau.usagesContrat(d, "c1").lignes.length === 1, "Le contrat est utilisé par 1 ligne");
    d.lignes = []; d.contrats = [];
    assert(Noyau.usagesReseau(d, "r1").lignes.length === 0 && Noyau.usagesReseau(d, "r1").contrats.length === 0, "Sans utilisations, la suppression redevient autorisée");
  });

  test("Codes d'export : doublons détectés dans une catégorie", () => {
    const d = Noyau.instanceNeuve();
    const modes = d.catalogue["Modes de transport"].labels;
    modes[0].codes["export"] = "3";
    modes.find(x => x.nom !== modes[0].nom).codes["export"] = "3"; // doublon volontaire
    assert(Noyau.doublonsCodes(d, "Modes de transport", "export").includes("3"), "Le code en doublon doit être détecté");
  });

  /* ---- Tests de persistance (famille B) ----
     Ils manipulent la VRAIE base locale : on sauvegarde son contenu au
     départ, on travaille sur une base vierge, puis on restaure tout.
     Comme ça, lancer les tests ne touche jamais aux vraies données. */
  const isoler = (fn) => {
    const backup = localStorage.getItem("hastus_libre_v1");
    try { BD._raz(); localStorage.removeItem("hastus_libre_v1"); fn(); }
    finally {
      if (backup === null) localStorage.removeItem("hastus_libre_v1");
      else localStorage.setItem("hastus_libre_v1", backup);
      BD._raz(); // le prochain accès relira l'état restauré
    }
  };

  test("Persistance : recharger la page ne perd rien (lignes, session)", () => isoler(() => {
    const e = BD.lire();
    e.utilisateurs.push({ id: "u1", nom: "Testeur", mdp: "YWJjZA==", admin: true });
    e.session = "u1";
    e.instances.push({ id: "i1", nom: "Essai", desc: "", proprio: "u1", membres: [] });
    e.donnees["i1"] = Noyau.instanceNeuve();
    e.donnees["i1"].lignes.push({ id: "o1", abrev: "A", nom: "Ligne A", reseauId: null, contratId: null, activite: "Urbaine", mode: "Autobus", groupe: "", vehicules: [], energies: [], fonctions: [] });
    BD.sauver();
    BD._raz(); // simule un rechargement complet de la page
    const d2 = BD.donneesInstance("i1");
    assert(!!d2 && d2.lignes.length === 1 && d2.lignes[0].abrev === "A", "La ligne doit survivre au rechargement");
    assert(!!BD.utilisateurCourant() && BD.utilisateurCourant().nom === "Testeur", "La session doit être conservée");
  }));

  test("Duplication : la copie vit sa vie indépendamment (via la vraie BD)", () => isoler(() => {
    const e = BD.lire();
    e.utilisateurs.push({ id: "u1", nom: "T", mdp: "eA==", admin: true });
    e.session = "u1";
    e.instances.push({ id: "i1", nom: "Orig", desc: "", proprio: "u1", membres: [] });
    e.donnees["i1"] = Noyau.instanceNeuve();
    e.donnees["i1"].lignes.push({ id: "o1", abrev: "A", nom: "Ligne A", reseauId: null, contratId: null, activite: "Urbaine", mode: "Autobus", groupe: "", vehicules: [], energies: [], fonctions: [] });
    BD.sauver();
    const r = BD.dupliquerInstance("i1", "Copie", "");
    assert(r.ok, "La duplication doit réussir : " + (r.erreur || ""));
    const copie = e.instances.find(i => i.nom === "Copie");
    BD.donneesInstance(copie.id).lignes[0].nom = "Modifié dans la copie";
    assert(BD.donneesInstance("i1").lignes[0].nom === "Ligne A", "L'original ne doit jamais être modifié par la copie");
  }));

  test("Limites : 32/256 caractères appliquées côté données", () => isoler(() => {
    const e = BD.lire();
    e.utilisateurs.push({ id: "u1", nom: "T", mdp: "eA==", admin: true });
    e.session = "u1";
    BD.sauver();
    const r = BD.creerInstance("N".repeat(100), "D".repeat(1000));
    assert(r.ok, "La création doit réussir avec bornage automatique");
    const inst = e.instances[0];
    assert(inst.nom.length === 32, "Le nom doit être borné à 32 caractères, reçu " + inst.nom.length);
    assert(inst.desc.length === 256, "La description doit être bornée à 256, reçu " + inst.desc.length);
    BD.modifierInstance(inst.id, "N".repeat(100), "");
    assert(e.instances.find(x => x.id === inst.id).nom.length === 32, "La modification doit aussi être bornée");
  }));

  test("Droits : un non-membre ne voit pas l'instance d'autrui", () => isoler(() => {
    BD.inscrire("Chef", "abcd");   // 1er compte créé → administrateur
    BD.creerInstance("Instance du Chef", "");
    BD.inscrire("Invité", "abcd"); // 2e compte → simple membre, session active
    assert(BD.mesInstances().length === 0, "L'invité ne doit voir aucune instance");
    BD.affecterMembre(BD.lire().instances[0].id, BD.lire().utilisateurs.find(u => u.nom === "Invité").id);
    assert(BD.mesInstances().length === 1, "Après affectation, l'invité doit voir l'instance");
  }));

  test("Import masse : valeur obligatoire inconnue créée automatiquement", () => {
    const d = Noyau.instanceNeuve();
    d.reseaux.push({ id: "r1", nom: "STAR", validiteDebut: "", validiteFin: "" });
    const res = Noyau.appliquerColle(d, "Abrév\tNom\tRéseau\tContrat\tActivité\tMode\nZ\tNouvelle\tRÉSEAU NOUVEAU\t\tScolaire\tTéléphérique");
    assert(res.crees === 1, "La ligne doit être créée");

    assert(l && d.reseaux.some(r => r.nom === "RÉSEAU NOUVEAU" && r.id === l.reseauId), "Le réseau inconnu doit être créé et rattaché à la ligne");

    assert(d.catalogue["Modes de transport"].labels.some(x => x.nom === "Téléphérique" && x.origine === "local"), "Le nouveau mode doit exister dans le catalogue, marqué 'local' (orange, à paramétrer)");
  });

  test("Import masse : doublon de nom commercial signalé comme suspect", () => {
    const d = Noyau.instanceNeuve();
    d.reseaux.push({ id: "r1", nom: "STAR", validiteDebut: "", validiteFin: "" });

    const res = Noyau.appliquerColle(d, "B	Ligne A	STAR			");
    assert(res.crees === 1 && res.suspects.length === 1, "Une création portant un nom déjà utilisé doit être signalée suspecte");
    assert(res.suspects[0].abrev === "B", "Le suspect signalé doit être la ligne B");

  test("Identifiants : deux créations rapides restent distinctes (bug corrigé)", () => isoler(() => {
    BD.inscrire("Alpha", "abcd");
    BD.inscrire("Beta", "abcd");
    const e = BD.lire();
    assert(e.utilisateurs[0].id !== e.utilisateurs[1].id, "Deux utilisateurs créés à la suite doivent avoir des ids différents");
    // Conséquence directe : Beta ne voit PAS l'instance d'Alpha.
    BD.connecter("Alpha", "abcd");
    BD.creerInstance("Chez Alpha", "");
    BD.connecter("Beta", "abcd");
    assert(BD.mesInstances().length === 0, "Beta ne doit voir aucune instance d'Alpha");
  }));

  test("Colonne calculée : elle compte ce qu'elle annonce", () => {
    const d = Noyau.instanceNeuve();
    d.colonnesCalculees.push({ nom: "Nb véhicules", cible: "vehicules" });
    const l = { id: "o1", abrev: "A", nom: "Ligne A", vehicules: ["Bus standard 12 m", "Minibus"], energies: [], fonctions: [] };
    assert(Noyau.valeurColCalculee(l, d.colonnesCalculees[0]) === 2, "La colonne doit compter 2 véhicules, reçu " + Noyau.valeurColCalculee(l, d.colonnesCalculees[0]));
  });

  test("Colle Excel : mise à jour, création, en-tête ignoré", () => {
    const d = Noyau.instanceNeuve();
    d.reseaux.push({ id: "r1", nom: "STAR", validiteDebut: "", validiteFin: "" });
    d.contrats.push({ id: "c1", nom: "Délégation", reseaux: ["r1"] });
    d.lignes.push({ id: "l1", abrev: "A", nom: "Ligne A", reseauId: "r1", contratId: null, activite: "Urbaine", mode: "Autobus", vehicules: [], energies: [], fonctions: [] });
    const colle = "Abrév\tNom\tRéseau\tContrat\tActivité\tMode\nA\tLigne A modifiée\tSTAR\tDélégation\tUrbaine\tAutocar\nB\tNouvelle ligne\tSTAR\t\t\t";
    const res = Noyau.appliquerColle(d, colle);
